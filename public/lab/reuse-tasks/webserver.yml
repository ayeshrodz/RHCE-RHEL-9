---
# One long play. In this exercise you split it into reusable files.
- name: Web servers are configured
  hosts: web
  vars:
    packages:
      - httpd
      - firewalld
  tasks:
    - name: Packages are installed
      ansible.builtin.dnf:
        name: "{{ packages }}"
        state: present

    - name: firewalld is running
      ansible.builtin.service:
        name: firewalld
        state: started
        enabled: true

    - name: http is allowed through the firewall
      ansible.posix.firewalld:
        service: http
        permanent: true
        immediate: true
        state: enabled

    - name: https is allowed through the firewall
      ansible.posix.firewalld:
        service: https
        permanent: true
        immediate: true
        state: enabled

    - name: Home page is in place
      ansible.builtin.copy:
        content: "Served by {{ inventory_hostname }}\n"
        dest: /var/www/html/index.html

    - name: httpd is running
      ansible.builtin.service:
        name: httpd
        state: started
        enabled: true

- name: The site answers
  hosts: localhost
  become: false
  gather_facts: false
  tasks:
    - name: Every web server returns its page
      ansible.builtin.uri:
        url: "http://{{ item }}"
        status_code: 200
      loop: "{{ groups['web'] }}"
