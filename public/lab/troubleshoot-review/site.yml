---
- name: Web server is configured
  hosts: webserver
  vars:
    web_admin: webmaster@example.com
  tasks:
    - name: Web package is installed
      ansible.builtin.dnf:
        name: httpd
        state: present

    - name: Virtual host settings are in place
      ansible.builtin.template:
        src: templates/vhost.conf.j2
        dest: /etc/httpd/conf.d/vhost.conf
        mode: "0644"
      notify: restart web

    - name: Home page is in place
      ansible.builtin.copy:
        content: "Review lab page\n"
        dest: /var/www/html/index.html

    - name: Web service is running
      ansible.builtin.service:
        name: httpd
        state: started
        enabled: true

  handlers:
    - name: restart httpd
      ansible.builtin.service:
        name: httpd
        state: restarted

- name: The site answers
  hosts: localhost
  become: false
  gather_facts: false
  tasks:
    - name: Home page returns our text
      ansible.builtin.uri:
        url: http://serverb.lab.example.com
        return_content: true
      register: page
      failed_when: "'Review lab page' not in page.content"
