name: CI

# Runs on every pull request (including from forks). It only builds and checks
# formatting: it has no deploy step and no access to secrets.
on:
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Check formatting
        run: npm run format:check
      - name: JavaScript regression tests
        run: npm run test --if-present
      - name: Lab-tool regression tests
        if: hashFiles('tests/lab_grade_test.py') != ''
        run: python3 -m unittest discover -s tests -p '*_test.py'
      - name: Build the site
        run: npm run build
