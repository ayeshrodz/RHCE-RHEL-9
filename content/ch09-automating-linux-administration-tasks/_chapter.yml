title: Automating Linux Administration Tasks
goal: "Automate common system administration tasks: software, users, boot and scheduling, storage and networking."
objectives:
  - Install and update software, configure repositories and check what is installed.
  - Manage users, groups, SSH keys and sudo rights.
  - Manage services, the boot target, reboots and scheduled jobs.
  - Partition disks and manage LVM, file systems and mounts.
  - Inspect and change network configuration.
