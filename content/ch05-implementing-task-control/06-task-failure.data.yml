check:
  questions:
    - id: q-06e576552831
      legacyIndex: 0
      q: A task notifies a handler and reports changed; a later task fails. Without extra keywords, does the handler run?
      options:
        - Yes, handlers always run
        - "No, unless the play sets `force_handlers: true`"
        - Only if the handler is listed first
      answer: 1
      explain: A failure stops the play on that host, and pending handlers are dropped unless force_handlers is set.
    - id: q-d745b7f744be
      legacyIndex: 1
      q: Which keyword stops a read-only `command` task from reporting changed?
      options:
        - "`ignore_errors: true`"
        - "`changed_when: false`"
        - "`failed_when: false`"
      answer: 1
      explain: "`changed_when: false` makes the task always report ok when it succeeds."
    - id: q-5893c0aa6043
      legacyIndex: 2
      q: When do tasks under `rescue` run?
      options:
        - Always
        - Only if a task in the block failed
        - Only if the always section failed
      answer: 1
      explain: rescue handles ordinary task failures; always follows the block and recovery. Unreachable hosts and invalid tasks are exceptions.
    - id: q-5e2b921d22e5
      legacyIndex: 3
      q: A script exits with 0 but prints "ERROR". How do you make the task fail?
      options:
        - "`ignore_errors: false`"
        - "`failed_when: \"'ERROR' in result.stdout\"` (with `register: result`)"
        - "`changed_when: true`"
      answer: 1
      explain: failed_when replaces the default rule (non-zero rc) with your own condition.
