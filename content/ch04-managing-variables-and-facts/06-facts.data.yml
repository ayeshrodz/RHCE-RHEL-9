fact-gathering:
  text:
    label: Fact gathering mode
    widgetLabel: What runs
    fgName: TASK [
    fgName2: "]"
    p: "ansible_facts:"
    label2: fully populated
    label3: hardware facts, plus a small core set that is always gathered
  data:
    modes:
      - label: default
        yaml: |-
          - name: Default behaviour
            hosts: webservers
            tasks:
              - name: Show the kernel
                ansible.builtin.debug:
                  var: ansible_facts['kernel']
        steps:
          - name: Gathering Facts
            note: setup runs automatically
            kind: setup
          - name: Show the kernel
            note: '"5.14.0-70.13.1.el9_0.x86_64"'
            kind: ok
        facts: all
        text: Every play starts with an automatic Gathering Facts task that runs ansible.builtin.setup on each host. All facts are available to every task.
      - label: "gather_facts: false"
        yaml: |-
          - name: Faster play without facts
            hosts: webservers
            gather_facts: false
            tasks:
              - name: Show the kernel
                ansible.builtin.debug:
                  var: ansible_facts['kernel']
        steps:
          - name: Show the kernel
            note: VARIABLE IS NOT DEFINED!
            kind: fail
        facts: none
        text: No setup step, so the play starts faster and puts less load on hosts. Useful when you do not need facts, or when hosts cannot run setup yet. Any task that reads a fact finds it undefined.
      - label: false + setup task
        yaml: |-
          - name: Gather facts later
            hosts: webservers
            gather_facts: false
            tasks:
              - name: Install Python bindings first
                ansible.builtin.dnf:
                  name: python3-libselinux
              - name: Manually gather facts
                ansible.builtin.setup:
              - name: Show the kernel
                ansible.builtin.debug:
                  var: ansible_facts['kernel']
        steps:
          - name: Install Python bindings first
            note: no facts yet
            kind: ok
          - name: Manually gather facts
            note: setup runs now
            kind: setup
          - name: Show the kernel
            note: '"5.14.0-70.13.1.el9_0.x86_64"'
            kind: ok
        facts: all
        text: Turn off automatic gathering, prepare the host, then run ansible.builtin.setup as a normal task whenever you are ready. You can also re-run setup later to refresh facts.
      - label: gather_subset
        yaml: |-
          - name: Only hardware facts
            hosts: webservers
            gather_facts: false
            tasks:
              - name: Collect only hardware facts
                ansible.builtin.setup:
                  gather_subset:
                    - hardware
              # '!hardware' would mean: everything except hardware
        steps:
          - name: Collect only hardware facts
            note: "setup: gather_subset=hardware"
            kind: setup
        facts: subset
        text: setup can collect a subset instead of everything. List subsets such as hardware or network, or prefix one with ! to gather everything except that subset. A minimal core set of facts is always collected either way.
  dependencies:
    DataExplorer:
      text:
        widgetLabel: ": click to explore"
        widgetLabel2: Reference it as
        template: "{{ {value0} }}"
        template2: "{{ {value0} }}"
        dxWarn: " is also the name of a Python dictionary method, so dot notation may return the method instead of your data. Use brackets here."
        widgetLabel3: Old injected name
        template3: "{{ {value0} }}"
        widgetLabel4: Value
      data: {}
check:
  questions:
    - id: q-aaa736d87b77
      legacyIndex: 0
      q: Which module gathers facts?
      options:
        - "`ansible.builtin.facts`"
        - "`ansible.builtin.setup`"
        - "`ansible.builtin.gather`"
      answer: 1
      explain: The automatic Gathering Facts task runs `ansible.builtin.setup`, and you can run it yourself as a task.
    - id: q-71f6ee551a26
      legacyIndex: 1
      q: How do you reference the host’s main IPv4 address?
      options:
        - "`ansible_facts['ipv4']`"
        - "`ansible_facts['default_ipv4']['address']`"
        - "`ansible_facts['interfaces']['address']`"
      answer: 1
      explain: default_ipv4 describes the interface used for the default route; its address key holds the IP.
    - id: q-d6762e07d140
      legacyIndex: 2
      q: "A play has `gather_facts: false` and a task prints `ansible_facts['kernel']`. What happens?"
      options:
        - It prints the kernel version
        - The variable is undefined
        - Ansible gathers facts automatically anyway
      answer: 1
      explain: With gathering off, facts are empty until you run `ansible.builtin.setup` yourself.
    - id: q-c1c2486e6414
      legacyIndex: 3
      q: What is the older, injected name for `ansible_facts['fqdn']`?
      options:
        - "`fqdn`"
        - "`ansible_fqdn`"
        - "`facts_fqdn`"
      answer: 1
      explain: Injected facts use the ansible_ prefix plus the fact name.
