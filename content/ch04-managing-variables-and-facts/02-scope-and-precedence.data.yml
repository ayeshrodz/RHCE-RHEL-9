variable-precedence:
  text:
    widgetTitle: "Where is "
    code: package
    widgetTitle2: " defined?"
    widgetSub: Switch definitions on and off, or edit their values. The highest one that is set wins.
    label: "{{ package }}"
    widgetLabel: " is"
    vprecFrom: "from "
    span: higher precedence
    template: "{value0}: {value1}"
    template2: Value from {value0}
    vprecStatus: " wins"
    label2: not set
  data:
    levels:
      - where: Inventory group variable
        example: |-
          [webservers:vars]
          package=httpd
        value: httpd
      - where: group_vars/ file
        example: group_vars/webservers
        value: httpd-core
      - where: Inventory host variable
        example: servera package=nginx
        value: nginx
      - where: host_vars/ file
        example: host_vars/servera
        value: lighttpd
      - where: Host fact
        example: gathered by setup
        value: (fact)
      - where: Play variable
        example: "vars: / vars_files:"
        value: apache
      - where: Task variable
        example: "vars: on one task"
        value: caddy
      - where: Extra variable
        example: -e "package=tomcat"
        value: tomcat
group-vars-resolver:
  text:
    template: "package: {value0}"
    label: not created
    widgetLabel: Pick a host
    gvrMembership: " is in "
    gvrMembership2: ", a child of "
    code: datacenters
    gvrMembership3: .
    caption: Click a group_vars or host_vars file to create or delete it.
    widgetLabel2: "Applies to "
    widgetLabel3: ", strongest first"
    termMuted: No file sets package for this host, so it is undefined.
    span: " · "
    label2: "{{ package }}"
    gvrAnswer: " = "
  data:
    files:
      group_vars/datacenters:
        kind: parent group
        group: datacenters
        value: httpd
        rank: 1
      group_vars/datacenter1:
        kind: group
        group: datacenter1
        value: httpd
        rank: 2
      group_vars/datacenter2:
        kind: group
        group: datacenter2
        value: apache
        rank: 2
      host_vars/demo1.example.com:
        kind: host
        host: demo1.example.com
        value: httpd
        rank: 3
      host_vars/demo2.example.com:
        kind: host
        host: demo2.example.com
        value: apache
        rank: 3
      host_vars/demo3.example.com:
        kind: host
        host: demo3.example.com
        value: mariadb-server
        rank: 3
      host_vars/demo4.example.com:
        kind: host
        host: demo4.example.com
        value: mysql-server
        rank: 3
    hosts:
      demo1.example.com:
        - datacenters
        - datacenter1
      demo2.example.com:
        - datacenters
        - datacenter1
      demo3.example.com:
        - datacenters
        - datacenter2
      demo4.example.com:
        - datacenters
        - datacenter2
    initialSelection1: demo3.example.com
project-tree:
  props:
    paths:
      - ansible.cfg
      - group_vars/datacenters
      - group_vars/datacenter1
      - group_vars/datacenter2
      - host_vars/demo1.example.com
      - host_vars/demo2.example.com
      - host_vars/demo3.example.com
      - host_vars/demo4.example.com
      - inventory
      - playbook.yml
    notes:
      group_vars/datacenters: every host in both datacenters
      group_vars/datacenter1: demo1, demo2
      group_vars/datacenter2: demo3, demo4
      host_vars/demo1.example.com: demo1 only
check:
  questions:
    - id: q-357aa89202b2
      legacyIndex: 0
      q: "`group_vars/webservers` sets `port: 80`, `host_vars/servera` sets `port: 8080`, and the play has `vars: { port: 8443 }`. What does servera use?"
      options:
        - "80"
        - "8080"
        - "8443"
      answer: 2
      explain: Play variables beat all inventory variables, including host_vars.
    - id: q-48493515c72c
      legacyIndex: 1
      q: Same project, but you remove the play variable. What does servera use now?
      options:
        - "80"
        - "8080"
        - It is undefined
      answer: 1
      explain: Host variables beat group variables.
    - id: q-babd47db8acf
      legacyIndex: 2
      q: How do you override a variable for a single run without editing any file?
      options:
        - "`--limit port=9000`"
        - '`-e "port=9000"`'
        - "`--vars port=9000`"
      answer: 1
      explain: "`-e` (or `--extra-vars`) sets extra variables, which have the highest precedence."
    - id: q-e716465820a2
      legacyIndex: 3
      q: What name must the file have to hold variables for the group `db_servers`?
      options:
        - "`group_vars/db_servers`"
        - "`group_vars/db_servers.cfg`"
        - "`vars/db_servers`"
      answer: 0
      explain: The file (or a directory) in group_vars is named after the group. A `.yml` or `.yaml` extension is also accepted.
