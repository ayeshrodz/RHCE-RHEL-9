flashcards:
  cards:
    - front: What are the two types of machine in an Ansible architecture?
      back: The **control node**, where Ansible runs, and **managed hosts**, which Ansible configures.
    - front: "Playbook, play, task, module: how do they nest?"
      back: A playbook contains plays; a play is an ordered list of tasks for some hosts; each task runs one module.
    - front: What does idempotent mean for a playbook?
      back: Running it again on hosts already in the desired state makes **no changes** (`changed=0`).
    - front: Why are `command` and `shell` tasks risky?
      back: Ansible cannot tell whether the command was needed, so they report `changed` every run and are easy to make non-idempotent.
    - front: What is an automation execution environment?
      back: A **container image** with Ansible Core, collections and dependencies, used by ansible-navigator and automation controller.
    - front: Which tool builds custom execution environments?
      back: "`ansible-builder`"
    - front: Automation controller used to be called…
      back: Red Hat Ansible **Tower**.
    - front: Which collection always ships with Ansible Core?
      back: "`ansible.builtin`"
    - front: What does a Linux managed host need for most modules?
      back: SSH access and **Python 3.8 or later** (plus sudo for privilege escalation).
    - front: Where do network device modules usually run?
      back: On the **control node**, talking to the device via CLI over SSH, XML over SSH or an HTTP(S) API.
