check:
  questions:
    - id: q-f9250bf18f92
      legacyIndex: 0
      q: A server managed by Ansible needs a new kernel parameter. What is the right way to add it?
      options:
        - SSH in, edit `/etc/sysctl.conf`, and note the change in the wiki
        - Add the setting to the automation code, get it reviewed, and re-run the automation
        - Change it by hand now, and update the automation later if there is time
      answer: 1
      explain: Manual changes are invisible to the automation and are likely to be overwritten or lost. Changing the code keeps every server consistent and the change documented.
