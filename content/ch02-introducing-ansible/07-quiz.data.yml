chapter:
  questions:
    - id: q-6c352a8d108b
      legacyIndex: 0
      q: Which term best describes the Ansible architecture?
      options:
        - Agentless
        - Client/server
        - Event-driven
        - Stateless
      answer: 0
      explain: Nothing Ansible-specific runs on managed hosts. The control node connects over standard protocols, pushes modules, runs them and removes them.
    - id: q-f38e26846d80
      legacyIndex: 1
      q: Which network protocol does Ansible use by default to communicate with managed Linux hosts?
      options:
        - HTTP
        - HTTPS
        - SNMP
        - SSH
      answer: 3
      explain: OpenSSH is the default for Linux and UNIX. Windows hosts usually use WinRM.
    - id: q-4b1fb0ef8d0f
      legacyIndex: 2
      q: Which file defines the actions that Ansible performs on managed hosts?
      options:
        - Host inventory
        - Manifest
        - Playbook
        - Script
      answer: 2
      explain: Playbooks contain plays, which contain the tasks to run. The inventory only lists and groups hosts.
    - id: q-fabdc185a014
      legacyIndex: 3
      q: Which syntax is used to write Ansible Playbooks?
      options:
        - Bash
        - Perl
        - Python
        - YAML
      answer: 3
      explain: Playbooks are YAML text files, usually saved with a `.yml` extension. Modules themselves are often written in Python, but you do not write playbooks in it.
    - id: q-9240c10dab6f
      legacyIndex: 4
      q: Where must Ansible software be installed?
      options:
        - On every managed host
        - Only on the control node (and inside the execution environments it uses)
        - On a dedicated Ansible server that hosts connect back to
      answer: 1
      explain: Only the control node needs Ansible. With ansible-navigator, Ansible Core actually runs inside the execution environment container on the control node.
    - id: q-bdcdec7e6c6e
      legacyIndex: 5
      q: What is the relationship between plays, tasks and modules?
      options:
        - A module contains plays; a play contains tasks
        - A play is an ordered list of tasks against a set of hosts; each task runs one module
        - A task contains several plays that each run a module
      answer: 1
      explain: Playbook → plays → tasks → one module per task.
    - id: q-50f22a40c31d
      legacyIndex: 6
      q: The `ansible-core` RPM in RHEL 9 AppStream is supported by Red Hat for which use?
      options:
        - Any playbook and any module
        - Only automation provided or generated by Red Hat products, such as rhel-system-roles and Insights remediation
        - It is not supported at all
      answer: 1
      explain: Support for the RHEL-included ansible-core is limited to content shipped by Red Hat products. Full support needs Ansible Automation Platform.
    - id: q-d2341a3a613f
      legacyIndex: 7
      q: Which AAP 2 component builds custom automation execution environments?
      options:
        - ansible-navigator
        - automation hub
        - ansible-builder
        - automation controller
      answer: 2
      explain: "`ansible-builder` builds EE images. Navigator and controller run playbooks inside them; hub distributes content and images."
    - id: q-b063dca92a85
      legacyIndex: 8
      q: What does `ansible-navigator` replace?
      options:
        - "`ssh` and `scp`"
        - "`ansible-playbook`, `ansible-inventory`, `ansible-config`, `ansible-doc` and similar tools"
        - Podman
      answer: 1
      explain: Navigator wraps those tools in one command and runs automation inside an execution environment. It uses Podman to start that container.
    - id: q-d27598f34f65
      legacyIndex: 9
      q: Which package should be present on a managed host with SELinux enabled before you use the copy, file or template modules?
      options:
        - "`python3-libselinux`"
        - "`selinux-policy-devel`"
        - "`ansible-core`"
      answer: 0
      explain: Those modules need the Python SELinux bindings to set file contexts correctly.
practice:
  questions:
    - id: desired-state
      objective: ch02.automation
      title: A second run
      prompt: A copy task already has the requested content and mode. Predict its second-run result.
      options:
        - ok
        - changed
        - failed
      expected: ok
      explain: copy reports ok when content and attributes already match.
    - id: control-location
      objective: ch02.architecture
      title: Where does it run?
      prompt: Which machine reads the playbook and coordinates the managed hosts?
      options:
        - Every managed host
        - Control node
        - DNS server
      expected: Control node
      explain: The control node reads the project and coordinates execution.
