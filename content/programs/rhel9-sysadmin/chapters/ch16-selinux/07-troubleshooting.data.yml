practice:
  text:
    hint: Click here and type the commands. This terminal remembers nothing between commands, so it shows each command's result as it was on servera.
    inputLabel: Command to run in the practice terminal
    eventNotFound: 'bash: {value0}: event not found'
    notHere: This practice terminal only knows the examples in this lesson. Try anything else on servera.
    notFound: 'bash: {value0}: command not found'
    searchPrompt: '(reverse-i-search)`{value0}'':'
    noMatch: no match yet
    tasksTitle: Your tasks
    allDone: All done. Now try the same on servera.
    doneLabel: done
    reset: Start again
  data: {}
  props:
    title: 'Practice terminal: finding the cause'
    prompt: '[root@servera ~]#'
    commands:
    - cmd: curl -s -o /dev/null -w "%{http_code}\n" http://localhost/moved.html
      out: '403'
    - cmd: setenforce 0; getenforce
      out: Permissive
    - cmd: curl -s -o /dev/null -w "%{http_code}\n" http://localhost/moved.html
      out: '200'
    - cmd: setenforce 1; getenforce
      out: Enforcing
    - cmd: grep AVC /var/log/audit/audit.log | tail -1 | cut -c1-260
      out: 'type=AVC msg=audit(1791050803.921:146): avc:  denied  { open } for  pid=2279 comm="httpd" path="/srv/web/moved.html" dev="sda2" ino=32383 scontext=system_u:system_r:httpd_t:s0 tcontext=unconfined_u:object_r:user_tmp_t:s0 tclass=file permissive=0'
    - cmd: sealert -a /var/log/audit/audit.log | head -6
      out: 'found 2 alerts in /var/log/audit/audit.log

        --------------------------------------------------------------------------------


        SELinux is preventing /usr/sbin/httpd from open access on the file /srv/web/moved.html.


        *****  Plugin catchall_labels (83.8 confidence) suggests   *******************'
    - cmd: ls -Z /srv/web/moved.html
      out: unconfined_u:object_r:user_tmp_t:s0 /srv/web/moved.html
    - cmd: restorecon -v /srv/web/moved.html
      out: Relabeled /srv/web/moved.html from unconfined_u:object_r:user_tmp_t:s0 to system_u:object_r:httpd_sys_content_t:s0
    tasks:
    - text: Reproduce the symptom with curl.
      commands:
      - curl -s -o /dev/null -w "%{http_code}\n" http://localhost/moved.html
    - text: 'Test whether SELinux is the cause: permissive, retry, enforcing.'
      commands:
      - setenforce 0; getenforce
      - curl -s -o /dev/null -w "%{http_code}\n" http://localhost/moved.html
      - setenforce 1; getenforce
    - text: Find the denial in the audit log.
      commands:
      - grep AVC /var/log/audit/audit.log | tail -1 | cut -c1-260
    - text: Check the file label, then repair it.
      commands:
      - ls -Z /srv/web/moved.html
      - restorecon -v /srv/web/moved.html
quick:
  questions:
  - id: q-3411a12ad977
    q: What is the first test for "is SELinux the cause"?
    options:
    - setenforce 0, retry, then setenforce 1
    - Reinstall the service
    - Reboot
    answer: 0
    explain: If it works in permissive mode, SELinux was denying.
  - id: q-d86ab9db8e4d
    q: Where are SELinux denials recorded?
    options:
    - /var/log/audit/audit.log (AVC records)
    - /var/log/dnf.log
    - /etc/selinux/config
    answer: 0
    explain: Needs auditd running; sealert and ausearch read the same file.
  - id: q-44520d1b6a63
    q: In an AVC record, what does tcontext describe?
    options:
    - The object being accessed (the target)
    - The process (source)
    - The user
    answer: 0
    explain: scontext is the process, tcontext the target.
  - id: q-bba91d5861c0
    q: The denial shows tcontext type var_t for a web file. What is the likely fix?
    options:
    - Give the file the right type with semanage fcontext + restorecon
    - chmod 777
    - setsebool -P httpd_enable_homedirs on
    answer: 0
    explain: A wrong label is the most common cause.
  - id: q-182e564b28ca
    q: Which command gives a plain-English explanation of the denials?
    options:
    - sealert -a /var/log/audit/audit.log
    - getenforce
    - ls -Z
    answer: 0
    explain: It comes from the setroubleshoot-server package.
  - id: q-cde008b88f4d
    q: After fixing the problem, what must you check?
    options:
    - The action works in enforcing mode, with no new denials
    - Nothing
    - That SELinux is disabled
    answer: 0
    explain: Never leave the machine permissive.
