workflow:
  title: From denial to fix
  caption: Step through diagnosing an SELinux problem.
  height: 260
  mode: steps
  steps:
  - title: 1 · Is it SELinux?
    text: 'Switch to permissive for one test: setenforce 0, repeat the action, setenforce 1. If it now works, SELinux was blocking it. If not, look elsewhere (permissions, service, firewall).'
  - title: 2 · Read the denial
    text: Denials are logged as AVC records in /var/log/audit/audit.log (grep AVC), and sealert -a /var/log/audit/audit.log explains them in words. The record names the process (scontext), the target (tcontext) and what was refused.
  - title: 3 · Decide which kind
    text: A file with the wrong type → relabel (semanage fcontext + restorecon). A feature the policy has a switch for → setsebool -P. A service on a non-standard port → semanage port. Otherwise, think before writing a module.
  - title: 4 · Apply the smallest fix
    text: Change one thing. Do not set the system permissive or disabled to "fix" it.
  - title: 5 · Test again with enforcing
    text: Repeat the original action in enforcing mode, and check that no new denials appeared.
