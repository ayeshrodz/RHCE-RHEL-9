avc:
  title: Reading an AVC record
  caption: Select a part of the log line.
  height: 260
  mode: select
  initial: denied
  info:
    denied:
      tone: coral
      title: 'avc: denied { open }'
      text: 'What happened: the action that was refused (open, read, getattr, write, name_bind …). denied means blocked; permissive=1 at the end would mean it was only logged.'
    comm:
      tone: blue
      title: comm="httpd"
      text: Which program tried it. path="/srv/web/moved.html" is the file it tried to reach.
    s:
      tone: purple
      title: scontext=…httpd_t…
      text: 'The SOURCE context: the process. Its type httpd_t is the "who".'
    t:
      tone: amber
      title: tcontext=…user_tmp_t…
      text: 'The TARGET context: the file. Its type user_tmp_t is the problem: httpd_t has no rule allowing access to it.'
    class:
      tone: gray
      title: tclass=file
      text: 'What kind of object: file, dir, tcp_socket, … The fix is usually to make tcontext''s type what the policy allows for that scontext.'
  elements:
  - kind: node
    x: 10
    y: 28
    w: 170
    h: 56
    tone: coral
    title: 'avc:  denied  { open }'
    sub: the refused action
    mono: true
    titleSize: 12
    select: denied
    active:
    - denied
  - kind: node
    x: 190
    y: 28
    w: 150
    h: 56
    tone: blue
    title: comm="httpd"
    sub: the program
    mono: true
    titleSize: 12
    select: comm
    active:
    - comm
  - kind: node
    x: 350
    y: 28
    w: 150
    h: 56
    tone: purple
    title: …httpd_t…
    sub: scontext
    mono: true
    titleSize: 13
    select: s
    active:
    - s
  - kind: node
    x: 510
    y: 28
    w: 160
    h: 56
    tone: amber
    title: …user_tmp_t…
    sub: tcontext
    mono: true
    titleSize: 13
    select: t
