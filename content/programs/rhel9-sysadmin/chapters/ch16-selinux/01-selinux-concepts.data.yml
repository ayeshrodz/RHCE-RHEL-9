practice:
  text:
    hint: Click here and type the commands. This terminal remembers nothing between commands, so it shows each command's result as it was on servera.
    inputLabel: Command to run in the practice terminal
    eventNotFound: 'bash: {value0}: event not found'
    notHere: This practice terminal only knows the examples in this lesson. Try anything else on servera.
    notFound: 'bash: {value0}: command not found'
    searchPrompt: '(reverse-i-search)`{value0}'':'
    noMatch: no match yet
    tasksTitle: Your tasks
    allDone: All done. Now try the same on servera.
    doneLabel: done
    reset: Start again
  data: {}
  props:
    title: 'Practice terminal: reading SELinux contexts'
    prompt: '[student@servera ~]$'
    commands:
    - cmd: getenforce
      out: Enforcing
    - cmd: sestatus | head -4
      out: 'SELinux status:                 enabled

        SELinuxfs mount:                /sys/fs/selinux

        SELinux root directory:         /etc/selinux

        Loaded policy name:             targeted'
    - cmd: id -Z
      out: unconfined_u:unconfined_r:unconfined_t:s0-s0:c0.c1023
    - cmd: ls -dZ /etc/ssh /home/student /tmp /usr/bin/passwd /var/log/messages
      out: "          system_u:object_r:etc_t:s0 /etc/ssh\nsystem_u:object_r:user_home_dir_t:s0 /home/student\n          unconfined_u:object_r:user_tmp_t:s0 /tmp\n  system_u:object_r:passwd_exec_t:s0 /usr/bin/passwd\n      system_u:object_r:var_log_t:s0 /var/log/messages"
    - cmd: ps -eZ | grep -E "sshd|chronyd" | head -2
      out: 'system_u:system_r:chronyd_t:s0      464 ?        00:00:00 chronyd

        system_u:system_r:sshd_t:s0-s0:c0.c1023 641 ?    00:00:00 sshd'
    - cmd: ls -Z /usr/sbin/sshd /usr/sbin/chronyd
      out: "system_u:object_r:chronyd_exec_t:s0 /usr/sbin/chronyd\n   system_u:object_r:sshd_exec_t:s0 /usr/sbin/sshd"
    - cmd: grep -v "^#" /etc/selinux/config | grep -v "^$"
      out: 'SELINUX=enforcing

        SELINUXTYPE=targeted'
    tasks:
    - text: Show the current SELinux mode.
      commands:
      - getenforce
    - text: Show your own security context.
      commands:
      - id -Z
    - text: Show the context of some directories and files.
      commands:
      - ls -dZ /etc/ssh /home/student /tmp /usr/bin/passwd /var/log/messages
    - text: Show the context of running services.
      commands:
      - ps -eZ | grep -E "sshd|chronyd" | head -2
    - text: Show where the permanent mode is configured.
      commands:
      - grep -v "^#" /etc/selinux/config | grep -v "^$"
quick:
  questions:
  - id: q-08f7547d440f
    q: Which part of a context matters most in everyday SELinux administration?
    options:
    - The type (the _t name)
    - The user
    - The level
    answer: 0
    explain: The targeted policy is a set of rules between types.
  - id: q-9fe3dd8b0d3b
    q: A web server gets 403 even though the file is world-readable. SELinux could be the cause. Why do file permissions not help?
    options:
    - SELinux is a second check that ignores mode bits
    - chmod is disabled
    - The file is encrypted
    answer: 0
    explain: Both the ordinary permissions and the SELinux policy must allow the access.
  - id: q-ab1a02c43fd4
    q: Which command shows the current mode?
    options:
    - getenforce
    - ls -Z
    - id -u
    answer: 0
    explain: sestatus gives more detail.
  - id: q-647aa0ecbb32
    q: What does setenforce 0 do?
    options:
    - Switches to permissive mode until the next reboot
    - Disables SELinux permanently
    - Deletes the policy
    answer: 0
    explain: Permanent changes go in /etc/selinux/config.
  - id: q-5f9ce1385e8a
    q: Which option of ls shows security contexts?
    options:
    - -Z
    - -z
    - -s
    answer: 0
    explain: ps -Z and id -Z do the same for processes and users.
  - id: q-feebd4a824f4
    q: Why is switching to disabled a bad answer to a denial?
    options:
    - It removes protection for the whole system and needs a relabel to undo
    - It is not allowed
    - It slows the boot
    answer: 0
    explain: Find the label, boolean or port that is wrong instead.
