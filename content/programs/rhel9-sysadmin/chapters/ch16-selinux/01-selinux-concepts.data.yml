two-locks:
  title: Two locks on every door
  caption: Step through httpd reading /srv/web/index.html.
  height: 260
  mode: steps
  steps:
  - title: The request
    text: httpd (process type httpd_t, running as the user apache) wants to read /srv/web/index.html, a file labelled var_t.
  - title: 'Lock 1: ordinary permissions'
    text: 'First the familiar check: owner, group and mode (chapter 7). The file is readable by everyone, so this lock opens.'
  - title: 'Lock 2: SELinux policy'
    text: 'Then the kernel asks the SELinux policy: may httpd_t read a file of type var_t? There is no such rule, so the answer is NO. The access is denied, and an AVC message is logged.'
  - title: Fix the label, not the permissions
    text: 'Relabel the file to httpd_sys_content_t, which the policy does allow httpd_t to read. Now both locks open. chmod 777 would not have helped: the second lock never looks at permission bits.'
  elements:
