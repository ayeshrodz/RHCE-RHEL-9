context:
  title: A security context
  caption: Select a part of system_u:object_r:httpd_sys_content_t:s0.
  height: 260
  mode: select
  initial: type
  info:
    user:
      tone: gray
      title: 'SELinux user: system_u'
      text: The SELinux identity. Not the same as a Linux account name. Rarely needed in the targeted policy.
    role:
      tone: gray
      title: 'Role: object_r'
      text: Roles group what a user may do. Files always have object_r. In the targeted policy you rarely deal with roles.
    type:
      tone: green
      title: 'Type: httpd_sys_content_t'
      text: 'The part that matters in everyday administration. The policy is written as rules between types: "processes of type httpd_t may read files of type httpd_sys_content_t". The type name usually ends in _t.'
    level:
      tone: gray
      title: 'Level: s0'
      text: A sensitivity level (and categories) used by MLS/MCS policies, for example to separate containers or virtual machines from each other. Leave it alone for now.
