modes:
  title: SELinux modes
  caption: Select a mode.
  height: 240
  mode: select
  initial: enforcing
  info:
    enforcing:
      tone: green
      title: Enforcing
      text: 'The policy is applied: forbidden accesses are blocked and logged. The right setting for every production system.'
    permissive:
      tone: amber
      title: Permissive
      text: 'The policy is evaluated but nothing is blocked: violations are only logged. Use it briefly to test "is SELinux the cause?", then switch back. setenforce 0 sets it until reboot.'
    disabled:
      tone: coral
      title: Disabled
      text: No SELinux. Re-enabling later requires relabelling the whole file system. Do not use it to make a problem go away.
    persist:
      tone: gray
      title: Where the mode is set
      text: 'Right now: setenforce 1|0 (temporary). Permanently: SELINUX=enforcing in /etc/selinux/config. getenforce and sestatus show the current mode.'
  elements:
  - kind: node
    x: 10
    y: 30
    w: 150
    h: 60
    tone: green
    title: Enforcing
    sub: block + log
    titleSize: 14
    select: enforcing
    active:
    - enforcing
  - kind: node
    x: 176
