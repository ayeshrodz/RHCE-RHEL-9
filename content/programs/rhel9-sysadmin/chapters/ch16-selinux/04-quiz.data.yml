questions:
  questions:
  - q: A chcon fix disappears after relabeling. What was missing?
    options:
    - A wider chmod mode.
    - A new hostname.
    - Persistent file-context intent through semanage fcontext.
    answer: 2
    explain: chcon alters current state; configured context mappings define relabel behavior.
    id: q-3e29bc5ec0fb
  - q: A nonstandard port is allowed by firewalld but the service cannot bind under SELinux. What should
      you inspect?
    options:
    - Only the archive format.
    - The SELinux port type and service domain.
    - Only DNS.
    answer: 1
    explain: Network filtering and SELinux bind policy are independent.
    id: q-1f173bcd8eb2
  - q: Why avoid blindly compiling every audit event into an allow module?
    options:
    - It can authorize unrelated behavior and conceal configuration faults.
    - It always deletes the log.
    - It changes the running kernel version.
    answer: 0
    explain: A narrow diagnosis must precede a policy extension.
    id: q-050b0429d3ba
