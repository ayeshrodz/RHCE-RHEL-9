cp-mv:
  title: Copying versus moving
  caption: Select an operation to see which label the file ends up with.
  height: 250
  mode: select
  initial: cp
  info:
    cp:
      tone: green
      title: 'cp: gets the destination''s default'
      text: cp creates a NEW file, which is labelled according to where it lands (here httpd_sys_content_t, from the directory's rule). A copy into a correctly labelled directory is usually already right.
    mv:
      tone: coral
      title: 'mv: keeps its old label'
      text: mv within a file system only renames the same file, so its label travels with it. A file moved in from /tmp is still labelled for /tmp (user_tmp_t) and the web server cannot read it. This is the most common cause of 403 after "I just moved the file".
    fix:
      tone: blue
      title: restorecon fixes it
      text: restorecon -v FILE (or -R for a tree) applies the rule that matches the path. Make it a habit after you move files into a service directory.
    cp-a:
      tone: amber
      title: 'cp -a / tar: preserve'
      text: cp -a keeps the source label and tar with --selinux restores the labels stored in the archive. That can be right for a backup restore, and wrong for a move into a differently labelled place.
  elements:
  - kind: node
    x: 10
    y: 30
    w: 150
    h: 60
    tone: green
    title: cp
    sub: 'new file: new label'
    mono: true
    titleSize: 14
    select: cp
    active:
    - cp
  - kind: node
    x: 176
