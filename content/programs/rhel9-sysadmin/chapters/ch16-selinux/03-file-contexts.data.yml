fcontext-flow:
  title: Rules and labels
  caption: Step through making a custom directory labelled correctly, permanently.
  height: 250
  mode: steps
  steps:
  - title: The default rules
    text: 'The policy contains path rules: /var/www(/.*)? → httpd_sys_content_t, and so on. restorecon looks up a file''s path in those rules and sets its label to match.'
  - title: A new directory has no rule
    text: /srv/web is under /srv, which the rules label var_t. The web server is not allowed to read var_t.
  - title: Add a rule
    text: semanage fcontext -a -t httpd_sys_content_t "/srv/web(/.*)?" adds a local rule for the directory and everything below it. Nothing on disk has changed yet.
  - title: Apply it
    text: restorecon -Rv /srv/web relabels the existing files according to the rules, and prints what it changed. New files created there later receive the label automatically.
  - title: chcon is only a shortcut
    text: chcon -t TYPE FILE sets a label directly without a rule. It works at once but is lost at the next restorecon or relabel. Use it to experiment, never as the fix.
