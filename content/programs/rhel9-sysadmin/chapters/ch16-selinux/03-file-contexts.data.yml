practice:
  text:
    hint: Click here and type the commands. This terminal remembers nothing between commands, so it shows each command's result as it was on servera.
    inputLabel: Command to run in the practice terminal
    eventNotFound: 'bash: {value0}: event not found'
    notHere: This practice terminal only knows the examples in this lesson. Try anything else on servera.
    notFound: 'bash: {value0}: command not found'
    searchPrompt: '(reverse-i-search)`{value0}'':'
    noMatch: no match yet
    tasksTitle: Your tasks
    allDone: All done. Now try the same on servera.
    doneLabel: done
    reset: Start again
  data: {}
  props:
    title: 'Practice terminal: file contexts'
    prompt: '[root@servera ~]#'
    commands:
    - cmd: ls -Z /srv/web/index.html
      out: unconfined_u:object_r:var_t:s0 /srv/web/index.html
    - cmd: curl -s -o /dev/null -w "%{http_code}\n" http://localhost/
      out: '403'
    - cmd: matchpathcon /var/www/html/index.html /srv/web/index.html
      out: "/var/www/html/index.html\tsystem_u:object_r:httpd_sys_content_t:s0\n/srv/web/index.html\tunconfined_u:object_r:var_t:s0"
    - cmd: semanage fcontext -a -t httpd_sys_content_t "/srv/web(/.*)?"
      out: ''
    - cmd: semanage fcontext -l | grep /srv/web
      out: /srv/web(/.*)?                                     all files          system_u:object_r:httpd_sys_content_t:s0
    - cmd: restorecon -Rv /srv/web
      out: 'Relabeled /srv/web from unconfined_u:object_r:var_t:s0 to system_u:object_r:httpd_sys_content_t:s0

        Relabeled /srv/web/index.html from unconfined_u:object_r:var_t:s0 to system_u:object_r:httpd_sys_content_t:s0'
    - cmd: curl -s -o /dev/null -w "%{http_code}\n" http://localhost/
      out: '200'
    - cmd: cp /tmp/second.html /srv/web/copy.html; mv /tmp/moved.html /srv/web/moved.html; ls -Z /srv/web/copy.html /srv/web/moved.html
      out: "unconfined_u:object_r:httpd_sys_content_t:s0 /srv/web/copy.html\n              unconfined_u:object_r:user_tmp_t:s0 /srv/web/moved.html"
    - cmd: restorecon -v /srv/web/moved.html
      out: Relabeled /srv/web/moved.html from unconfined_u:object_r:user_tmp_t:s0 to system_u:object_r:httpd_sys_content_t:s0
    tasks:
    - text: Look at the context of the web page that returns 403.
      commands:
      - ls -Z /srv/web/index.html
    - text: See which type the policy expects for the path.
      commands:
      - matchpathcon /var/www/html/index.html /srv/web/index.html
    - text: Add a rule for /srv/web and everything below it.
      commands:
      - semanage fcontext -a -t httpd_sys_content_t "/srv/web(/.*)?"
    - text: Apply the rules to the existing files.
      commands:
      - restorecon -Rv /srv/web
    - text: Copy and move a file into the directory and compare the labels.
      commands:
      - cp /tmp/second.html /srv/web/copy.html; mv /tmp/moved.html /srv/web/moved.html; ls -Z /srv/web/copy.html /srv/web/moved.html
quick:
  questions:
  - id: q-b2d7bbeb306d
    q: You created /srv/web and httpd cannot read it. Which pair of commands fixes it permanently?
    options:
    - semanage fcontext -a -t httpd_sys_content_t "/srv/web(/.*)?" then restorecon -R /srv/web
    - chcon -t httpd_sys_content_t /srv/web only
    - chmod -R 777 /srv/web
    answer: 0
    explain: Add the rule, then apply it. chcon alone is lost at the next relabel.
  - id: q-eb1e1c1e5310
    q: Which command shows the type the policy expects for a path?
    options:
    - matchpathcon PATH
    - ls -Z PATH
    - getenforce PATH
    answer: 0
    explain: ls -Z shows the current label; matchpathcon shows what restorecon would set.
  - id: q-02768b1634a6
    q: A file moved with mv into a service directory is not served. Why?
    options:
    - mv keeps the old label
    - mv removes permissions
    - mv is blocked by SELinux
    answer: 0
    explain: Run restorecon on it.
  - id: q-8fab032dbc20
    q: What does restorecon -Rnv /srv do?
    options:
    - Shows what would be relabelled without changing anything
    - Relabels without output
    - Deletes labels
    answer: 0
    explain: -n means dry run.
  - id: q-68f29c5645e2
    q: Why is chcon not a permanent fix?
    options:
    - It sets a label without a rule, so restorecon or a relabel undoes it
    - It needs a reboot
    - It only works for root files
    answer: 0
    explain: Use semanage fcontext to record the rule.
  - id: q-b3d1998e8c61
    q: What does the pattern /srv/web(/.*)? match?
    options:
    - /srv/web and everything below it
    - Only /srv/web
    - Only files in /srv
    answer: 0
    explain: '(/.*)? is an optional part: a slash followed by anything.'
