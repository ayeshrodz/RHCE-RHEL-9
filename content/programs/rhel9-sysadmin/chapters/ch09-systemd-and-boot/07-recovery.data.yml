root-reset:
  title: Reset a lost root password
  caption: Step through the standard recovery on a machine you have console access to.
  height: 250
  mode: steps
  steps:
  - title: Reboot and interrupt GRUB
    text: At the GRUB menu, highlight the default entry and press e to edit it.
  - title: Add rd.break
    text: 'Find the line that starts with linux, go to its end and add: rd.break. This stops the boot inside the initramfs, before the real root is switched in.'
  - title: Boot with Ctrl+X
    text: You get a root shell at switch_root:/# with no password. The real root file system is mounted read-only at /sysroot.
  - title: Make it writable and enter it
    text: mount -o remount,rw /sysroot, then chroot /sysroot. Now / is the real system.
  - title: Set the password
    text: passwd root sets the new password.
  - title: Schedule an SELinux relabel
    text: touch /.autorelabel. The edited /etc/shadow has no correct SELinux label; the relabel at the next boot fixes it (and takes a while).
  - title: Leave twice
    text: exit leaves the chroot, exit again continues the boot. Log in as root with the new password.
