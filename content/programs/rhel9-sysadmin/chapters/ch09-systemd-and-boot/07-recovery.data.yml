  props:
    title: 'Replay: the rd.break session'
    prompt: switch_root:/#
    commands:
    - cmd: mount -o remount,rw /sysroot
      out: ''
    - cmd: chroot /sysroot
      out: ''
    - cmd: passwd root
      out: 'Changing password for user root.

        New password:

        Retype new password:

        passwd: all authentication tokens updated successfully.'
    - cmd: touch /.autorelabel
      out: ''
    - cmd: exit
      out: exit
    tasks:
    - text: Make the real root writable.
      commands:
      - mount -o remount,rw /sysroot
    - text: Enter the real root.
      commands:
      - chroot /sysroot
    - text: Set the new root password.
      commands:
      - passwd root
    - text: Make SELinux relabel the files at the next boot.
      commands:
      - touch /.autorelabel
quick:
  questions:
  - id: q-a47af5a4d7b7
    q: What does rd.break do?
    options:
    - Stops the boot in the initramfs, before the real root is switched in
    - Resets the root password by itself
    - Disables SELinux
    answer: 0
    explain: It gives you an early shell with the real root at /sysroot, mounted read-only.
  - id: q-18aa6516d534
    q: Why mount /sysroot read-write?
    options:
    - It is read-only by default, and passwd must write to /etc/shadow
    - To speed up the boot
    - To run fsck
    answer: 0
    explain: The initramfs mounts it read-only; remount,rw lets you change files.
  - id: q-55dc66e28c37
    q: Why touch /.autorelabel after changing the password?
    options:
    - The changed /etc/shadow has the wrong SELinux label
    - To reset the clock
    - To rebuild the initramfs
    answer: 0
    explain: The relabel at the next boot restores the correct labels. Without it, logins can fail under SELinux.
  - id: q-82b2fcdcc394
    q: Anyone with console access can do this. How is it limited in practice?
    options:
    - By physical and console security, and by encrypted disks or a GRUB password
    - It is impossible on RHEL
    - Only root can press e in GRUB
    answer: 0
    explain: Recovery is a feature of local access. Protect the console, and encrypt disks if physical access is a threat.
  - id: q-f56b7bf795ba
    q: A bad /etc/fstab entry stops the boot in emergency mode. What do you do first?
    options:
    - Enter the root password, remount / read-write and fix or comment out the line
    - Reinstall
    - Delete /etc/fstab
    answer: 0
    explain: Emergency mode needs the root password; use mount -o remount,rw / and then edit the file.
  - id: q-2519e1515ead
    q: Which fstab option lets the system boot even if a file system is missing?
    options:
    - nofail
    - noauto
    - ro
    answer: 0
    explain: nofail turns a missing device from a boot-stopping error into a warning.
