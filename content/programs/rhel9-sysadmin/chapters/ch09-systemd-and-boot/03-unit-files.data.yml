quick:
  questions:
  - id: q-73a04c52f207
    q: You edited reporter.service but systemctl still runs the old command. What is missing?
    options:
    - systemctl daemon-reload
    - a reboot
    - chmod +x on the unit
    answer: 0
    explain: systemd caches unit files. daemon-reload re-reads them; then restart the service.
  - id: q-643e3b8020f7
    q: Which section makes a service start at boot when enabled?
    options:
    - '[Install] WantedBy='
    - '[Unit] After='
    - '[Service] Restart='
    answer: 0
    explain: enable creates a symlink according to WantedBy=.
  - id: q-f568d8d12892
    q: What does Restart=on-failure do?
    options:
    - Restarts the service if it exits with an error or is killed
    - Restarts it every minute
    - Restarts it at boot
    answer: 0
    explain: Clean exits (status 0) are not restarted; crashes, non-zero exits and signals are.
  - id: q-ef2a091056ba
    q: Why use a drop-in (/etc/systemd/system/NAME.service.d/*.conf) instead of editing the packaged file?
    options:
    - Package updates would overwrite your edit; the drop-in survives
    - Drop-ins are faster
    - Packaged files are read-only to root
    answer: 0
    explain: Keep changes small and in /etc, so updates to /usr/lib/systemd/system do not undo them.
  - id: q-fc65c44e0724
    q: Where do you see what a service wrote to its output and errors?
    options:
    - journalctl -u NAME
    - /var/log/NAME.log always
    - systemctl list-units
    answer: 0
    explain: systemd captures stdout and stderr of services into the journal.
  - id: q-1302ab6d482a
    q: The service fails with status=203/EXEC. What is the most likely cause?
    options:
    - The ExecStart program is missing or not executable
    - The network is down
    - SELinux is disabled
    answer: 0
    explain: '203/EXEC means systemd could not execute the command: check the path and the permissions.'
