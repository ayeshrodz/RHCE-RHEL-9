unit-anatomy:
  title: Anatomy of a service unit file
  caption: Select a section to see what it holds.
  height: 250
  mode: select
  initial: service
  info:
    unit:
      tone: purple
      title: '[Unit]'
      text: 'Describes the unit and its place in the ordering: Description= for humans, After= and Requires= or Wants= for dependencies.'
    service:
      tone: green
      title: '[Service]'
      text: 'How to run it: ExecStart= is the command (a full path), Restart= says when to restart it, User= the account to run as, Environment= variables.'
    install:
      tone: blue
      title: '[Install]'
      text: 'What happens on systemctl enable: WantedBy=multi-user.target makes the service start with that target.'
    path:
      tone: gray
      title: Where the file lives
      text: /etc/systemd/system/NAME.service is yours and wins. Packages ship theirs in /usr/lib/systemd/system. Never edit those; override them.
  elements:
  - kind: node
    x: 10
    y: 20
    w: 200
    h: 44
    tone: purple
    title: '[Unit]'
    sub: Description · After
    mono: true
    titleSize: 13
    select: unit
    active:
    - unit
  - kind: node
    x: 10
    y: 74
    w: 200
    h: 56
    tone: green
    title: '[Service]'
    sub: ExecStart · Restart · User
    mono: true
    titleSize: 13
    select: service
    active:
    - service
  - kind: node
    x: 10
    y: 140
    w: 200
    h: 44
    tone: blue
