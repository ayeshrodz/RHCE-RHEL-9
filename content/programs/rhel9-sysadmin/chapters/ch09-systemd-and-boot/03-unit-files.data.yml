edit-flow:
  title: Changing a unit
  caption: Step through the safe routine every time you edit a unit file.
  height: 220
  mode: steps
  steps:
  - title: Edit the file
    text: Create or change /etc/systemd/system/NAME.service, or an override in /etc/systemd/system/NAME.service.d/ (systemctl edit NAME does this for you).
  - title: Reload systemd
    text: systemctl daemon-reload makes systemd read the files again. Forget it, and systemd keeps using the old copy (and warns you).
  - title: Start and enable
    text: systemctl enable --now NAME starts it now and at every boot.
  - title: Check
    text: systemctl status NAME for the state, journalctl -u NAME for what it printed. Fix and repeat.
  elements:
  - kind: node
    x: 10
    y: 20
    w: 150
    h: 60
    tone: purple
    title: edit
    sub: NAME.service
    mono: true
    titleSize: 13
    active:
    - 0
  - kind: node
    x: 190
    y: 20
    w: 150
    h: 60
    tone: blue
    title: daemon-reload
    sub: read the files
    mono: true
    titleSize: 12.5
    active:
    - 1
    visible:
    - 1
    - 2
    - 3
  - kind: node
    x: 370
    y: 20
    w: 150
    h: 60
    tone: green
    title: enable --now
    sub: start + boot
    mono: true
    titleSize: 12.5
    active:
    - 2
    visible:
    - 2
    - 3
  - kind: node
    x: 550
    y: 20
    w: 120
    h: 60
    tone: amber
    title: status
    sub: journalctl -u
    mono: true
    titleSize: 12.5
    active:
    - 3
    visible:
    - 3
