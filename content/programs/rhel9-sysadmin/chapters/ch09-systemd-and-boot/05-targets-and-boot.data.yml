targets:
  title: Targets
  caption: Select a target to see what it groups.
  height: 240
  mode: select
  initial: multi
  info:
    poweroff:
      tone: gray
      title: poweroff.target
      text: Shut the machine down. systemctl poweroff and systemctl reboot use poweroff and reboot targets.
    rescue:
      tone: amber
      title: rescue.target
      text: A single-user shell with the basic system and file systems mounted, but no network and no services. For repairs.
    multi:
      tone: green
      title: multi-user.target
      text: 'The normal text-mode server: networking, logins and all enabled services. The usual choice for servers.'
    graphical:
      tone: blue
      title: graphical.target
      text: Everything in multi-user, plus a graphical login. The default on desktops, and on this lab image.
  elements:
