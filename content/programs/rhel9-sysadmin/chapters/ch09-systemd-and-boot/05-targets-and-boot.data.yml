boot-steps:
  title: From power to login prompt
  caption: Step through what happens at boot.
  height: 230
  mode: steps
  steps:
  - title: Firmware
    text: UEFI (or BIOS) tests the hardware and finds a boot device.
  - title: 'Bootloader: GRUB 2'
    text: GRUB shows the menu, loads the kernel and the initial RAM disk into memory. Kernel arguments are set here, and you can edit them for one boot.
  - title: Kernel
    text: Starts, detects hardware, and mounts a temporary root from the initramfs.
  - title: initramfs
    text: A small file system with just enough drivers and tools to find and mount the real root file system.
  - title: systemd (PID 1)
    text: The kernel switches to the real root and starts systemd, which reads its units.
  - title: The default target
    text: systemd starts everything needed for the default target (multi-user or graphical), in parallel where possible. Then login prompts appear.
