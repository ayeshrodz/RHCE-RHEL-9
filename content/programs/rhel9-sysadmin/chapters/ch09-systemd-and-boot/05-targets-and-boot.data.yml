practice:
  text:
    hint: Click here and type the commands. This terminal remembers nothing between commands, so it shows each command's result as it was on servera.
    inputLabel: Command to run in the practice terminal
    eventNotFound: 'bash: {value0}: event not found'
    notHere: This practice terminal only knows the examples in this lesson. Try anything else on servera.
    notFound: 'bash: {value0}: command not found'
    searchPrompt: '(reverse-i-search)`{value0}'':'
    noMatch: no match yet
    tasksTitle: Your tasks
    allDone: All done. Now try the same on servera.
    doneLabel: done
    reset: Start again
  data: {}
  props:
    title: 'Practice terminal: targets and boot analysis'
    prompt: '[root@servera ~]#'
    commands:
    - cmd: systemctl get-default
      out: graphical.target
    - cmd: systemctl set-default multi-user.target
      out: Created symlink /etc/systemd/system/default.target → /usr/lib/systemd/system/multi-user.target.
    - cmd: systemctl list-dependencies multi-user.target | head -4
      out: 'multi-user.target

        ● ├─chronyd.service

        ● ├─crond.service

        ● ├─firewalld.service'
    - cmd: systemd-analyze
      out: "Startup finished in 1.835s (kernel) + 1.517s (initrd) + 5.773s (userspace) = 9.126s \ngraphical.target reached after 4.932s in userspace."
    - cmd: systemd-analyze critical-chain | head -4
      out: 'The time when unit became active or started is printed after the "@" character.

        The time the unit took to start is printed after the "+" character.


        graphical.target @4.932s'
    - cmd: cat /proc/cmdline
      out: BOOT_IMAGE=(hd0,gpt2)/boot/vmlinuz-5.14.0-687.53.1.el9_8.x86_64 console=tty1 console=ttyS0 root=UUID=4bbdcf8d-863d-4050-957c-c815ca3838b8 ro
    - cmd: grubby --default-kernel
      out: /boot/vmlinuz-5.14.0-687.53.1.el9_8.x86_64
    - cmd: grubby --update-kernel=ALL --args="loglevel=5"
      out: ''
    - cmd: grubby --info=DEFAULT | grep args
      out: args="console=tty1 console=ttyS0 ro loglevel=5"
    - cmd: journalctl --list-boots
      out: "IDX BOOT ID                          FIRST ENTRY                 LAST ENTRY\n  0 40c5978bc61848209a017d48d2184fe4 Sat 2026-10-03 16:37:42 UTC Sat 2026-10-03 16:38:24 UTC"
    tasks:
    - text: Find the default target.
      commands:
      - systemctl get-default
    - text: Make the multi-user target the default.
      commands:
      - systemctl set-default multi-user.target
    - text: See how long the last boot took.
      commands:
      - systemd-analyze
    - text: Show the arguments the running kernel was started with.
      commands:
      - cat /proc/cmdline
    - text: Add the argument loglevel=5 to every installed kernel.
      commands:
      - grubby --update-kernel=ALL --args="loglevel=5"
quick:
  questions:
  - id: q-922affcfb841
    q: Which component loads the kernel and the initramfs?
    options:
    - GRUB 2
    - systemd
    - udev
    answer: 0
    explain: The bootloader reads its menu and loads both into memory, passing the kernel arguments.
  - id: q-afbad0896e46
    q: What is the first process the kernel starts on the real root?
    options:
    - systemd (PID 1)
    - bash
    - init.sh
    answer: 0
    explain: systemd starts all other services and ends up at the default target.
  - id: q-46d233cbdf78
    q: Which command makes the system boot to the text-mode target?
    options:
    - systemctl set-default multi-user.target
    - systemctl isolate multi-user.target
    - systemctl enable multi-user
    answer: 0
    explain: set-default is the persistent choice; isolate switches the running system but changes nothing for the next boot.
  - id: q-1a83c5869757
    q: What does systemctl isolate rescue.target do?
    options:
    - Switches the running system to a single-user rescue state
    - Boots into rescue mode next time
    - Deletes the default target
    answer: 0
    explain: It stops everything not part of rescue.target right now, so over ssh it would cut you off.
  - id: q-39182711e483
    q: Where do you edit kernel arguments for a single boot?
    options:
    - 'The GRUB menu: press e, edit the linux line, Ctrl+X'
    - /etc/default/grub only
    - /proc/cmdline
    answer: 0
    explain: /proc/cmdline is read-only and shows what was used. A one-off change is made in GRUB itself.
  - id: q-4c1c02c4c051
    q: The boot journal from before the last reboot is "no persistent journal was found". Why?
    options:
    - The journal is kept only in memory by default here
    - journalctl is broken
    - The disk is full
    answer: 0
    explain: Without /var/log/journal the journal is volatile and lost at reboot. Chapter 11 makes it persistent.
