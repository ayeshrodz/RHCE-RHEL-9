questions:
  questions:
  - q: Why does sudo podman ps show a different list from podman ps?
    options:
    - Root and the regular user use different stores.
    - Every container was automatically deleted.
    - Podman never supports rootless mode.
    answer: 0
    explain: Container state is scoped to the invoking identity.
    id: q-f098a8bc6be7
  - q: How does a Quadlet-generated service acquire startup activation?
    options:
    - By editing the generated unit and enabling it normally.
    - By changing only the image tag.
    - From the source definition Install section during generation.
    answer: 2
    explain: Generated transient units use activation links created from the Quadlet source.
    id: q-af9e50fc3ad2
  - q: A bind mount is readable by Unix mode but denied in an enforcing container. What should you inspect?
    options:
    - Only the host timezone.
    - SELinux label and container identity mapping.
    - Only the registry name.
    answer: 1
    explain: Mandatory labels and UID mapping are independent access layers.
    id: q-23d64540b41f
