containerfile:
  title: A Containerfile
  caption: Select an instruction.
  height: 280
  mode: select
  initial: from
  info:
    from:
      tone: purple
      title: FROM
      text: The base image to start from. Name it fully; for a reproducible build pin it to a tag you tested or, better, to its digest (image@sha256:…).
    copy:
      tone: green
      title: COPY
      text: Copies files from the build directory (the context) into the image. The files are fixed at build time, unlike a volume, which shows the current data at run time.
    run:
      tone: blue
      title: RUN
      text: Runs a command during the build, for example installing a package. Each instruction makes a layer; combine commands with && to keep layers few.
    user:
      tone: amber
      title: USER
      text: The account the program runs as. Prefer a non-root user so a flaw in the program does not give root inside the container.
    cmd:
      tone: coral
      title: CMD
      text: The default command when the container starts. A container lives as long as this main process does.
  elements:
  - kind: node
    x: 6
    y: 34
    w: 128
    h: 56
    tone: purple
    title: FROM
    sub: base image
    mono: true
    titleSize: 15
    select: from
    active:
    - from
  - kind: node
    x: 142
    y: 34
    w: 128
    h: 56
    tone: green
    title: COPY
    sub: add files
    mono: true
    titleSize: 15
    select: copy
    active:
    - copy
  - kind: node
    x: 278
    y: 34
    w: 128
    h: 56
    tone: blue
    title: RUN
    sub: build step
    mono: true
    titleSize: 15
    select: run
    active:
    - run
  - kind: node
    x: 414
    y: 34
    w: 128
    h: 56
    tone: amber
    title: USER
    sub: who runs
    mono: true
    titleSize: 15
    select: user
