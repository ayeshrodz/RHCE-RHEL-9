build-flow:
  title: From files to an image
  caption: Step through podman build.
  height: 270
  mode: steps
  steps:
  - title: Files and a Containerfile
    text: 'A directory holds the Containerfile and what it copies: here index.html, the page of the portal.'
  - title: podman build -t localhost/portal:1 .
    text: Reads the Containerfile top to bottom. Each instruction becomes a layer on top of the base image.
  - title: The image is local
    text: Tagged localhost/portal:1 in your own storage. It is not on any registry; nobody else has it.
  - title: Run it like any image
    text: 'podman run -d -p 8080:8080 localhost/portal:1 serves the page, with no volume needed: the page is inside the image.'
