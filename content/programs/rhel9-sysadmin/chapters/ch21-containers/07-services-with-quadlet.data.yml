practice:
  text:
    hint: Click here and type the commands. This terminal remembers nothing between commands, so it shows each command's result as it was on servera.
    inputLabel: Command to run in the practice terminal
    eventNotFound: 'bash: {value0}: event not found'
    notHere: This practice terminal only knows the examples in this lesson. Try anything else on servera.
    notFound: 'bash: {value0}: command not found'
    searchPrompt: '(reverse-i-search)`{value0}'':'
    noMatch: no match yet
    tasksTitle: Your tasks
    allDone: All done. Now try the same on servera.
    doneLabel: done
    reset: Start again
  data: {}
  props:
    title: 'Practice terminal: a container as a user service'
    prompt: '[student@servera ~]$'
    commands:
    - cmd: mkdir -p ~/.config/containers/systemd
      out: ''
    - cmd: 'cat > ~/.config/containers/systemd/web.container <<''EOT''

        [Container]

        Image=registry.access.redhat.com/ubi9/httpd-24:latest

        PublishPort=8080:8080

        Volume=%h/web:/var/www/html:ro,Z


        [Service]

        Restart=always


        [Install]

        WantedBy=default.target

        EOT'
      out: ''
    - cmd: systemctl --user daemon-reload
      out: ''
    - cmd: systemctl --user start web.service
      out: ''
    - cmd: systemctl --user is-active web.service
      out: active
    - cmd: curl -s localhost:8080
      out: hello from a container
    - cmd: podman ps --format "{{.Names}} {{.Status}}"
      out: systemd-web Up 3 seconds
    - cmd: systemctl --user is-enabled web.service
      out: generated
    - cmd: podman kill systemd-web
      out: systemd-web
    - cmd: systemctl --user show web.service -p NRestarts
      out: NRestarts=1
    - cmd: loginctl show-user student -p Linger
      out: Linger=no
    - cmd: sudo loginctl enable-linger student
      out: ''
    - cmd: loginctl show-user student -p Linger
      out: Linger=yes
    - cmd: sudo firewall-cmd --permanent --add-port=8080/tcp; sudo firewall-cmd --reload
      out: 'success

        success'
    tasks:
    - text: Create the Quadlet directory and the file web.container.
      commands:
      - mkdir -p ~/.config/containers/systemd
      - 'cat > ~/.config/containers/systemd/web.container <<''EOT''

        [Container]

        Image=registry.access.redhat.com/ubi9/httpd-24:latest

        PublishPort=8080:8080

        Volume=%h/web:/var/www/html:ro,Z


        [Service]

        Restart=always


        [Install]

        WantedBy=default.target

        EOT'
    - text: Generate the service, start it and check the page.
      commands:
      - systemctl --user daemon-reload
      - systemctl --user start web.service
      - curl -s localhost:8080
    - text: Kill the container and see that systemd restarted it.
      commands:
      - podman kill systemd-web
      - systemctl --user show web.service -p NRestarts
    - text: Enable lingering and open the port for other hosts.
      commands:
      - sudo loginctl enable-linger student
      - loginctl show-user student -p Linger
      - sudo firewall-cmd --permanent --add-port=8080/tcp; sudo firewall-cmd --reload
quick:
  questions:
  - id: q-9f9dfda33d80
    q: Where do you put the definition of a rootless Quadlet container?
    options:
    - ~/.config/containers/systemd/NAME.container
    - /etc/systemd/system/NAME.service
    - /etc/containers/NAME.conf
    answer: 0
    explain: systemctl --user daemon-reload then generates NAME.service.
  - id: q-087a5b9650b7
    q: Which command makes systemd read a new or changed .container file?
    options:
    - systemctl --user daemon-reload
    - podman reload
    - systemctl --user enable
    answer: 0
    explain: The generator runs during the reload.
  - id: q-20d5cdf1b39b
    q: What does loginctl enable-linger student do?
    options:
    - Keeps student's user services running without a login, including after a reboot
    - Logs student in automatically
    - Gives student sudo
    answer: 0
    explain: Without it a rootless service starts only after a login.
  - id: q-ffb2df02cc20
    q: Restart=always is in the file. The container is killed. What happens?
    options:
    - systemd starts it again
    - Nothing until reboot
    - The unit is removed
    answer: 0
    explain: NRestarts counts the restarts.
  - id: q-bc21ad66a181
    q: Why pull the image before starting the service?
    options:
    - A slow pull can make the start time out
    - Quadlet cannot pull
    - It is faster to run
    answer: 0
    explain: podman pull first, then start.
  - id: q-c9a6c27d6716
    q: A rootless service works on the host but other machines cannot reach it. Which step is often missing?
    options:
    - The firewall port
    - Another daemon-reload
    - The SELinux boolean
    answer: 0
    explain: Publish with PublishPort and allow the port in firewalld.
