quadlet-file:
  title: A Quadlet file
  caption: Select a section or setting.
  height: 300
  mode: select
  initial: image
  info:
    image:
      tone: blue
      title: Image=
      text: The full image name to run. Pull it first (podman pull) so that a slow registry cannot make the service start time out.
    port:
      tone: green
      title: PublishPort=8080:8080
      text: The same host:container pair as -p. Allow the host port in the firewall for other machines.
    volume:
      tone: amber
      title: Volume=%h/web:/var/www/html:ro,Z
      text: A bind mount; %h is the home directory. Keep the :Z for SELinux.
    restart:
      tone: coral
      title: '[Service] Restart=always'
      text: Ordinary systemd settings go in [Service]. always restarts after any exit; on-failure only after an error.
    install:
      tone: purple
      title: '[Install] WantedBy=default.target'
      text: Starts the service with the user's systemd. default.target is the user manager's equivalent of multi-user.target.
  elements:
  - kind: node
    x: 6
    y: 24
    w: 300
    h: 40
    tone: gray
    title: '[Container]'
    sub: ''
    mono: true
    titleSize: 13
  - kind: node
    x: 6
    y: 70
    w: 300
