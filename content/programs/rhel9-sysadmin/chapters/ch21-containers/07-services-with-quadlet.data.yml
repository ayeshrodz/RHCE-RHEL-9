quadlet-flow:
  title: From a file to a service
  caption: Step through Quadlet.
  height: 280
  mode: steps
  steps:
  - title: A .container file
    text: 'You describe the container in ~/.config/containers/systemd/web.container: the image, ports, volumes, and ordinary systemd settings such as Restart.'
  - title: daemon-reload generates the unit
    text: systemctl --user daemon-reload runs the Podman generator, which writes the real service web.service in /run/user/1000/systemd/generator/. Never edit that generated file; edit the .container file.
  - title: Start it
    text: 'systemctl --user start web.service starts the container. The Install section (WantedBy=default.target) makes it start with the user''s systemd, so do not run enable: the unit is generated.'
  - title: Restart policy
    text: 'Restart=always (or on-failure) restarts the container when it dies. Test it: podman kill systemd-web and look again a few seconds later.'
  - title: Lingering for boot
    text: A user service normally runs only while the user is logged in. loginctl enable-linger student keeps the user's systemd running from boot, so the container comes up after a reboot without a login.
  elements:
  - kind: node
    x: 10
    y: 20
    w: 150
    h: 60
