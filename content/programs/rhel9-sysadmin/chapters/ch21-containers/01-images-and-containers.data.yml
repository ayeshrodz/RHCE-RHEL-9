practice:
  text:
    hint: Click here and type the commands. This terminal remembers nothing between commands, so it shows each command's result as it was on servera.
    inputLabel: Command to run in the practice terminal
    eventNotFound: 'bash: {value0}: event not found'
    notHere: This practice terminal only knows the examples in this lesson. Try anything else on servera.
    notFound: 'bash: {value0}: command not found'
    searchPrompt: '(reverse-i-search)`{value0}'':'
    noMatch: no match yet
    tasksTitle: Your tasks
    allDone: All done. Now try the same on servera.
    doneLabel: done
    reset: Start again
  data: {}
  props:
    title: 'Practice terminal: run and manage a container'
    prompt: '[student@servera ~]$'
    commands:
    - cmd: podman --version
      out: podman version 5.8.2
    - cmd: podman pull registry.access.redhat.com/ubi9/ubi-minimal:latest
      out: 'Trying to pull registry.access.redhat.com/ubi9/ubi-minimal:latest...

        Getting image source signatures

        Copying blob 5d5a5ce3a8d4 done   |

        Copying config 791c6eb32e done   |

        Writing manifest to image destination

        791c6eb32e560d616e601ed273b35b07118ba234a56e027937dee10c2e7f026c'
    - cmd: podman images
      out: 'REPOSITORY                                   TAG         IMAGE ID      CREATED     SIZE

        registry.access.redhat.com/ubi9/ubi-minimal  latest      791c6eb32e56  3 days ago  109 MB'
    - cmd: podman run --rm registry.access.redhat.com/ubi9/ubi-minimal cat /etc/os-release | head -2
      out: 'NAME="Red Hat Enterprise Linux"

        VERSION="9.8 (Plow)"'
    - cmd: podman run -d --name idle registry.access.redhat.com/ubi9/ubi-minimal sleep 600
      out: 2fd01c4a6e18d21bbd4b0f3a1b7ce7d3de9bb6bf1d1e5d9d0a5f1c7f0c6b2c11
    - cmd: podman ps
      out: 'CONTAINER ID  IMAGE                                        COMMAND     CREATED        STATUS        PORTS       NAMES

        2fd01c4a6e18  registry.access.redhat.com/ubi9/ubi-minimal  sleep 600   2 seconds ago  Up 2 seconds              idle'
    - cmd: podman exec idle id
      out: uid=0(root) gid=0(root) groups=0(root)
    - cmd: podman stop -t 1 idle
      out: idle
    - cmd: podman ps -a --format "{{.Names}} {{.Status}}"
      out: idle Exited (137) 1 second ago
    - cmd: podman rm idle
      out: idle
    - cmd: podman pull httpd
      out: 'Error: short-name resolution enforced but cannot prompt without a TTY'
    tasks:
    - text: Pull the minimal image with its full name and list your images.
      commands:
      - podman pull registry.access.redhat.com/ubi9/ubi-minimal:latest
      - podman images
    - text: Run a one-off container that prints the OS release and disappears.
      commands:
      - podman run --rm registry.access.redhat.com/ubi9/ubi-minimal cat /etc/os-release | head -2
    - text: Start a container in the background, look at it and run a command inside.
      commands:
      - podman run -d --name idle registry.access.redhat.com/ubi9/ubi-minimal sleep 600
      - podman ps
      - podman exec idle id
    - text: Stop it, see its state, and remove it.
      commands:
      - podman stop -t 1 idle
      - podman ps -a --format "{{.Names}} {{.Status}}"
      - podman rm idle
quick:
  questions:
  - id: q-3d81023a45d1
    q: What is the relationship between an image and a container?
    options:
    - A container is a running instance made from an image
    - They are two names for the same thing
    - An image is a running container that was stopped
    answer: 0
    explain: Images are read-only templates; containers are what runs.
  - id: q-006423546597
    q: Where does a rootless user's Podman keep images?
    options:
    - In their own home directory
    - In /var/lib/containers for everyone
    - In /etc/containers
    answer: 0
    explain: sudo podman uses a separate store, so the two do not see each other's images.
  - id: q-f46e7d9b88e9
    q: Which command shows stopped containers as well as running ones?
    options:
    - podman ps -a
    - podman ps
    - podman images
    answer: 0
    explain: Plain ps lists only running containers.
  - id: q-32baf7690fca
    q: A container started with -d exits at once. Where do you look first?
    options:
    - podman logs NAME and podman ps -a
    - systemctl status podman
    - /var/log/messages only
    answer: 0
    explain: The main process ended; its output explains why.
  - id: q-1818d2ed8ffd
    q: Why use a full image name such as registry.access.redhat.com/ubi9/ubi-minimal?
    options:
    - Short names are ambiguous and are refused without a prompt
    - It makes the image smaller
    - It is required for rootless mode only
    answer: 0
    explain: You know exactly which registry you trust.
  - id: q-2d0a4e35e389
    q: What does podman rm do to the image?
    options:
    - 'Nothing: it only removes the container'
    - Deletes the image
    - Stops the registry
    answer: 0
    explain: Use podman rmi to remove an image.
