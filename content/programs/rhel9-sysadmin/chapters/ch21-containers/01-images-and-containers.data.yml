model:
  title: Containers, images and registries
  caption: Select a part.
  height: 270
  mode: select
  initial: image
  info:
    registry:
      tone: purple
      title: Registry
      text: 'A server that stores images and hands them out: registry.access.redhat.com, quay.io and others. You pull an image from it by its full name, such as registry.access.redhat.com/ubi9/httpd-24:latest.'
    image:
      tone: blue
      title: Image
      text: 'A read-only template: files plus the default command to run. An image is identified by name:tag and by a digest, a hash of its content. A tag can move to a new image; a digest cannot.'
    container:
      tone: green
      title: Container
      text: 'A running (or stopped) instance of an image: ordinary processes of your host, isolated with namespaces and limited with control groups. Several containers can share one image.'
    storage:
      tone: amber
      title: Local storage
      text: 'Images and containers live in your own area, ~/.local/share/containers/storage, when you run rootless. Root has a separate store: sudo podman cannot see what student pulled.'
