lifecycle:
  title: The life of a container
  caption: Step through the commands.
  height: 270
  mode: steps
  steps:
  - title: podman pull
    text: Downloads an image to local storage. podman run does it for you if the image is missing.
  - title: podman run -d --name web IMAGE
    text: Creates a container from the image and starts it in the background (-d). The name makes it easy to refer to.
  - title: podman ps, logs, exec
    text: ps lists running containers; logs shows their output; exec runs another command inside, for example a shell to look around.
  - title: podman stop
    text: Asks the main process to exit (SIGTERM), then kills it after a few seconds. The container still exists, in the state Exited.
  - title: podman rm
    text: Deletes the stopped container. The image stays in local storage. rm -f stops and removes in one step.
