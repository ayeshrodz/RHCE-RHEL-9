recall:
  cards:
  - front: Why does sudo podman ps show a different list from podman ps?
    back: Root and the regular user use different stores. Container state is scoped to the invoking identity.
  - front: How does a Quadlet-generated service acquire startup activation?
    back: From the source definition Install section during generation. Generated transient units use
      activation links created from the Quadlet source.
  - front: A bind mount is readable by Unix mode but denied in an enforcing container. What should you
      inspect?
    back: SELinux label and container identity mapping. Mandatory labels and UID mapping are independent
      access layers.
