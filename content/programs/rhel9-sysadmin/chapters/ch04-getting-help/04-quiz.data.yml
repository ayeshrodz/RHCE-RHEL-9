questions:
  questions:
  - q: You need the fields in /etc/passwd, not the password-changing command. What do you open?
    options:
    - man 1 passwd
    - A latest-version password reset tutorial.
    - man 5 passwd
    answer: 2
    explain: Manual sections disambiguate command references from file formats.
    id: q-351ca213addf
  - q: apropos finds nothing, but man ls works. What is a reasonable diagnosis?
    options:
    - ls cannot be used offline.
    - The keyword index may be missing or stale.
    - No manuals are installed.
    answer: 1
    explain: apropos searches an index; a named manual can still exist.
    id: q-45f23241b658
  - q: A latest upstream example uses an option your command rejects. What should you check first?
    options:
    - The installed version and its local or vendor reference.
    - Whether running as root enables the option.
    - Whether adding more quotes enables it.
    answer: 0
    explain: An unsupported option is commonly a version mismatch, not a privilege problem.
    id: q-60f853964e7a
