recall:
  cards:
  - front: You need the fields in /etc/passwd, not the password-changing command. What do you open?
    back: man 5 passwd Manual sections disambiguate command references from file formats.
  - front: apropos finds nothing, but man ls works. What is a reasonable diagnosis?
    back: The keyword index may be missing or stale. apropos searches an index; a named manual can still
      exist.
  - front: A latest upstream example uses an option your command rejects. What should you check first?
    back: The installed version and its local or vendor reference. An unsupported option is commonly a
      version mismatch, not a privilege problem.
