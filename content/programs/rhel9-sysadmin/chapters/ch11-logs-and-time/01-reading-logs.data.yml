priorities:
  title: Message priorities
  caption: Select a level; journalctl -p LEVEL shows that level and everything more serious.
  height: 250
  mode: select
  initial: err
  info:
    emerg:
      tone: coral
      title: 0 · emerg
      text: The system is unusable.
    alert:
      tone: coral
      title: 1 · alert
      text: Act immediately.
    crit:
      tone: coral
      title: 2 · crit
      text: Critical conditions, such as a hardware failure.
    err:
      tone: amber
      title: 3 · err
      text: 'An error: something failed. journalctl -p err is the first filter to try when looking for problems.'
    warning:
      tone: amber
      title: 4 · warning
      text: Something is odd and may become a problem.
    notice:
      tone: blue
      title: 5 · notice
      text: Normal but significant events.
    info:
      tone: green
      title: 6 · info
      text: Ordinary information. The default level of /var/log/messages.
    debug:
      tone: gray
      title: 7 · debug
      text: Details useful only to developers; very noisy.
