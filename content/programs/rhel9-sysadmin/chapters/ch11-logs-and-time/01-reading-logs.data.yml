practice:
  text:
    hint: Click here and type the commands. This terminal remembers nothing between commands, so it shows each command's result as it was on servera.
    inputLabel: Command to run in the practice terminal
    eventNotFound: 'bash: {value0}: event not found'
    notHere: This practice terminal only knows the examples in this lesson. Try anything else on servera.
    notFound: 'bash: {value0}: command not found'
    searchPrompt: '(reverse-i-search)`{value0}'':'
    noMatch: no match yet
    tasksTitle: Your tasks
    allDone: All done. Now try the same on servera.
    doneLabel: done
    reset: Start again
  data: {}
  props:
    title: 'Practice terminal: asking the journal'
    prompt: '[root@servera ~]#'
    commands:
    - cmd: journalctl -n 3 --no-pager
      out: 'Oct 03 16:59:31 servera.lab.example.com lxd-agent[445]: time="2026-10-03T16:59:31Z" level=warning msg="Failed closing connection"

        Oct 03 16:59:31 servera.lab.example.com systemd[1]: Starting Hostname Service...

        Oct 03 16:59:31 servera.lab.example.com systemd[1]: Started Hostname Service.'
    - cmd: journalctl -u sshd -n 2 --no-pager
      out: 'Oct 03 16:57:53 servera.lab.example.com sshd-session[658]: pam_unix(sshd:session): session opened for user student(uid=1000) by (uid=0)

        Oct 03 16:57:53 servera.lab.example.com sshd-session[658]: pam_unix(sshd:session): session closed for user student'
    - cmd: journalctl -p err -b --no-pager
      out: -- No entries --
    - cmd: journalctl --since "10 minutes ago" --no-pager | wc -l
      out: '1356'
    - cmd: journalctl -o short-iso -n 1 --no-pager
      out: '2026-10-03T16:59:31+0000 servera.lab.example.com systemd[1]: Started Hostname Service.'
    - cmd: journalctl -g Accepted -n 1 --no-pager
      out: 'Oct 03 17:01:04 servera.lab.example.com sshd-session[1049]: Accepted publickey for root from 172.25.251.9 port 41352 ssh2: ED25519 SHA256:WflAun3QNCSKLM0S+9kUnThzL5WJzuppRj3uxDb8jYY'
    - cmd: logger -p user.notice "hello from logger"
      out: ''
    - cmd: journalctl -n 1 --no-pager
      out: 'Oct 03 16:59:31 servera.lab.example.com root[727]: hello from logger'
    - cmd: tail -1 /var/log/messages
      out: 'Oct  3 16:59:31 servera root[727]: hello from logger'
    - cmd: tail -2 /var/log/secure
      out: 'Oct  3 16:57:53 servera sshd-session[671]: Disconnected from user student 172.25.251.9 port 37186

        Oct  3 16:57:53 servera sshd-session[658]: pam_unix(sshd:session): session closed for user student'
    - cmd: journalctl --disk-usage
      out: Archived and active journals take up 3.0M in the file system.
    tasks:
    - text: Show the last 3 journal entries without a pager.
      commands:
      - journalctl -n 3 --no-pager
    - text: Show only the messages of the sshd service.
      commands:
      - journalctl -u sshd -n 2 --no-pager
    - text: Show errors (and worse) since the last boot.
      commands:
      - journalctl -p err -b --no-pager
    - text: Search for the word Accepted.
      commands:
      - journalctl -g Accepted -n 1 --no-pager
    - text: Write your own message, then find it in the journal and in /var/log/messages.
      commands:
      - logger -p user.notice "hello from logger"
      - journalctl -n 1 --no-pager
      - tail -1 /var/log/messages
quick:
  questions:
  - id: q-f46f78488eda
    q: Which command shows only the log of the sshd service?
    options:
    - journalctl -u sshd
    - journalctl -p sshd
    - cat /var/log/sshd
    answer: 0
    explain: -u selects a unit.
  - id: q-1011eff4d13c
    q: Which file records logins and sudo use on RHEL?
    options:
    - /var/log/secure
    - /var/log/messages
    - /var/log/dmesg
    answer: 0
    explain: authpriv messages go to /var/log/secure.
  - id: q-7cad2905a417
    q: journalctl -p err shows ...
    options:
    - Messages of priority err and more serious
    - Only errors, exactly
    - All messages
    answer: 0
    explain: 'Levels 0 to 3: emerg, alert, crit and err.'
  - id: q-6aa4e401e704
    q: Which option follows the journal live, like tail -f?
    options:
    - journalctl -f
    - journalctl -l
    - journalctl --live
    answer: 0
    explain: -f keeps showing new entries until Ctrl+C.
  - id: q-58408bb46f7a
    q: Which command writes your own message into the logs?
    options:
    - logger "text"
    - echo "text" > /var/log/messages
    - journalctl --add "text"
    answer: 0
    explain: logger sends the text through the syslog interface; -p chooses facility and priority.
  - id: q-7b562d62d12d
    q: Why might journalctl show more detail than /var/log/messages?
    options:
    - The journal keeps structured fields (unit, PID, priority) and all priorities
    - It is a different machine
    - messages is encrypted
    answer: 0
    explain: messages only holds what the rsyslog rules select, as plain text.
