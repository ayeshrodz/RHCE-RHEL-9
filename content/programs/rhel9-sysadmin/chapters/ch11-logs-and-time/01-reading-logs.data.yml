log-flow:
  title: Where a log message goes
  caption: Step through the life of one message.
  height: 250
  mode: steps
  steps:
  - title: A program speaks
    text: 'A service writes a message: to its standard output, to the syslog socket, or through the journal API. Here sshd reports a login.'
  - title: journald collects it
    text: systemd-journald stores it in a structured, indexed journal with the time, unit, PID and priority attached. Query it with journalctl.
  - title: rsyslog forwards it
    text: rsyslog reads the journal and, following its rules, writes classic text lines to files such as /var/log/messages (general) and /var/log/secure (authentication).
  - title: Files grow, logrotate tidies
    text: A timer runs logrotate, which renames old logs (messages-20261003), compresses them, and deletes the oldest, so the disk does not fill.
