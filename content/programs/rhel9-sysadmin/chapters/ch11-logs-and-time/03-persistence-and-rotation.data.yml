journal-storage:
  title: Where the journal is kept
  caption: Select a Storage= setting.
  height: 240
  mode: select
  initial: auto
  info:
    volatile:
      tone: amber
      title: Storage=volatile
      text: Only in /run/log/journal (memory). Lost at every reboot, so you cannot read how the previous boot failed.
    persistent:
      tone: green
      title: Storage=persistent
      text: In /var/log/journal on disk. Survives reboots; journalctl -b -1 works. Size is limited by SystemMaxUse=.
    auto:
      tone: blue
      title: Storage=auto (default)
      text: Persistent if the directory /var/log/journal exists, otherwise volatile. On this image the directory is missing, so the journal is volatile. mkdir /var/log/journal, restart journald and run journalctl --flush is enough to change that.
    limits:
      tone: gray
      title: Limits
      text: SystemMaxUse= (total size on disk), MaxRetentionSec= (age), SystemKeepFree= (space to leave free). Clean up by hand with journalctl --vacuum-size=100M or --vacuum-time=2weeks.
  elements:
  - kind: node
    x: 10
    y: 30
    w: 150
    h: 60
    tone: amber
    title: volatile
    sub: /run/log/journal
    mono: true
    titleSize: 12.5
    select: volatile
    active:
    - volatile
  - kind: node
    x: 176
    y: 30
    w: 150
    h: 60
    tone: green
    title: persistent
    sub: /var/log/journal
    mono: true
    titleSize: 12.5
    select: persistent
    active:
    - persistent
  - kind: node
    x: 342
    y: 30
    w: 150
    h: 60
    tone: blue
    title: auto
    sub: default
    mono: true
    titleSize: 13
    select: auto
    active:
    - auto
  - kind: node
    x: 508
    y: 30
    w: 162
    h: 60
    tone: gray
    title: limits
    sub: SystemMaxUse=…
    mono: true
    titleSize: 12.5
    select: limits
    active:
    - limits
  - kind: label
    x: 340
    y: 124
    text: /etc/systemd/journald.conf.d/10-NAME.conf   then   systemctl restart systemd-journald
    mono: true
    size: 12
    muted: true
rotation:
  title: How logrotate works
  caption: Step through a weekly rotation that keeps four old copies.
  height: 230
  mode: steps
  steps:
  - title: The log is growing
    text: Programs append to /var/log/myapp.log. The file keeps growing until logrotate runs (daily, from a systemd timer).
  - title: Rotation day
    text: If the weekly time has come, logrotate renames myapp.log to myapp.log.1 and creates a fresh empty myapp.log with the mode from the create line.
  - title: Older copies shift and compress
    text: 'Existing copies move up: .1 becomes .2 (compressed to .gz), .2 becomes .3, and so on.'
  - title: The oldest is deleted
    text: With rotate 4, the fifth copy is deleted. Disk use stays bounded.
  elements:
  - kind: node
    x: 10
    y: 30
    w: 130
    h: 56
    tone: green
    title: myapp.log
    sub: live file
    mono: true
    titleSize: 12
    active:
    - 0
    - 1
    visible:
    - 0
    - 1
    - 2
    - 3
  - kind: node
    x: 160
    y: 30
    w: 120
    h: 56
    tone: blue
    title: myapp.log.1
    sub: last week
    mono: true
    titleSize: 11.5
    active:
    - 1
    - 2
    visible:
    - 1
    - 2
    - 3
  - kind: node
    x: 300
    y: 30
    w: 130
    h: 56
    tone: blue
    title: myapp.log.2.gz
    sub: compressed
    mono: true
    titleSize: 11.5
