practice:
  text:
    hint: Click here and type the commands. This terminal remembers nothing between commands, so it shows each command's result as it was on servera.
    inputLabel: Command to run in the practice terminal
    eventNotFound: 'bash: {value0}: event not found'
    notHere: This practice terminal only knows the examples in this lesson. Try anything else on servera.
    notFound: 'bash: {value0}: command not found'
    searchPrompt: '(reverse-i-search)`{value0}'':'
    noMatch: no match yet
    tasksTitle: Your tasks
    allDone: All done. Now try the same on servera.
    doneLabel: done
    reset: Start again
  data: {}
  props:
    title: 'Practice terminal: persistence, rsyslog rules and logrotate'
    prompt: '[root@servera ~]#'
    commands:
    - cmd: journalctl --list-boots
      out: "IDX BOOT ID                          FIRST ENTRY                 LAST ENTRY\n  0 e223ff84f70141d5b05d37983cb06b03 Sat 2026-10-03 17:00:58 UTC Sat 2026-10-03 17:01:08 UTC"
    - cmd: mkdir -p /var/log/journal
      out: ''
    - cmd: systemctl restart systemd-journald
      out: ''
    - cmd: journalctl --flush
      out: ''
    - cmd: ls /var/log/journal
      out: abfe75218e6b48b780e28b39cd961fcf
    - cmd: journalctl --disk-usage
      out: Archived and active journals take up 8.0M in the file system.
    - cmd: echo 'local5.* /var/log/myapp.log' > /etc/rsyslog.d/10-myapp.conf
      out: ''
    - cmd: systemctl restart rsyslog
      out: ''
    - cmd: logger -p local5.info "myapp started"
      out: ''
    - cmd: cat /var/log/myapp.log
      out: 'Oct  3 17:00:03 servera root[867]: myapp started'
    - cmd: logrotate -f /etc/logrotate.d/myapp
      out: ''
    - cmd: ls -l /var/log/myapp*
      out: '-rw-r-----. 1 root root  0 Oct  3 17:00 /var/log/myapp.log

        -rw-------. 1 root root 81 Oct  3 17:00 /var/log/myapp.log.1.gz'
    - cmd: journalctl --vacuum-size=50M
      out: Vacuuming done, freed 0B of archived journals from /var/log/journal/abfe75218e6b48b780e28b39cd961fcf.
    tasks:
    - text: 'Make the journal persistent: create its directory, restart journald and flush the journal to disk.'
      commands:
      - mkdir -p /var/log/journal
      - systemctl restart systemd-journald
      - journalctl --flush
    - text: Send everything the local5 facility logs to /var/log/myapp.log.
      commands:
      - echo 'local5.* /var/log/myapp.log' > /etc/rsyslog.d/10-myapp.conf
    - text: Restart rsyslog and write a test message with logger.
      commands:
      - systemctl restart rsyslog
      - logger -p local5.info "myapp started"
    - text: Force a rotation of the myapp log now.
      commands:
      - logrotate -f /etc/logrotate.d/myapp
quick:
  questions:
  - id: q-513dffad9a0e
    q: After a reboot, journalctl -b -1 says "no persistent journal was found". How do you fix that?
    options:
    - mkdir /var/log/journal, restart systemd-journald and run journalctl --flush
    - Reinstall rsyslog
    - Edit /var/log/messages
    answer: 0
    explain: With Storage=auto, the existence of /var/log/journal switches on persistent storage.
  - id: q-3373c76a7e0a
    q: Where do you put a custom rsyslog rule?
    options:
    - /etc/rsyslog.d/NAME.conf
    - /var/log/rsyslog.d/
    - /usr/lib/rsyslog/
    answer: 0
    explain: rsyslog.conf includes /etc/rsyslog.d/*.conf.
  - id: q-96536ec686f7
    q: In rsyslog, what does local5.* /var/log/myapp.log mean?
    options:
    - All messages of facility local5 go to that file
    - Priority 5 only
    - Rotate every 5 days
    answer: 0
    explain: facility.priority, then the target; * means every priority.
  - id: q-04c6050c3d27
    q: What does rotate 4 in a logrotate rule mean?
    options:
    - Keep four old copies
    - Rotate four times a day
    - Compress after four days
    answer: 0
    explain: The fifth oldest is removed at each rotation.
  - id: q-dba98d7b2c13
    q: How do you test a logrotate rule without changing anything?
    options:
    - logrotate -d FILE
    - logrotate -f FILE
    - logrotate --apply
    answer: 0
    explain: '-d is debug mode: it prints what would be done. -f forces a rotation.'
  - id: q-7e55df88f5f4
    q: Which command frees journal space?
    options:
    - journalctl --vacuum-size=100M
    - rm /var/log/messages
    - journalctl --clear
    answer: 0
    explain: The vacuum options delete the oldest archived journal files until the limit is met.
