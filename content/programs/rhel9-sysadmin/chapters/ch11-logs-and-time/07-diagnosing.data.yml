triage:
  title: A calm way to diagnose
  caption: Step through the same six moves every time.
  height: 240
  mode: steps
  steps:
  - title: 1 · What is the symptom?
    text: 'Write it down in one sentence: what should happen, and what happens instead. "The web page does not load" is a symptom; "httpd is broken" is already a guess.'
  - title: 2 · Ask the service
    text: systemctl status NAME shows the state and the last few log lines. systemctl --failed lists everything that failed.
  - title: 3 · Read the log around the failure
    text: 'journalctl -u NAME -b (this boot), or --since "10 minutes ago". Start with the first error, not the last: later errors are often consequences.'
  - title: 4 · Widen the net
    text: journalctl -p err -b for the whole system, dmesg for the kernel (hardware, disks, memory), /var/log/secure for logins and sudo.
  - title: 5 · Form one hypothesis and test it
    text: Change one thing at a time and write down what you changed, so you can undo it.
  - title: 6 · Verify and record
    text: Confirm the symptom is gone, with the same test that showed it. Note the cause and fix for next time.
