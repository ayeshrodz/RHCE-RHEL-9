snapshot-chain:
  text:
    text: 'rht-vmctl save  →  servera: snapshot “clean” taken'
    text2: rht-vmctl save servera -n {value0}  →  saved
    text3: rht-vmctl restore servera {value0}  →  restored, booted and ready
    text4: 'Error: Failed restoring snapshot rootfs: Snapshot "{value0}" cannot be restored due to subsequent snapshot(s). Set zfs.remove_snapshots to override'
    text5: rht-vmctl rmsnap servera {value0}  →  deleted
    widgetTitle: servera’s snapshots, oldest to newest
    widgetSub: Take a few snapshots, then try to restore an older one.
    btn: ' Take snapshot'
    label: newest · restorable
    template: Restore {value0}
    btn2: ' restore'
    template2: Delete {value0}
    widgetCaption: Keep “clean” as the only (or newest) snapshot on the servers and resets always work. Delete newer snapshots with rht-vmctl rmsnap to go back further.
  data:
    names:
    - ch03-done
    - ch04-done
    - before-vault
    - ch05-done
    - experiment
