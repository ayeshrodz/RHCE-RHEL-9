questions:
  questions:
  - q: A file is renamed. Which reference can keep working without an update?
    options:
    - A hard link to its inode.
    - A symbolic link containing its old name.
    - An indexed search result for its old path.
    answer: 0
    explain: A hard link references the same object, while a symlink stores a path.
    id: q-b0defc9e566d
  - q: Why quote the pattern in find . -name "*.log"?
    options:
    - To force a regular expression.
    - To include only hidden files.
    - To let find interpret it instead of Bash expanding it first.
    answer: 2
    explain: find needs the pattern as an operand, not a list of filenames expanded by the shell.
    id: q-7335e6b8d740
  - q: A file has a large ls size but a small du result. What can explain this?
    options:
    - It has a long name.
    - It is sparse and has unallocated regions.
    - Its owner is root.
    answer: 1
    explain: Logical length and allocated blocks measure different things.
    id: q-c69d387ddbea
