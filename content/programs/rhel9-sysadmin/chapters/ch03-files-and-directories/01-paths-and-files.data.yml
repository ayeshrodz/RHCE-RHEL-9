quick:
  questions:
  - q: A file is renamed. Which reference can keep working without an update?
    options:
    - A hard link to its inode.
    - A symbolic link containing its old name.
    - An indexed search result for its old path.
    answer: 0
    explain: A hard link references the same object, while a symlink stores a path.
    id: q-589a7bd6862e
model:
  connections:
  - relates to
  - verify
  steps:
  - id: part0
    title: Directory entry
    text: Associates a name with an inode; a rename changes the name association.
    tone: purple
  - id: part1
    title: Inode
    text: Stores object metadata and data references; multiple hard links can refer to it.
    tone: teal
  - id: part2
    title: Symbolic link
    text: Stores a target path, which can become dangling independently of the link.
    tone: green
