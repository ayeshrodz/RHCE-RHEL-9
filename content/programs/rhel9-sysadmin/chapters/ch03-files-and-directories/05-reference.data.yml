recall:
  cards:
  - front: A file is renamed. Which reference can keep working without an update?
    back: A hard link to its inode. A hard link references the same object, while a symlink stores a path.
  - front: Why quote the pattern in find . -name "*.log"?
    back: To let find interpret it instead of Bash expanding it first. find needs the pattern as an operand,
      not a list of filenames expanded by the shell.
  - front: A file has a large ls size but a small du result. What can explain this?
    back: It is sparse and has unallocated regions. Logical length and allocated blocks measure different
      things.
