questions:
  questions:
  - q: uniq misses equal lines separated by other values. What change fixes the report?
    options:
    - Change their file permissions.
    - Sort equivalent values together before uniq.
    - Use tail first.
    answer: 1
    explain: uniq compares adjacent records.
    id: q-7cc51ae78b7e
  - q: Why does grep ready include a not-ready field?
    options:
    - It matches a substring rather than comparing the complete field.
    - grep always includes every line.
    - The file is owned by the wrong user.
    answer: 0
    explain: Use a parsed exact field comparison or an appropriately anchored expression.
    id: q-842602f79867
  - q: diff returns 1 after an intentional edit. What does that mean?
    options:
    - The edited file cannot be read.
    - The files are identical.
    - The files differ.
    answer: 2
    explain: Diff uses 1 for differences and a higher status for errors.
    id: q-db4ef4fed6ec
