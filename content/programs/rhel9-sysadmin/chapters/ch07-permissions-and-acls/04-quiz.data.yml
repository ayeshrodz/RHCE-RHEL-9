questions:
  questions:
  - q: An auditor has an r-- file ACL but cannot read it. What must you inspect?
    options:
    - Only the file extension.
    - Whether chmod 777 was used.
    - Parent-directory traversal and the ACL mask.
    answer: 2
    explain: File access depends on the full path and effective ACL permissions.
    id: q-024cf3420381
  - q: What does setgid on a directory do?
    options:
    - Guarantees group write regardless of creation mode.
    - Makes new entries inherit its group.
    - Makes every new file executable.
    answer: 1
    explain: Group inheritance and permission inheritance are separate.
    id: q-561c282629ce
  - q: A user cannot write a file but can delete it. What can explain that?
    options:
    - The parent directory permits modifying entries.
    - Read permission always permits deletion.
    - ACLs never apply to directories.
    answer: 0
    explain: Removing a name is a directory operation, with sticky-bit and policy constraints.
    id: q-12bc16edb976
