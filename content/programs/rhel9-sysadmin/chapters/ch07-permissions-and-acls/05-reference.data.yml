recall:
  cards:
  - front: An auditor has an r-- file ACL but cannot read it. What must you inspect?
    back: Parent-directory traversal and the ACL mask. File access depends on the full path and effective
      ACL permissions.
  - front: What does setgid on a directory do?
    back: Makes new entries inherit its group. Group inheritance and permission inheritance are separate.
  - front: A user cannot write a file but can delete it. What can explain that?
    back: The parent directory permits modifying entries. Removing a name is a directory operation, with
      sticky-bit and policy constraints.
