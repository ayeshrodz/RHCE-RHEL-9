quick:
  questions:
  - q: An auditor has an r-- file ACL but cannot read it. What must you inspect?
    options:
    - Parent-directory traversal and the ACL mask.
    - Only the file extension.
    - Whether chmod 777 was used.
    answer: 0
    explain: File access depends on the full path and effective ACL permissions.
    id: q-9de75bb3a3f5
model:
  connections:
  - relates to
  - verify
  steps:
  - id: part0
    title: Path traversal
    text: Every parent directory must permit the identity to search it.
    tone: purple
  - id: part1
    title: Selected ACL entries
    text: Owner, named identity and matching groups are evaluated with their defined ordering.
    tone: teal
  - id: part2
    title: Effective access
    text: The mask limits the group class; SELinux and mount policy may constrain it further.
    tone: green
