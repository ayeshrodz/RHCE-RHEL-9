recall:
  cards:
  - front: lvs reports growth but df does not. Which layer may still need expansion?
    back: The file system inside the enlarged LV. Block capacity and filesystem capacity are distinct
      layers.
  - front: What is the difference between -L +512M and -L 1536M?
    back: The first adds capacity; the second requests an absolute final size. Interpret additive and
      absolute sizes before applying them.
  - front: Why is lvreduce not a casual rollback for XFS growth?
    back: XFS cannot shrink, and reducing its block device can destroy data. A smaller block layer can
      truncate data regardless of LVM metadata validity.
