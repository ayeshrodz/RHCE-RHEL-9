build:
  title: Build storage with LVM
  caption: Step through the five commands.
  height: 250
  mode: steps
  steps:
  - title: 1 · Prepare a physical volume
    text: pvcreate /dev/sdb1. The partition (type lvm) now carries an LVM label. If the disk held an older file system, answer y when asked whether to wipe the old signature.
  - title: 2 · Create a volume group
    text: vgcreate vgdata /dev/sdb1. The pool has the capacity of its PVs, cut into 4 MiB extents.
  - title: 3 · Create logical volumes
    text: lvcreate -n lvapp -L 1G vgdata (an exact size) or -l 50%FREE (a share of what is left). The device appears as /dev/vgdata/lvapp.
  - title: 4 · Put a file system on it
    text: mkfs.xfs /dev/vgdata/lvapp, exactly as on a partition.
  - title: 5 · Mount it
    text: mount /dev/vgdata/lvapp /srv/app, and an /etc/fstab line (/dev/vgdata/lvapp or its UUID) to keep it.
  elements:
  - kind: node
    x: 8
    y: 24
    w: 128
    h: 56
