stack:
  title: The LVM layers
  caption: Select a layer.
  height: 290
  mode: select
  initial: vg
  info:
    disk:
      tone: gray
      title: Disks and partitions
      text: 'The raw storage: /dev/sdb1, /dev/sdb2, whole disks. LVM can use partitions (give them the lvm type) or entire disks. These are the building blocks that run out or fail.'
    pv:
      tone: blue
      title: Physical volumes (PV)
      text: A disk or partition that has been prepared for LVM with pvcreate. It carries a label and is divided into fixed-size chunks called physical extents (4 MiB by default). Show with pvs.
    vg:
      tone: purple
      title: Volume group (VG)
      text: A pool made of one or more PVs. Its size is the sum of its PVs. You create logical volumes from this pool and enlarge the pool by adding PVs. Show with vgs.
    lv:
      tone: green
      title: Logical volumes (LV)
      text: 'The "virtual partitions" you create from the pool: /dev/vgdata/lvapp. An LV can be any size, can span several PVs, and can be grown (and sometimes shrunk) while in use. Show with lvs.'
    fs:
      tone: amber
      title: File system or swap
      text: 'Just as on a partition: mkfs.xfs on the LV, then mount it. The file system sits on the LV, not on a disk, so it can grow with it.'
  elements:
