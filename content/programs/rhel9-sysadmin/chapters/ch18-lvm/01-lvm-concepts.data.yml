practice:
  text:
    hint: Click here and type the commands. This terminal remembers nothing between commands, so it shows each command's result as it was on servera.
    inputLabel: Command to run in the practice terminal
    eventNotFound: 'bash: {value0}: event not found'
    notHere: This practice terminal only knows the examples in this lesson. Try anything else on servera.
    notFound: 'bash: {value0}: command not found'
    searchPrompt: '(reverse-i-search)`{value0}'':'
    noMatch: no match yet
    tasksTitle: Your tasks
    allDone: All done. Now try the same on servera.
    doneLabel: done
    reset: Start again
  data: {}
  props:
    title: 'Practice terminal: building LVM storage'
    prompt: '[root@servera ~]#'
    commands:
    - cmd: pvcreate /dev/sdb1
      out: '  Physical volume "/dev/sdb1" successfully created.'
    - cmd: pvs
      out: "  PV         VG Fmt  Attr PSize PFree\n  /dev/sdb1     lvm2 ---  1.50g 1.50g"
    - cmd: vgcreate vgdata /dev/sdb1
      out: '  Volume group "vgdata" successfully created'
    - cmd: vgs
      out: "  VG     #PV #LV #SN Attr   VSize  VFree \n  vgdata   1   0   0 wz--n- <1.50g <1.50g"
    - cmd: lvcreate -n lvapp -L 1G vgdata
      out: '  Logical volume "lvapp" created.'
    - cmd: lvcreate -n lvlog -l 50%FREE vgdata
      out: '  Logical volume "lvlog" created.'
    - cmd: lvs
      out: "  LV    VG     Attr       LSize   Pool Origin Data%  Meta%  Move Log Cpy%Sync Convert\n  lvapp vgdata -wi-a-----   1.00g                                                    \n  lvlog vgdata -wi-a----- 252.00m                                                    "
    - cmd: mkfs.xfs /dev/vgdata/lvapp > /dev/null; mkdir -p /srv/app; mount /dev/vgdata/lvapp /srv/app; df -hT /srv/app
      out: 'Filesystem               Type  Size  Used Avail Use% Mounted on

        /dev/mapper/vgdata-lvapp xfs   960M   39M  922M   5% /srv/app'
    - cmd: ls -l /dev/vgdata/ /dev/mapper/ | grep lv
      out: 'lrwxrwxrwx. 1 root root       7 Oct  3 18:33 vgdata-lvapp -> ../dm-0

        lrwxrwxrwx. 1 root root       7 Oct  3 18:33 vgdata-lvlog -> ../dm-1

        lrwxrwxrwx. 1 root root 7 Oct  3 18:33 lvapp -> ../dm-0

        lrwxrwxrwx. 1 root root 7 Oct  3 18:33 lvlog -> ../dm-1'
    tasks:
    - text: Initialise sdb1 as a physical volume and list it.
      commands:
      - pvcreate /dev/sdb1
      - pvs
    - text: Create the volume group vgdata on it.
      commands:
      - vgcreate vgdata /dev/sdb1
    - text: Create a 1 GiB logical volume lvapp and another lvlog using half of the free space.
      commands:
      - lvcreate -n lvapp -L 1G vgdata
      - lvcreate -n lvlog -l 50%FREE vgdata
    - text: List the logical volumes.
      commands:
      - lvs
    - text: Make an XFS file system on lvapp, mount it on /srv/app and check.
      commands:
      - mkfs.xfs /dev/vgdata/lvapp > /dev/null; mkdir -p /srv/app; mount /dev/vgdata/lvapp /srv/app; df -hT /srv/app
quick:
  questions:
  - id: q-a4f23df4861c
    q: What is the order of LVM layers, from the disk upwards?
    options:
    - PV, VG, LV, file system
    - LV, VG, PV, file system
    - VG, PV, file system, LV
    answer: 0
    explain: Disks become PVs, PVs form a VG, LVs are cut from it, and the file system goes on the LV.
  - id: q-317090a0ec5d
    q: Which command creates a logical volume of 1 GiB named lvapp in the group vgdata?
    options:
    - lvcreate -n lvapp -L 1G vgdata
    - vgcreate lvapp 1G
    - pvcreate -L 1G lvapp
    answer: 0
    explain: -L is a size, -l a number of extents or a percentage.
  - id: q-e84b323f47fc
    q: What advantage does an LV have over a plain partition?
    options:
    - It can be resized, and can span several disks
    - It is faster
    - It needs no file system
    answer: 0
    explain: That flexibility is the reason for LVM.
  - id: q-a4217080527e
    q: Where does the device file of the LV lvapp in vgdata appear?
    options:
    - /dev/vgdata/lvapp (and /dev/mapper/vgdata-lvapp)
    - /dev/lvapp1
    - /dev/sdb3
    answer: 0
    explain: Both paths point to the same /dev/dm-N device.
  - id: q-da7025cb716d
    q: Which command shows the free space left in the volume groups?
    options:
    - vgs
    - lvs
    - df -h
    answer: 0
    explain: VFree column. pvs shows free space per PV.
  - id: q-4f1153895f03
    q: lvcreate asks "Wipe it?" about an xfs signature. What does it mean?
    options:
    - The space once held an old file system; answering y erases the stale signature
    - The LV already exists
    - XFS is not supported
    answer: 0
    explain: Use -y / --wipesignatures y when you are sure the old data is no longer needed.
