grow-flow:
  title: Growing a logical volume
  caption: Step through enlarging a mounted file system.
  height: 250
  mode: steps
  steps:
  - title: How much is free in the group?
    text: vgs shows VFree. If the free space covers the request, go to step 3.
  - title: Not enough? Add a disk
    text: Create a partition (set lvm on), then pvcreate and vgextend vgdata /dev/sdb2. The pool is bigger at once.
  - title: Extend the LV, and its file system
    text: lvextend -r -L +512M /dev/vgdata/lvapp. The -r option calls the right resize tool (xfs_growfs or resize2fs) as well. This works while the file system is mounted.
  - title: Verify
    text: df -h MOUNTPOINT and lvs show the new size. Check the data is still there.
  elements:
  - kind: node
    x: 10
    y: 20
    w: 150
    h: 56
    tone: purple
    title: vgs
    sub: free space?
    mono: true
    titleSize: 13
    active:
    - 0
  - kind: node
    x: 190
    y: 20
    w: 150
    h: 56
    tone: blue
    title: vgextend
    sub: add a PV
    mono: true
    titleSize: 13
    active:
    - 1
    visible:
    - 1
    - 2
    - 3
  - kind: node
    x: 370
