job-states:
  title: The life of a job
  caption: Step through starting, pausing and resuming a command in your terminal.
  height: 230
  mode: steps
  steps:
  - title: Foreground
    text: 'You type sleep 500. It runs in the foreground: your shell waits, and the prompt does not come back.'
  - title: 'Ctrl+Z: stop it'
    text: Ctrl+Z sends a stop signal. The job is paused (state T) and listed by jobs as Stopped; the prompt returns.
  - title: 'bg: continue in the background'
    text: bg %1 resumes it without giving it the terminal. You get the prompt back while it works.
  - title: 'fg: bring it back'
    text: fg %1 returns it to the foreground, so you can see its output, or press Ctrl+C to end it.
  - title: Start in the background
    text: Add & to the command (sleep 500 &) to start it in the background from the beginning.
  elements:
