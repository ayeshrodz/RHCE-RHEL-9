states:
  title: Process states
  caption: Select a state letter, as shown in the STAT column of ps.
  height: 230
  mode: select
  initial: s
  info:
    r:
      tone: green
      title: 'R: running'
      text: Running on a CPU, or waiting in the queue for one. A busy process spends its life here.
    s:
      tone: blue
      title: 'S: sleeping'
      text: 'Waiting for something: input, a timer, a network reply. It can be woken by a signal. Most processes are in this state most of the time.'
    d:
      tone: amber
      title: 'D: uninterruptible sleep'
      text: Waiting for hardware or disk and cannot be interrupted, not even by kill -9. Rare and brief; a process stuck in D usually points to a storage problem.
    t:
      tone: coral
      title: 'T: stopped'
      text: Paused by a signal (Ctrl+Z or SIGSTOP). It keeps its memory and resumes with SIGCONT.
    z:
      tone: purple
      title: 'Z: zombie'
      text: Finished, but its parent has not yet collected its exit status. It uses no CPU or memory, only a process-table entry. Fix the parent; the zombie cannot be killed.
