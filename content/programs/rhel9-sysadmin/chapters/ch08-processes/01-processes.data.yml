practice:
  text:
    hint: Click here and type the commands. This terminal remembers nothing between commands, so it shows each command's result as it was on servera.
    inputLabel: Command to run in the practice terminal
    eventNotFound: 'bash: {value0}: event not found'
    notHere: This practice terminal only knows the examples in this lesson. Try anything else on servera.
    notFound: 'bash: {value0}: command not found'
    searchPrompt: '(reverse-i-search)`{value0}'':'
    noMatch: no match yet
    tasksTitle: Your tasks
    allDone: All done. Now try the same on servera.
    doneLabel: done
    reset: Start again
  data: {}
  props:
    title: 'Practice terminal: looking at processes'
    prompt: '[student@servera ~]$'
    commands:
    - cmd: ps
      out: "    PID TTY          TIME CMD\n    661 ?        00:00:00 systemd\n    663 ?        00:00:00 (sd-pam)\n    670 pts/0    00:00:00 bash\n    712 pts/0    00:00:00 ps"
    - cmd: echo $$
      out: '670'
    - cmd: ps aux | head -4
      out: 'USER         PID %CPU %MEM    VSZ   RSS TTY      STAT START   TIME COMMAND

        root           1  8.2  1.7  26836 16424 ?        Ss   16:21   0:00 /usr/lib/systemd/systemd --switched-root --system --deserialize 31

        root           2  0.0  0.0      0     0 ?        S    16:21   0:00 [kthreadd]

        root           3  0.0  0.0      0     0 ?        S    16:21   0:00 [pool_workqueue_]'
    - cmd: ps -o pid,ppid,user,stat,ni,pcpu,pmem,comm -p $$
      out: "    PID    PPID USER     STAT  NI %CPU %MEM COMMAND\n    670     659 student  Ss     0  0.0  0.3 bash"
    - cmd: ps -ef --forest | head -4
      out: 'UID          PID    PPID  C STIME TTY          TIME CMD

        root           2       0  0 16:21 ?        00:00:00 [kthreadd]

        root           3       2  0 16:21 ?        00:00:00  \_ [pool_workqueue_]

        root           4       2  0 16:21 ?        00:00:00  \_ [kworker/R-rcu_gp]'
    - cmd: pstree -p | head -4
      out: "systemd(1)-+-NetworkManager(547)-+-{NetworkManager}(548)\n           |                     |-{NetworkManager}(549)\n           |                     `-{NetworkManager}(550)"
    - cmd: ps -eo pid,ppid,stat,comm --sort=-pcpu | head -3
      out: "    PID    PPID STAT COMMAND\n      1       0 Ss   systemd\n     17       2 S<   pr/ttyS0"
    - cmd: cat /proc/$$/status | head -3
      out: "Name:\tbash\nUmask:\t0022\nState:\tS (sleeping)"
    tasks:
    - text: Find the PID of your own shell.
      commands:
      - echo $$
    - text: List every process in the standard BSD format.
      commands:
      - ps aux | head -4
    - text: Show your shell's PID, parent, state and niceness.
      commands:
      - ps -o pid,ppid,user,stat,ni,pcpu,pmem,comm -p $$
    - text: Draw the process tree with PIDs.
      commands:
      - pstree -p | head -4
quick:
  questions:
  - id: q-c6939e973c83
    q: What does PPID mean?
    options:
    - The parent's process ID
    - The process priority
    - The port the process listens on
    answer: 0
    explain: Every process except PID 1 was started by another process, its parent.
  - id: q-2ed170c605e9
    q: Which process has PID 1 on RHEL?
    options:
    - systemd
    - bash
    - init.sh
    answer: 0
    explain: systemd starts first and is the ancestor of every other process.
  - id: q-c27ff6313ff4
    q: A process shows STAT Z in ps. What does that mean?
    options:
    - It finished but its parent has not collected the exit status
    - It is using too much CPU
    - It is paused with Ctrl+Z
    answer: 0
    explain: A zombie uses no CPU or memory. You fix it by fixing or ending the parent; kill -9 cannot remove it.
  - id: q-5e7c634af533
    q: Which command shows processes as a parent-child tree?
    options:
    - pstree
    - ps -l
    - top -c
    answer: 0
    explain: pstree (or ps -ef --forest) draws the family tree.
  - id: q-021355a7728d
    q: What does the shell do to run an external command like ls?
    options:
    - fork a child, which then execs the program
    - Load ls into its own memory and run it
    - Ask systemd to start it
    answer: 0
    explain: fork creates the copy and exec replaces it with the new program.
  - id: q-2de6f74f740b
    q: Where do you find the live details of process 1234, such as its state?
    options:
    - /proc/1234
    - /var/run/1234
    - /etc/processes
    answer: 0
    explain: /proc has a directory per process; ps and top read the same data.
