lifecycle:
  title: How a command becomes a process
  caption: Step through what happens when you type ls.
  height: 230
  mode: steps
  steps:
  - title: You type ls
    text: Your shell (bash, PID 670) is a running process. It reads the line and finds that ls is not built in.
  - title: 'fork: the shell copies itself'
    text: 'The kernel creates a child process, a near-copy of the shell with a new PID (say 701). The shell is its parent: the child''s PPID is 670.'
  - title: 'exec: the child becomes ls'
    text: In the child, the kernel replaces the copy of bash with the ls program. The PID stays 701; only the program changes.
  - title: ls runs and exits
    text: ls prints the listing, then exits and hands back an exit status (0 means success).
  - title: The parent collects the result
    text: The shell waits for its child, reads the exit status (available as $?), and shows the prompt again. Every process on the system was started this way, all the way back to PID 1.
