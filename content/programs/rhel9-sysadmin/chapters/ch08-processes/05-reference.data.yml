recall:
  cards:
  - front: Load is high while CPU usage is low. What should you investigate?
    back: I/O waits and blocked work as well as CPU. Load includes more than CPU execution; high load
      can accompany blocked I/O.
  - front: Which nice value gives lower ordinary CPU priority?
    back: 15 Higher nice values mean lower scheduling preference, not a fixed usage limit.
  - front: A killed daemon immediately returns. What is a likely explanation?
    back: Its service manager has a restart policy. A supervised service can create a new process after
      an unexpected exit.
