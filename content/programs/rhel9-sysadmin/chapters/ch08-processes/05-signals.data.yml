signals:
  title: Common signals
  caption: Select a signal to see when to use it.
  height: 250
  mode: select
  initial: term
  info:
    hup:
      tone: gray
      title: 1 · SIGHUP
      text: Hang up. Sent when a terminal closes. Many daemons treat it as "reload your configuration".
    int:
      tone: blue
      title: 2 · SIGINT
      text: Interrupt. What Ctrl+C sends to the foreground program.
    term:
      tone: green
      title: 15 · SIGTERM
      text: Terminate, politely. The default for kill. The program can clean up, save its work and exit. Always try this first.
    kill:
      tone: coral
      title: 9 · SIGKILL
      text: Kill, immediately. The kernel ends the process; it cannot catch or ignore it, and cannot clean up. A last resort.
    stop:
      tone: amber
      title: 19 · SIGSTOP
      text: Pause the process. It cannot be ignored. (Ctrl+Z sends a similar SIGTSTP, number 20.)
    cont:
      tone: teal
      title: 18 · SIGCONT
      text: Continue a stopped process.
