quick:
  questions:
  - id: q-5f48ad19bfbd
    q: What does kill 1234 send by default?
    options:
    - SIGTERM (15)
    - SIGKILL (9)
    - SIGHUP (1)
    answer: 0
    explain: The default is the polite terminate request. Use -9 only when that fails.
  - id: q-5ddc09376cce
    q: Why is SIGKILL a last resort?
    options:
    - The process cannot clean up or save data
    - It needs root
    - It only works once
    answer: 0
    explain: SIGKILL cannot be caught, so the program has no chance to flush buffers or remove temporary files.
  - id: q-2294b7051ebf
    q: Which command ends every process named "myapp" at once?
    options:
    - pkill myapp
    - kill myapp
    - ps myapp
    answer: 0
    explain: pkill and killall match by name; kill needs PIDs (or job numbers).
  - id: q-2a5176026d0d
    q: How do you safely check which processes pkill sleep would hit?
    options:
    - pgrep -a sleep
    - ps sleep
    - top sleep
    answer: 0
    explain: pgrep uses the same matching as pkill and only lists, so check before you signal.
  - id: q-d3060048fd0c
    q: Which signal pauses a process so it can later continue?
    options:
    - SIGSTOP, then SIGCONT
    - SIGHUP
    - SIGKILL
    answer: 0
    explain: kill -STOP PID pauses it; kill -CONT PID resumes it.
  - id: q-7411f6882549
    q: A process in state D does not react to kill -9. What does this suggest?
    options:
    - It is waiting on hardware or storage
    - It has already ended
    - It is a shell builtin
    answer: 0
    explain: Uninterruptible sleep ends when the I/O finishes. Look for a storage or network-mount problem.
  - id: q-766dadc7f5d1
    q: How do you end all processes owned by user bob?
    options:
    - pkill -u bob
    - kill bob
    - userdel bob
    answer: 0
    explain: pkill -u USER matches by owner. (pkill -KILL -u bob if they ignore the polite request.)
