escalation:
  title: Ending a stuck process
  caption: Step through the safe order of escalation.
  height: 220
  mode: steps
  steps:
  - title: Identify it
    text: 'Find the right process first: pgrep -a NAME or ps aux | grep NAME. Check the user, the command line and the PID.'
  - title: 'Ask: SIGTERM'
    text: kill PID (signal 15). Wait a few seconds. Most programs save their work and exit.
  - title: Still there? Look again
    text: 'Check with ps -p PID. If it is in state D, or is a zombie, kill will not help: look at what it is waiting for, or at its parent.'
  - title: 'Insist: SIGKILL'
    text: kill -9 PID. The kernel removes the process at once. Unsaved data and temporary files are lost, so use it last.
