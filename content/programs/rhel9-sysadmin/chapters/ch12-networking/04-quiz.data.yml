questions:
  questions:
  - q: A saved profile has a new address but ip address still shows the old one. Why?
    options:
    - The saved profile may not yet have been applied to the live device.
    - Profiles and live state must always match instantly.
    - DNS controls local address activation.
    answer: 0
    explain: Modification and activation are separate steps.
    id: q-1dd0af4e2460
  - q: ping works but an HTTP request fails. What did ping establish?
    options:
    - That port 80 is listening.
    - That the application document root is valid.
    - ICMP reachability, not application readiness.
    answer: 2
    explain: Service protocol tests must be performed independently.
    id: q-63a721358915
  - q: LXD names a NIC eth0 while the guest shows enp5s0. Which name belongs in guest nmcli device operations?
    options:
    - The host bridge name.
    - The device name reported inside the guest.
    - Always eth0.
    answer: 1
    explain: Host device labels and guest interface naming are distinct.
    id: q-3acb687538f1
