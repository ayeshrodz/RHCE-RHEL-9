resolution:
  title: How a name becomes an address
  caption: Step through what happens when a program asks for serverb.
  height: 250
  mode: steps
  steps:
  - title: A program asks
    text: curl http://serverb:8080 needs the address for the name serverb. It asks the C library, not the network.
  - title: Read nsswitch.conf
    text: '/etc/nsswitch.conf has a line hosts: files dns myhostname. It says: try these sources in this order.'
  - title: '1 · files: /etc/hosts'
    text: First the local file /etc/hosts is searched for the name. If a line matches, that is the answer, and DNS is never asked.
  - title: '2 · dns: the resolver'
    text: Otherwise the DNS servers in /etc/resolv.conf are asked, in order. A search domain (lab.example.com) is added to short names like serverb.
  - title: 3 · The answer comes back
    text: The address returns to the program, which connects to it. getent hosts NAME follows this exact path, which is why it is the best test of "what will programs see".
