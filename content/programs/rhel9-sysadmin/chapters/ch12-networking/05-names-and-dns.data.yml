practice:
  text:
    hint: Click here and type the commands. This terminal remembers nothing between commands, so it shows each command's result as it was on servera.
    inputLabel: Command to run in the practice terminal
    eventNotFound: 'bash: {value0}: event not found'
    notHere: This practice terminal only knows the examples in this lesson. Try anything else on servera.
    notFound: 'bash: {value0}: command not found'
    searchPrompt: '(reverse-i-search)`{value0}'':'
    noMatch: no match yet
    tasksTitle: Your tasks
    allDone: All done. Now try the same on servera.
    doneLabel: done
    reset: Start again
  data: {}
  props:
    title: 'Practice terminal: names'
    prompt: '[root@servera ~]#'
    commands:
    - cmd: hostnamectl --static
      out: servera.lab.example.com
    - cmd: cat /etc/hostname
      out: servera.lab.example.com
    - cmd: cat /etc/resolv.conf
      out: '# Generated by NetworkManager

        search lab.example.com

        nameserver 172.25.250.254'
    - cmd: grep ^hosts /etc/nsswitch.conf
      out: 'hosts:      files dns myhostname'
    - cmd: getent hosts serverb
      out: 172.25.250.11   serverb.lab.example.com
    - cmd: dig +short serverb.lab.example.com
      out: 172.25.250.11
    - cmd: host serverb
      out: serverb.lab.example.com has address 172.25.250.11
    - cmd: echo "10.1.1.1 fake.example.com fake" >> /etc/hosts
      out: ''
    - cmd: getent hosts fake
      out: 10.1.1.1        fake.example.com
    - cmd: hostnamectl set-hostname alpha.lab.example.com
      out: ''
    - cmd: hostname
      out: alpha.lab.example.com
    tasks:
    - text: Show the static host name.
      commands:
      - hostnamectl --static
    - text: See which DNS server and search domain are in use.
      commands:
      - cat /etc/resolv.conf
    - text: Ask what a program would resolve serverb to.
      commands:
      - getent hosts serverb
    - text: Query DNS directly for serverb.lab.example.com.
      commands:
      - dig +short serverb.lab.example.com
    - text: Add a local name to /etc/hosts and resolve it.
      commands:
      - echo "10.1.1.1 fake.example.com fake" >> /etc/hosts
      - getent hosts fake
quick:
  questions:
  - id: q-39a3e7fe2d13
    q: A name resolves differently with dig and with getent. Which one shows what programs will see?
    options:
    - getent hosts
    - dig
    - host
    answer: 0
    explain: dig talks to DNS only. getent follows nsswitch.conf, so it includes /etc/hosts.
  - id: q-e00839634d57
    q: Where do you set the host name permanently?
    options:
    - hostnamectl set-hostname NAME
    - echo NAME > /tmp/hostname
    - ip link set name
    answer: 0
    explain: It writes /etc/hostname and applies it at once.
  - id: q-9b5fa6e2c120
    q: /etc/hosts and DNS disagree about a name. Which wins on a default RHEL?
    options:
    - /etc/hosts (files come first)
    - DNS
    - The one listed last
    answer: 0
    explain: 'nsswitch.conf says: files dns.'
  - id: q-af5e1efde67c
    q: Which file lists the DNS servers?
    options:
    - /etc/resolv.conf
    - /etc/hosts
    - /etc/hostname
    answer: 0
    explain: NetworkManager writes it from the connection profile. To change DNS permanently, change the profile.
  - id: q-db4b44305712
    q: What does the search domain do?
    options:
    - It is appended to short names such as serverb
    - It blocks sites
    - It lists mail servers
    answer: 0
    explain: serverb is tried as serverb.lab.example.com.
  - id: q-e21c3ae0b320
    q: Which command shows the A record only, briefly?
    options:
    - dig +short NAME
    - dig NAME ANY
    - host -a NAME
    answer: 0
    explain: +short prints just the answer.
