device-profile:
  title: Devices and connection profiles
  caption: Step through how NetworkManager configures an interface.
  height: 250
  mode: steps
  steps:
  - title: A device
    text: 'enp5s0 is a network device: the hardware, seen by the kernel. nmcli device status lists devices.'
  - title: A connection profile
    text: 'A profile is a saved set of settings: name, address method, address, gateway, DNS. It is stored under /etc/NetworkManager/system-connections/ and survives reboots. nmcli connection show lists them.'
  - title: 'Activate: apply a profile to a device'
    text: nmcli connection up NAME applies the profile to the device. The kernel gets the address, routes and DNS settings.
  - title: Modify changes the profile, not the device
    text: nmcli connection modify … edits the stored profile only. Nothing changes on the wire until you run nmcli connection up NAME again.
  - title: Deactivate or delete
    text: connection down removes the settings from the device but keeps the profile; connection delete removes the profile too.
  elements:
