ladder:
  title: Work up the ladder
  caption: Step through the layers; stop at the first one that fails.
  height: 260
  mode: steps
  steps:
  - title: 1 · Is the link up?
    text: 'ip -br link and nmcli device status: the interface must be UP and connected. If not, nothing above can work.'
  - title: 2 · Does it have an address?
    text: 'ip -br addr: a valid address and prefix for the right network. A 169.254.x.x address means DHCP failed.'
  - title: 3 · Can it reach the gateway?
    text: 'ip route shows the default route; ping -c 2 GATEWAY tests it. If this fails, the problem is local: cable, switch, address, prefix.'
  - title: 4 · Can it reach the target by address?
    text: ping -c 2 192.0.2.10 (an address, not a name). If this works, routing is fine.
  - title: 5 · Does the name resolve?
    text: getent hosts NAME. If the address works and the name does not, look at /etc/hosts, /etc/resolv.conf and the DNS server.
  - title: 6 · Is the service reachable?
    text: curl -v http://HOST:PORT. "No route to host" with a working ping usually means a firewall; "Connection refused" means nothing listens on that port (check ss -tlnp on the server); a timeout is a silent drop.
