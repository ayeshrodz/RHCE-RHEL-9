practice:
  text:
    hint: Click here and type the commands. This terminal remembers nothing between commands, so it shows each command's result as it was on servera.
    inputLabel: Command to run in the practice terminal
    eventNotFound: 'bash: {value0}: event not found'
    notHere: This practice terminal only knows the examples in this lesson. Try anything else on servera.
    notFound: 'bash: {value0}: command not found'
    searchPrompt: '(reverse-i-search)`{value0}'':'
    noMatch: no match yet
    tasksTitle: Your tasks
    allDone: All done. Now try the same on servera.
    doneLabel: done
    reset: Start again
  data: {}
  props:
    title: 'Practice terminal: finding where it breaks'
    prompt: '[root@servera ~]#'
    commands:
    - cmd: curl -sS -m 5 http://serverb:8080/
      out: 'curl: (7) Failed to connect to serverb port 8080: No route to host'
    - cmd: ping -c 1 serverb
      out: 'PING serverb.lab.example.com (172.25.250.11) 56(84) bytes of data.

        64 bytes from serverb.lab.example.com (172.25.250.11): icmp_seq=1 ttl=64 time=0.134 ms


        --- serverb.lab.example.com ping statistics ---

        1 packets transmitted, 1 received, 0% packet loss, time 0ms'
    - cmd: ss -tlnp | grep 8080
      out: LISTEN 0      5          127.0.0.1:8080      0.0.0.0:*    users:(("python3",pid=679,fd=3))
    - cmd: curl -sS -m 5 http://serverb:8080/
      out: 'curl: (7) Failed to connect to serverb port 8080: Connection refused'
    - cmd: curl -sS -m 5 http://serverb:8080/
      out: hello from serverb
    - cmd: timeout 3 bash -c '</dev/tcp/serverb/8080' && echo open || echo closed
      out: open
    tasks:
    - text: Test the service from servera.
      commands:
      - curl -sS -m 5 http://serverb:8080/
    - text: Check that serverb itself answers a ping.
      commands:
      - ping -c 1 serverb
    - text: On serverb, show what listens on port 8080 and on which address.
      commands:
      - ss -tlnp | grep 8080
quick:
  questions:
  - id: q-67f305df9dc4
    q: ping to the server works, but curl says "No route to host". What is the most likely cause?
    options:
    - A firewall on the server rejects the port
    - The cable is unplugged
    - DNS is down
    answer: 0
    explain: The address is reachable; the specific port is rejected.
  - id: q-864182f0b06c
    q: curl says "Connection refused". What does it mean?
    options:
    - The host answered, but nothing listens on that port
    - The host is off
    - DNS failed
    answer: 0
    explain: Check ss -tlnp on the server; the service may be stopped or bound to another address.
  - id: q-b81de55522a3
    q: ss -tlnp shows 127.0.0.1:8080 for a service. Who can reach it?
    options:
    - Only programs on the same host
    - Everyone on the network
    - Nobody
    answer: 0
    explain: It listens on the loopback address only. 0.0.0.0 means every address.
  - id: q-b56b8a036a57
    q: A name does not resolve but pinging the IP address works. Which layer is broken?
    options:
    - Name resolution
    - The gateway
    - The link
    answer: 0
    explain: Check getent hosts, /etc/hosts and /etc/resolv.conf.
  - id: q-772470f1a23e
    q: Which command traces the path to a destination and shows each hop?
    options:
    - tracepath
    - ss
    - hostnamectl
    answer: 0
    explain: tracepath (or traceroute) lists the routers on the way.
  - id: q-8980a1797f1c
    q: Which first step suits a connectivity problem best?
    options:
    - 'Work up from the link: link, address, gateway, target, name, port'
    - Reboot
    - Disable the firewall
    answer: 0
    explain: Checking in order finds the first failing layer.
