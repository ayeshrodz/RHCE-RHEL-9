questions:
  questions:
  - q: SSH reports a changed host key after a reset. What is the right next step?
    options:
    - Disable host-key checking globally.
    - Copy your private key to the server.
    - Verify the replacement fingerprint through a trusted path.
    answer: 2
    explain: A rebuild is a possible cause, but the warning alone does not establish trust.
    id: q-69799cd36562
  - q: A restrictive drop-in has no effect. What must you inspect?
    options:
    - Whether the private key has a public comment.
    - Effective configuration, include order and Match blocks.
    - Only the filename extension.
    answer: 1
    explain: OpenSSH processing order and conditional settings can make a file differ from effective policy.
    id: q-13da44d984e2
  - q: Which key goes into the server account authorized_keys?
    options:
    - The public key.
    - The private key.
    - The server host private key.
    answer: 0
    explain: Private identity material stays with its owner on the client.
    id: q-706951ebca51
