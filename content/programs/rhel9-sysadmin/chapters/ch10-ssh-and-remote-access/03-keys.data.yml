practice:
  text:
    hint: Click here and type the commands. This terminal remembers nothing between commands, so it shows each command's result as it was on workstation.
    inputLabel: Command to run in the practice terminal
    eventNotFound: 'bash: {value0}: event not found'
    notHere: This practice terminal only knows the examples in this lesson. Try anything else on workstation.
    notFound: 'bash: {value0}: command not found'
    searchPrompt: '(reverse-i-search)`{value0}'':'
    noMatch: no match yet
    tasksTitle: Your tasks
    allDone: All done. Now try the same on workstation.
    doneLabel: done
    reset: Start again
  data: {}
  props:
    title: 'Practice terminal: creating and installing a key'
    prompt: '[student@workstation ~]$'
    commands:
    - cmd: ssh-keygen -t ed25519 -f ~/.ssh/id_ops -C 'student@workstation (ops)'
      out: "Generating public/private ed25519 key pair.\nEnter passphrase (empty for no passphrase): \nEnter same passphrase again: \nYour identification has been saved in /home/student/.ssh/id_ops\nYour public key has been saved in /home/student/.ssh/id_ops.pub\nThe key fingerprint is:\nSHA256:5AQbFTBUkvfPw8I6cXrZ71yQTp6wis83oln7qAUHiBA student@workstation (ops)"
    - cmd: ls -l ~/.ssh/id_ops*
      out: '-rw-------. 1 student student 419 Oct  3 16:48 /home/student/.ssh/id_ops

        -rw-r--r--. 1 student student 107 Oct  3 16:48 /home/student/.ssh/id_ops.pub'
    - cmd: ssh-copy-id -i ~/.ssh/id_ops.pub ops@servera
      out: "/usr/bin/ssh-copy-id: INFO: Source of key(s) to be installed: \"/home/student/.ssh/id_ops.pub\"\n/usr/bin/ssh-copy-id: INFO: attempting to log in with the new key(s), to filter out any that are already installed\n/usr/bin/ssh-copy-id: INFO: 1 key(s) remain to be installed -- if you are prompted now it is to install the new keys\nops@servera's password: \n\nNumber of key(s) added: 1\n\nNow try logging into the machine, with: \"ssh -i /home/student/.ssh/id_ops 'ops@servera'\"\nand check to make sure that only the key(s) you wanted were added."
    - cmd: ssh -i ~/.ssh/id_ops ops@servera hostname
      out: servera.lab.example.com
    - cmd: ssh -i ~/.ssh/id_ops ops@servera ls -ld .ssh .ssh/authorized_keys
      out: 'drwx------. 2 ops ops 4096 Oct  3 16:48 .ssh

        -rw-------. 1 ops ops  107 Oct  3 16:48 .ssh/authorized_keys'
    - cmd: eval $(ssh-agent -s)
      out: Agent pid 1400
    - cmd: ssh-add ~/.ssh/id_ops
      out: 'Identity added: /home/student/.ssh/id_ops (student@workstation (ops))'
    - cmd: ssh-add -l
      out: 256 SHA256:5AQbFTBUkvfPw8I6cXrZ71yQTp6wis83oln7qAUHiBA student@workstation (ops) (ED25519)
    tasks:
    - text: Generate an Ed25519 key pair called id_ops.
      commands:
      - ssh-keygen -t ed25519 -f ~/.ssh/id_ops -C 'student@workstation (ops)'
    - text: Check the permissions of the private and public key.
      commands:
      - ls -l ~/.ssh/id_ops*
    - text: Install the public key on servera for the account ops.
      commands:
      - ssh-copy-id -i ~/.ssh/id_ops.pub ops@servera
    - text: Log in with that key.
      commands:
      - ssh -i ~/.ssh/id_ops ops@servera hostname
    - text: Start an agent for this shell and load the key.
      commands:
      - eval $(ssh-agent -s)
      - ssh-add ~/.ssh/id_ops
quick:
  questions:
  - id: q-6c0e67bd1283
    q: Which file on the SERVER holds the public keys allowed to log in?
    options:
    - ~/.ssh/authorized_keys
    - ~/.ssh/known_hosts
    - /etc/ssh/ssh_host_ed25519_key
    answer: 0
    explain: authorized_keys in the home of the account you log in to.
  - id: q-123f352d64ea
    q: Which command installs your public key on a server?
    options:
    - ssh-copy-id
    - scp -k
    - ssh-add
    answer: 0
    explain: ssh-copy-id appends the key to authorized_keys and fixes the permissions.
  - id: q-3e697b400715
    q: A key login that used to work now fails. The journal says "bad ownership or modes". What is wrong?
    options:
    - Permissions on ~/.ssh or authorized_keys let others write
    - The key expired
    - The server clock is wrong
    answer: 0
    explain: sshd refuses keys when the files could be altered by others. Use 700 for ~/.ssh and 600 for authorized_keys.
  - id: q-43e4596ea800
    q: What does ssh-agent do for you?
    options:
    - Holds a decrypted key in memory so you type the passphrase once
    - Copies keys to servers
    - Encrypts your files
    answer: 0
    explain: ssh-add loads a key; later logins use it without prompting.
  - id: q-cf8ee56696b4
    q: Why protect a private key with a passphrase?
    options:
    - A stolen file is useless without it
    - It makes logins faster
    - Servers require it
    answer: 0
    explain: The passphrase encrypts the key file at rest.
  - id: q-1f5bc25c0608
    q: What travels over the network during a key login?
    options:
    - A signature of a challenge, not the private key
    - The private key
    - Your password
    answer: 0
    explain: The server verifies the signature with your public key.
