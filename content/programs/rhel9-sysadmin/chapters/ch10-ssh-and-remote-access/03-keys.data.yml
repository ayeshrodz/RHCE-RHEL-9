key-auth:
  title: Logging in with a key
  caption: Step through a key login. The private key never leaves your machine.
  height: 250
  mode: steps
  steps:
  - title: Setup, once
    text: ssh-keygen makes a pair. The public half is copied into ~ops/.ssh/authorized_keys on the server (ssh-copy-id does it for you).
  - title: The client offers the key
    text: On login, the client says "I have this public key" and the server looks it up in authorized_keys.
  - title: The server sends a challenge
    text: Found. The server sends a random challenge that only the holder of the matching private key can answer.
  - title: The client signs it
    text: Your private key signs the challenge on your machine and only the signature goes back. The key itself is never sent.
  - title: The server verifies and lets you in
    text: The server checks the signature with the public key. No password crosses the network, and there is nothing to guess.
