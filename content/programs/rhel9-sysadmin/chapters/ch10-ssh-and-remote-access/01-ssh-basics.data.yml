practice:
  text:
    hint: Click here and type the commands. This terminal remembers nothing between commands, so it shows each command's result as it was on workstation.
    inputLabel: Command to run in the practice terminal
    eventNotFound: 'bash: {value0}: event not found'
    notHere: This practice terminal only knows the examples in this lesson. Try anything else on workstation.
    notFound: 'bash: {value0}: command not found'
    searchPrompt: '(reverse-i-search)`{value0}'':'
    noMatch: no match yet
    tasksTitle: Your tasks
    allDone: All done. Now try the same on workstation.
    doneLabel: done
    reset: Start again
  data: {}
  props:
    title: 'Practice terminal: SSH basics'
    prompt: '[student@workstation ~]$'
    commands:
    - cmd: ssh ops@servera hostname
      out: servera.lab.example.com
    - cmd: ssh -V
      out: OpenSSH_9.9p1, OpenSSL 3.5.8 25 Aug 2026
    - cmd: ssh-keygen -F servera
      out: "# Host servera found: line 4 \nservera ssh-ed25519 AAAAC3NzaC1lZDI1NTE5AAAAIEq/gysqG3foWRTSyKuVl0kS/q29bH2U6TkZqKd6dIKr"
    - cmd: ssh-keygen -lF servera
      out: "# Host servera found: line 4 \nservera ED25519 SHA256:FiQsZBEl3IPrcGlIbHS4VrVteB5aT0PVAD5VNj91+Hk"
    - cmd: ssh root@servera ssh-keygen -lf /etc/ssh/ssh_host_ed25519_key.pub
      out: 256 SHA256:FiQsZBEl3IPrcGlIbHS4VrVteB5aT0PVAD5VNj91+Hk root@servera (ED25519)
    - cmd: ssh-keyscan -t ed25519 servera
      out: '# servera:22 SSH-2.0-OpenSSH_9.9

        servera ssh-ed25519 AAAAC3NzaC1lZDI1NTE5AAAAIEq/gysqG3foWRTSyKuVl0kS/q29bH2U6TkZqKd6dIKr'
    - cmd: ssh -o StrictHostKeyChecking=accept-new ops@servera hostname
      out: 'Warning: Permanently added ''servera'' (ED25519) to the list of known hosts.

        servera.lab.example.com'
    tasks:
    - text: Run one command on servera as ops and come back.
      commands:
      - ssh ops@servera hostname
    - text: Show the fingerprint of servera in your known_hosts.
      commands:
      - ssh-keygen -lF servera
    - text: Ask servera for the fingerprint of its own key, to compare.
      commands:
      - ssh root@servera ssh-keygen -lf /etc/ssh/ssh_host_ed25519_key.pub
quick:
  questions:
  - id: q-93e735c83757
    q: What does ssh check against ~/.ssh/known_hosts?
    options:
    - The identity of the server
    - Your password
    - Your private key
    answer: 0
    explain: known_hosts holds the server keys you trust, so ssh can tell if you are talking to the same machine as before.
  - id: q-f16069ead8b0
    q: When is the best moment to verify a host fingerprint?
    options:
    - At the first "Are you sure?" prompt, against a trusted source
    - After logging in
    - Never; it is automatic
    answer: 0
    explain: Trust on first use only works if you actually check the first time (for example by comparing with what the server shows locally).
  - id: q-0058305f6430
    q: 'You see "WARNING: REMOTE HOST IDENTIFICATION HAS CHANGED". What do you do first?'
    options:
    - Find out why the key changed (rebuild?) before removing the old entry
    - Delete known_hosts
    - Retry with StrictHostKeyChecking=no
    answer: 0
    explain: A changed key may be a rebuilt machine or an attack. Confirm with the owner, then ssh-keygen -R HOST.
  - id: q-cd7e4dce64a6
    q: Which command runs one command on a remote host without opening a shell?
    options:
    - ssh user@host command
    - ssh -c user@host
    - ssh --run command
    answer: 0
    explain: Everything after the host is run remotely, and its output comes back.
  - id: q-2ec9aa528cc2
    q: Which file must stay private?
    options:
    - ~/.ssh/id_ed25519
    - ~/.ssh/id_ed25519.pub
    - ~/.ssh/known_hosts
    answer: 0
    explain: The private key proves who you are. The .pub file is meant to be shared.
  - id: q-1bc50c1dfcc4
    q: Which command shows the fingerprint of a public key file?
    options:
    - ssh-keygen -lf FILE
    - ssh-keygen -p FILE
    - ssh-add -d FILE
    answer: 0
    explain: -l prints the fingerprint; -f names the file.
