ssh-files:
  title: The files behind SSH
  caption: Select a file to see its job.
  height: 250
  mode: select
  initial: known
  info:
    known:
      tone: amber
      title: ~/.ssh/known_hosts (client)
      text: 'The servers you have trusted: one line per host, with its public host key. A mismatch here is the "host key changed" warning.'
    priv:
      tone: coral
      title: ~/.ssh/id_ed25519 (client)
      text: Your PRIVATE key. Mode 600, never copied anywhere. Whoever holds it can log in as you everywhere the public half is installed.
    pub:
      tone: green
      title: ~/.ssh/id_ed25519.pub (client)
      text: Your PUBLIC key. Safe to share and to put on servers.
    config:
      tone: blue
      title: ~/.ssh/config (client)
      text: 'Your shortcuts and defaults per host: user name, key to use, port.'
    auth:
      tone: purple
      title: ~/.ssh/authorized_keys (server)
      text: 'On the server, in the home of the account you log in to: the public keys allowed to log in as that account. Mode 600, in a 700 directory.'
    hostkey:
      tone: gray
      title: /etc/ssh/ssh_host_* (server)
      text: The server's own identity keys. They are what clients put in known_hosts. Do not copy them to other machines.
  elements:
  - kind: group
    x: 8
    y: 6
    w: 330
    h: 150
