first-connection:
  title: Trust on first use
  caption: Step through your first connection to a new server, and a later one.
  height: 250
  mode: steps
  steps:
  - title: You connect
    text: ssh ops@servera. The server answers by presenting its host key, which proves which machine it is.
  - title: Unknown host
    text: The key is not in ~/.ssh/known_hosts, so ssh shows its fingerprint and asks whether to trust it. This is the one moment where you must check the fingerprint against a trusted source.
  - title: You answer yes
    text: ssh stores the key in ~/.ssh/known_hosts and carries on to the login. Later connections do not ask.
  - title: 'Next time: same key'
    text: ssh compares what the server presents with the stored copy. They match, so you go straight to the login, silently.
  - title: 'Next time: different key'
    text: 'If the key differs, ssh refuses with WARNING: REMOTE HOST IDENTIFICATION HAS CHANGED. It may be a rebuilt server, or an attacker pretending to be it. Find out which before you touch known_hosts.'
