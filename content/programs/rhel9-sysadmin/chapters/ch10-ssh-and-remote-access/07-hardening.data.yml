safe-change:
  title: Change sshd without locking yourself out
  caption: Step through the safe routine.
  height: 220
  mode: steps
  steps:
  - title: Keep a session open
    text: Stay logged in on a second terminal (or a root console). An open session survives a reload, and is your way back if the change is wrong.
  - title: Edit a drop-in
    text: Put your change in /etc/ssh/sshd_config.d/10-NAME.conf instead of editing the main file.
  - title: Test the syntax
    text: sshd -t prints nothing when the configuration is valid. Then sshd -T | grep OPTION shows the value that really applies.
  - title: Reload, do not restart
    text: systemctl reload sshd applies the change without dropping existing connections.
  - title: Test a NEW login
    text: Open a third terminal and log in again. Only when that works, close the spare session. If it does not, fix the file using the session you kept open.
  elements:
