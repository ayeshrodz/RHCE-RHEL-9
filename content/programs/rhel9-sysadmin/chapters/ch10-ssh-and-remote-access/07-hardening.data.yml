practice:
  text:
    hint: Click here and type the commands. This terminal remembers nothing between commands, so it shows each command's result as it was on servera.
    inputLabel: Command to run in the practice terminal
    eventNotFound: 'bash: {value0}: event not found'
    notHere: This practice terminal only knows the examples in this lesson. Try anything else on servera.
    notFound: 'bash: {value0}: command not found'
    searchPrompt: '(reverse-i-search)`{value0}'':'
    noMatch: no match yet
    tasksTitle: Your tasks
    allDone: All done. Now try the same on servera.
    doneLabel: done
    reset: Start again
  data: {}
  props:
    title: 'Practice terminal: checking sshd'
    prompt: '[root@servera ~]#'
    commands:
    - cmd: sshd -T | grep -E '^(passwordauthentication|x11forwarding|maxauthtries|permitrootlogin) '
      out: 'maxauthtries 6

        permitrootlogin without-password

        passwordauthentication yes

        x11forwarding yes'
    - cmd: ls /etc/ssh/sshd_config.d
      out: 50-cloud-init.conf  50-redhat.conf
    - cmd: grep -n "^Include" /etc/ssh/sshd_config
      out: 15:Include /etc/ssh/sshd_config.d/*.conf
    - cmd: printf 'PasswordAuthentication no\nX11Forwarding no\nMaxAuthTries 3\n' > /etc/ssh/sshd_config.d/10-hardening.conf
      out: ''
    - cmd: sshd -t
      out: ''
    - cmd: sshd -T | grep -E '^(passwordauthentication|x11forwarding|maxauthtries) '
      out: 'maxauthtries 3

        passwordauthentication no

        x11forwarding no'
    - cmd: systemctl reload sshd
      out: ''
    - cmd: journalctl -u sshd -n 2 --no-pager
      out: 'Oct 03 16:49:26 servera.lab.example.com systemd[1]: Reloaded OpenSSH server daemon.

        Oct 03 16:49:26 servera.lab.example.com sshd-session[1049]: Accepted publickey for ops from 172.25.251.9 port 41346 ssh2: ED25519 SHA256:5AQbFTBUkvfPw8I6cXrZ71yQTp6wis83oln7qAUHiBA'
    tasks:
    - text: Show the current values of the options you care about.
      commands:
      - sshd -T | grep -E '^(passwordauthentication|x11forwarding|maxauthtries|permitrootlogin) '
    - text: Write the hardening drop-in with the three settings.
      commands:
      - printf 'PasswordAuthentication no\nX11Forwarding no\nMaxAuthTries 3\n' > /etc/ssh/sshd_config.d/10-hardening.conf
    - text: Test the configuration syntax.
      commands:
      - sshd -t
    - text: Apply the change without dropping connections.
      commands:
      - systemctl reload sshd
quick:
  questions:
  - id: q-e84ee000d399
    q: You set PasswordAuthentication no in 99-hardening.conf, but sshd -T still says yes. Why?
    options:
    - An earlier file (50-cloud-init.conf) set it first, and the first value wins
    - sshd must be restarted
    - 99 is reserved
    answer: 0
    explain: Drop-ins are read in alphabetical order and the first value found is used, so name yours 10-.
  - id: q-74d17c19f139
    q: Which command shows the value sshd really uses?
    options:
    - sshd -T
    - sshd -t
    - ssh -V
    answer: 0
    explain: -T prints the effective configuration; -t only checks the syntax.
  - id: q-644b1a6ba712
    q: Why reload instead of restart sshd?
    options:
    - Existing sessions stay connected
    - Reload is faster
    - Restart is not allowed
    answer: 0
    explain: A reload makes sshd re-read its configuration without dropping connections.
  - id: q-0be34b629cd5
    q: What is the safest way to test a new sshd configuration on a remote machine?
    options:
    - Keep a session open and test a new login before closing it
    - Reboot
    - Disable the firewall
    answer: 0
    explain: The old session survives and lets you undo a mistake.
  - id: q-9c58bfc0c7b0
    q: PermitRootLogin no means ...
    options:
    - Root cannot log in over SSH at all
    - Root needs a key
    - Root needs sudo
    answer: 0
    explain: Administrators log in as themselves and use sudo. (The default here, prohibit-password, allows root with a key only.)
  - id: q-88b539e0928b
    q: Which log shows failed and successful SSH logins?
    options:
    - journalctl -u sshd (and /var/log/secure)
    - /var/log/ssh.log
    - dmesg
    answer: 0
    explain: sshd logs to the journal and, on RHEL, to /var/log/secure.
