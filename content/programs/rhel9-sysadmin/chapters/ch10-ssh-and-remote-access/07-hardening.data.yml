precedence:
  title: Which line wins?
  caption: sshd uses the first value it finds. Step through the files in the order sshd reads them.
  height: 250
  mode: steps
  steps:
  - title: The main file includes drop-ins first
    text: /etc/ssh/sshd_config starts with Include /etc/ssh/sshd_config.d/*.conf, so the drop-ins are read before the rest of the main file.
  - title: Alphabetical order
    text: 'Drop-ins are read in alphabetical order: 10-..., 50-..., 99-.... The first one to set an option decides its value.'
  - title: A late file loses
    text: 50-cloud-init.conf already says PasswordAuthentication yes. A file called 99-hardening.conf that says no is read later, and is ignored for that option.
  - title: An early file wins
    text: Name your file 10-hardening.conf and its PasswordAuthentication no is read first and wins. Always confirm with sshd -T.
  elements:
  - kind: node
    x: 10
    y: 20
    w: 200
    h: 50
    tone: gray
    title: 10-...
    sub: (not there yet)
    mono: true
    titleSize: 12
    active:
    - 0
    - 1
    - 2
    - 3
    overrides:
      title:
        '0': 10-...
        '1': 10-...
        '2': 10-...
        '3': 10-hardening.conf
      sub:
        '0': (not there yet)
        '1': (not there yet)
        '2': (not there yet)
        '3': PasswordAuthentication no
  - kind: node
    x: 240
