dnf-flow:
  title: What dnf does for you
  caption: Step through dnf install zip.
  height: 250
  mode: steps
  steps:
  - title: You ask
    text: dnf install zip. rpm alone would stop at "failed dependencies"; dnf finds and brings what zip needs.
  - title: Read the repository metadata
    text: 'dnf downloads (and caches) a catalogue from each enabled repository: which packages exist, in which versions, and what they need.'
  - title: Solve the dependencies
    text: zip needs unzip. dnf works out the complete list of packages to install and shows it to you for confirmation.
  - title: Download and verify
    text: It downloads the packages and checks each one's GPG signature against the repository's key. An unsigned or tampered package is refused.
  - title: Run the transaction
    text: It installs the packages with rpm in one transaction, runs their scriptlets, and records the whole change in the dnf history, where it can be undone.
