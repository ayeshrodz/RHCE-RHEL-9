streams:
  title: Module streams
  caption: Step through choosing a version of nginx.
  height: 240
  mode: steps
  steps:
  - title: Several versions, one name
    text: 'The AppStream repository can carry several versions of a program as module streams: nginx 1.22, 1.24, 1.26. Without a stream, the plain package (an older, non-modular nginx 1.20) is what dnf offers.'
  - title: Enable a stream
    text: dnf module enable nginx:1.24 selects it. From now on dnf offers nginx 1.24.x and its updates, and no other version.
  - title: Install from it
    text: dnf install nginx (or dnf module install nginx:1.24/common to take a profile) installs that version. Updates stay within the stream.
  - title: 'Switching: reset first'
    text: A stream cannot simply be switched. Remove the installed content, dnf module reset nginx, and enable the new stream. This prevents silent major-version jumps.
