verify-flags:
  title: Reading rpm -V
  caption: Select a letter of S.5....T.
  height: 240
  mode: select
  initial: s
  info:
    s:
      tone: coral
      title: 'S: size'
      text: The file size differs from the one in the package.
    dot:
      tone: gray
      title: . (dot)
      text: This property is fine. rpm -V prints only files that have something different, and a dot for each property that is unchanged.
    five:
      tone: coral
      title: '5: checksum'
      text: The contents differ from the package (the MD5/SHA digest does not match). This is the clearest sign a file was edited.
    t:
      tone: amber
      title: 'T: time'
      text: The modification time differs. A config file you edited shows this, and that is normal; a program that changed was probably modified.
    other:
      tone: gray
      title: M, U, G, L, D, P
      text: Mode (permissions), User, Group, symbolic Link, Device, caPabilities. A c in the column after the flags marks a configuration file.
  elements:
  - kind: node
    x: 10
    y: 28
    w: 60
    h: 56
    tone: coral
    title: S
    sub: size
    mono: true
    titleSize: 20
    select: s
    active:
    - s
  - kind: node
    x: 76
    y: 28
    w: 50
    h: 56
    tone: gray
    title: .
    sub: mode
    mono: true
    titleSize: 20
    select: dot
    active:
    - dot
  - kind: node
    x: 132
