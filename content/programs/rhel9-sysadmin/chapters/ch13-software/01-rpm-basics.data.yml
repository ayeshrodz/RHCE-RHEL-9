nvra:
  title: Reading a package name
  caption: Select a part of tree-1.8.0-10.el9.x86_64.
  height: 240
  mode: select
  initial: name
  info:
    name:
      tone: blue
      title: 'Name: tree'
      text: What the software is called. rpm -q tree asks for exactly this name.
    version:
      tone: purple
      title: 'Version: 1.8.0'
      text: The version published by the upstream project.
    release:
      tone: teal
      title: 'Release: 10.el9'
      text: The distributor's build number for that version (10th packaging of 1.8.0), plus the distribution tag (el9 = Enterprise Linux 9). Bug fixes that keep the upstream version raise the release.
    arch:
      tone: amber
      title: 'Architecture: x86_64'
      text: The CPU type it was built for. noarch means it works on any (scripts, data, docs).
    ext:
      tone: gray
      title: .rpm
      text: The file form of a package. An installed package lives in the RPM database (/var/lib/rpm), not as a file.
  elements:
