local-repo:
  title: Build a repository of your own
  caption: Step through creating a local repository from downloaded packages.
  height: 240
  mode: steps
  steps:
  - title: Gather the packages
    text: dnf download --resolve --destdir /srv/localrepo zip downloads the package and its dependencies as .rpm files (the plugin comes from dnf-plugins-core).
  - title: Create the metadata
    text: 'createrepo_c /srv/localrepo scans the .rpm files and writes the repodata/ directory: the catalogue that dnf reads.'
  - title: Describe it to dnf
    text: A file in /etc/yum.repos.d/ with baseurl=file:///srv/localrepo, enabled=1 and gpgcheck=1 with the gpgkey line.
  - title: Use it
    text: 'dnf --disablerepo="*" --enablerepo=localrepo install zip uses only your repository. dnf info shows From repo : localrepo.'
  elements:
  - kind: node
    x: 10
    y: 20
    w: 150
    h: 56
    tone: blue
    title: .rpm files
    sub: /srv/localrepo
    mono: true
    titleSize: 12.5
    active:
    - 0
  - kind: node
    x: 180
    y: 20
    w: 150
    h: 56
    tone: purple
    title: repodata/
    sub: createrepo_c
    mono: true
    titleSize: 13
    active:
    - 1
    visible:
    - 1
    - 2
    - 3
  - kind: node
    x: 350
    y: 20
    w: 150
    h: 56
    tone: amber
    title: local.repo
    sub: /etc/yum.repos.d
    mono: true
    titleSize: 12.5
    active:
    - 2
    visible:
    - 2
    - 3
  - kind: node
    x: 520
