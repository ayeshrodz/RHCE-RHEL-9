repo-file:
  title: A repository file
  caption: Select a line of a .repo file.
  height: 260
  mode: select
  initial: baseurl
  info:
    id:
      tone: blue
      title: '[localrepo]'
      text: 'The repository id: a short name used on the command line (--enablerepo=localrepo). Must be unique.'
    name:
      tone: gray
      title: name=
      text: A human-readable description, shown by dnf repolist.
    baseurl:
      tone: green
      title: baseurl=
      text: 'Where the packages and their metadata are: a URL starting with https://, http://, ftp:// or file:///. Several lines allowed. (Public repositories often use mirrorlist= or metalink= instead, which choose a mirror for you.)'
    enabled:
      tone: teal
      title: enabled=1
      text: Whether dnf uses the repository by default. 0 keeps it defined but off; dnf --enablerepo=ID turns it on for one command.
    gpgcheck:
      tone: coral
      title: gpgcheck=1
      text: 'Check the GPG signature of every package from this repository. Turning it off (0) removes the protection against tampered packages: do it only for repositories you built yourself and trust.'
    gpgkey:
      tone: amber
      title: gpgkey=
      text: Where the public key for the signatures is. dnf offers to import it the first time. Packages from the distribution are all signed with the same key.
  elements:
