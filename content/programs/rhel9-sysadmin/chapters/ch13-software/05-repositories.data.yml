practice:
  text:
    hint: Click here and type the commands. This terminal remembers nothing between commands, so it shows each command's result as it was on servera.
    inputLabel: Command to run in the practice terminal
    eventNotFound: 'bash: {value0}: event not found'
    notHere: This practice terminal only knows the examples in this lesson. Try anything else on servera.
    notFound: 'bash: {value0}: command not found'
    searchPrompt: '(reverse-i-search)`{value0}'':'
    noMatch: no match yet
    tasksTitle: Your tasks
    allDone: All done. Now try the same on servera.
    doneLabel: done
    reset: Start again
  data: {}
  props:
    title: 'Practice terminal: repositories'
    prompt: '[root@servera ~]#'
    commands:
    - cmd: dnf repolist
      out: 'repo id                         repo name

        appstream                       Rocky Linux 9 - AppStream

        baseos                          Rocky Linux 9 - BaseOS

        extras                          Rocky Linux 9 - Extras'
    - cmd: ls /etc/yum.repos.d
      out: rocky-addons.repo  rocky-devel.repo  rocky-extras.repo  rocky-security.repo  rocky.repo
    - cmd: dnf repolist --all | head -4
      out: 'repo id                    repo name                                    status

        appstream                  Rocky Linux 9 - AppStream                    enabled

        appstream-debuginfo        Rocky Linux 9 - AppStream - Debug            disabled

        appstream-source           Rocky Linux 9 - AppStream - Source           disabled'
    - cmd: dnf install -y dnf-plugins-core createrepo_c
      out: Complete!
    - cmd: mkdir -p /srv/localrepo
      out: ''
    - cmd: dnf download --resolve --destdir /srv/localrepo zip
      out: "(1/2): zip-3.0-35.el9.x86_64.rpm                1.2 MB/s | 263 kB     00:00    \n(2/2): unzip-6.0-60.el9_8.x86_64.rpm            778 kB/s | 180 kB     00:00    "
    - cmd: createrepo_c /srv/localrepo
      out: 'Directory walk started

        Directory walk done - 2 packages

        Preparing sqlite DBs

        Pool started (with 5 workers)

        Pool finished'
    - cmd: rpm -K /srv/localrepo/zip-3.0-35.el9.x86_64.rpm
      out: '/srv/localrepo/zip-3.0-35.el9.x86_64.rpm: digests signatures OK'
    - cmd: dnf --disablerepo="*" --enablerepo=localrepo list available
      out: 'Available Packages

        unzip.x86_64                       6.0-60.el9_8                        localrepo

        zip.x86_64                         3.0-35.el9                          localrepo'
    - cmd: dnf --disablerepo="*" --enablerepo=localrepo install -y zip
      out: "Installed:\n  unzip-6.0-60.el9_8.x86_64                zip-3.0-35.el9.x86_64\n\nComplete!"
    - cmd: dnf info zip | grep From
      out: 'From repo    : localrepo'
    tasks:
    - text: List the enabled repositories, then all of them.
      commands:
      - dnf repolist
      - dnf repolist --all | head -4
    - text: Download zip and its dependencies into /srv/localrepo.
      commands:
      - dnf download --resolve --destdir /srv/localrepo zip
    - text: Build the repository metadata.
      commands:
      - createrepo_c /srv/localrepo
    - text: Check the signature of a downloaded package.
      commands:
      - rpm -K /srv/localrepo/zip-3.0-35.el9.x86_64.rpm
    - text: Install from your repository only.
      commands:
      - dnf --disablerepo="*" --enablerepo=localrepo install -y zip
quick:
  questions:
  - id: q-e90b0402f14c
    q: Where do repository definitions live?
    options:
    - /etc/yum.repos.d/*.repo
    - /var/lib/rpm
    - /etc/dnf/modules.d
    answer: 0
    explain: Every .repo file may define several repositories.
  - id: q-9645de6c2f17
    q: What does gpgcheck=1 do?
    options:
    - dnf verifies each package's signature
    - dnf compresses downloads
    - dnf checks the server clock
    answer: 0
    explain: It protects against modified packages.
  - id: q-185b44b9bab6
    q: Which command builds the metadata for a directory of .rpm files?
    options:
    - createrepo_c DIR
    - dnf makecache DIR
    - rpm --rebuilddb
    answer: 0
    explain: It writes DIR/repodata.
  - id: q-7d60fc72918c
    q: How do you use one repository only, for one command?
    options:
    - dnf --disablerepo="*" --enablerepo=ID ...
    - dnf --repo-only ID
    - Edit rpm.conf
    answer: 0
    explain: This is also how you prove which repository supplies a package.
  - id: q-f5a8424dbd1a
    q: What does baseurl=file:///srv/localrepo mean?
    options:
    - The repository is a directory on this machine
    - An FTP server
    - A mirror list
    answer: 0
    explain: file:/// followed by an absolute path.
  - id: q-8c2849dabcfb
    q: Why not set gpgcheck=0 for convenience?
    options:
    - Anyone able to change the repository could install malware
    - It slows dnf
    - It is not allowed
    answer: 0
    explain: For your own repository of packages that you downloaded from a signed source, you can keep gpgcheck=1 with the vendor key.
