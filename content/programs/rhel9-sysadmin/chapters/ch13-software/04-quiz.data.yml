questions:
  questions:
  - q: DNF check-update exits 100. What does that mean?
    options:
    - No repository exists.
    - The database must be deleted.
    - Updates are available.
    answer: 2
    explain: 100 is the command documented update-available status.
    id: q-f3ef62fbbde5
  - q: An update installed a new kernel. What establishes which kernel currently runs?
    options:
    - The repository name.
    - uname -r
    - Only rpm -q kernel
    answer: 1
    explain: Installed packages and the running kernel are different states.
    id: q-b941b11ac7b8
  - q: A Kickstart validates. What still needs real deployment testing?
    options:
    - Disk selection, repository access and resulting system behavior.
    - Nothing; syntax validation proves every resource is correct.
    - Only the filename.
    answer: 0
    explain: A validator cannot prove that the target environment matches the intended installation.
    id: q-7a32a88e3413
