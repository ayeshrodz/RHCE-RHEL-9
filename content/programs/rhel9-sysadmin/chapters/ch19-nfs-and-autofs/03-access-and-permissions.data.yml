uid-mapping:
  title: Users are numbers
  caption: Step through the same file seen from the server and from the client.
  height: 260
  mode: steps
  steps:
  - title: On the server
    text: alice has UID 2001 on serverb and owns /srv/shared/alice. student has UID 1000 on both servers.
  - title: 'On the client: the same number matters'
    text: servera has no alice. ls -l shows the owner as 2001, a bare number. NFS carries user IDs, not names.
  - title: student works as expected
    text: student is UID 1000 on both machines, so files student creates on servera belong to student on serverb too, and access is allowed or denied exactly as on the server.
  - title: root is squashed
    text: root on servera is UID 0, which the server maps to nobody (root_squash). A root-owned directory is therefore read-only for root through the mount. This is by design.
  - title: Fix the cause, not the symptom
    text: Create users with the same UID and GID everywhere (or use a directory service), and set ownership and modes on the server. Avoid no_root_squash and chmod 777.
  elements:
  - kind: node
    x: 10
    y: 20
    w: 170
    h: 60
    tone: green
    title: serverb
    sub: alice = 2001
    mono: true
    titleSize: 13
    active:
    - 0
    - 2
  - kind: node
    x: 500
    y: 20
    w: 170
    h: 60
    tone: blue
    title: servera
    sub: student = 1000
    mono: true
    titleSize: 13
