recall:
  cards:
  - front: An autofs parent exists but no NFS child appears yet. What should you do?
    back: Access a defined child key and inspect the triggered mount. An on-demand child mount is created
      when the mapped path is used.
  - front: Why does root_squash matter?
    back: It prevents client root from automatically acting as server root. Root mapping constrains identity;
      it is not encryption or retention.
  - front: A mapping does not expire while your shell is inside it. Why?
    back: The mount is busy due to active use. Processes holding a path open can prevent idle unmounting.
