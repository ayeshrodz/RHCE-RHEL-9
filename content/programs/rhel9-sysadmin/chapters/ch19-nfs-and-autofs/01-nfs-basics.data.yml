nfs-flow:
  title: Sharing a directory over NFS
  caption: Step through a client reading a file from a server.
  height: 260
  mode: steps
  steps:
  - title: The server exports a directory
    text: '/etc/exports on serverb says: share /srv/shared with the lab network, read-write. exportfs -rav publishes the list, and the nfs-server service answers requests.'
  - title: The firewall lets NFS in
    text: NFS version 4 needs only TCP port 2049. In firewalld that is the service nfs. Without it, the client sees "No route to host".
  - title: The client mounts it
    text: mount -t nfs serverb:/srv/shared /mnt/shared. The remote directory now appears at /mnt/shared as an ordinary directory, with type nfs4.
  - title: Access checks happen on the server
    text: Each read or write carries the user ID of the client user. The server checks it against the file permissions (and squashes root). Same numbers on both sides give the expected result.
  elements:
