export-options:
  title: Export options
  caption: Select an option of a line in /etc/exports.
  height: 270
  mode: select
  initial: rw
  info:
    path:
      tone: gray
      title: /srv/shared
      text: The directory on the server to export. Subdirectories are included, but not other file systems mounted below it.
    host:
      tone: blue
      title: 172.25.250.0/24
      text: 'Who may mount it: one host (servera), a name pattern (*.lab.example.com), or a network (192.168.0.0/24). Without a host, everyone may. List several, each with its own options.'
    rw:
      tone: green
      title: rw or ro
      text: Read-write or read-only for that client. ro is the safer default for data that does not need changing.
    sync:
      tone: amber
      title: sync
      text: The server confirms a write only after it is on disk. Safer than async, slightly slower.
    squash:
      tone: coral
      title: root_squash (default)
      text: Requests from root on the client are treated as the unprivileged user nobody on the server, so a client cannot act as root there. no_root_squash disables it (needed rarely, and dangerous); all_squash maps everybody to nobody.
  elements:
