practice:
  text:
    hint: Click here and type the commands. This terminal remembers nothing between commands, so it shows each command's result as it was on servera.
    inputLabel: Command to run in the practice terminal
    eventNotFound: 'bash: {value0}: event not found'
    notHere: This practice terminal only knows the examples in this lesson. Try anything else on servera.
    notFound: 'bash: {value0}: command not found'
    searchPrompt: '(reverse-i-search)`{value0}'':'
    noMatch: no match yet
    tasksTitle: Your tasks
    allDone: All done. Now try the same on servera.
    doneLabel: done
    reset: Start again
  data: {}
  props:
    title: 'Practice terminal: server and client'
    prompt: '[root@serverb ~]#'
    commands:
    - cmd: dnf install -y nfs-utils
      out: 'Package nfs-utils-1:2.5.4-42.el9.x86_64 is already installed.

        Nothing to do.

        Complete!'
    - cmd: mkdir -p /srv/shared; echo "shared file" > /srv/shared/hello.txt
      out: ''
    - cmd: echo '/srv/shared  172.25.250.0/24(rw,sync)' > /etc/exports
      out: ''
    - cmd: systemctl enable --now nfs-server
      out: Created symlink /etc/systemd/system/multi-user.target.wants/nfs-server.service → /usr/lib/systemd/system/nfs-server.service.
    - cmd: exportfs -rav
      out: exporting 172.25.250.0/24:/srv/shared
    - cmd: exportfs -v
      out: "/srv/shared   \t172.25.250.0/24(sync,wdelay,hide,no_subtree_check,sec=sys,rw,secure,root_squash,no_all_squash)"
    - cmd: firewall-cmd --permanent --add-service=nfs; firewall-cmd --reload
      out: 'success

        success'
    - cmd: firewall-cmd --list-services
      out: cockpit dhcpv6-client nfs ssh
    - cmd: mkdir -p /mnt/shared; mount -t nfs serverb:/srv/shared /mnt/shared
      out: (run this one on servera, the client)
    - cmd: df -hT /mnt/shared
      out: 'Filesystem          Type  Size  Used Avail Use% Mounted on

        serverb:/srv/shared nfs4   20G  1.7G   18G   9% /mnt/shared'
    tasks:
    - text: Create the exports file for the lab network, read-write.
      commands:
      - echo '/srv/shared  172.25.250.0/24(rw,sync)' > /etc/exports
    - text: Start the NFS server now and at boot.
      commands:
      - systemctl enable --now nfs-server
    - text: Publish the exports and show them with options.
      commands:
      - exportfs -rav
      - exportfs -v
    - text: Allow NFS through the firewall, permanently.
      commands:
      - firewall-cmd --permanent --add-service=nfs; firewall-cmd --reload
    - text: On the client, mount the share and look at it.
      commands:
      - mkdir -p /mnt/shared; mount -t nfs serverb:/srv/shared /mnt/shared
      - df -hT /mnt/shared
quick:
  questions:
  - id: q-e03aa649df40
    q: Which file lists the directories an NFS server shares?
    options:
    - /etc/exports
    - /etc/fstab
    - /etc/nfs.conf only
    answer: 0
    explain: exportfs -rav applies changes.
  - id: q-2d94368ad7e1
    q: Which port does NFSv4 need through the firewall?
    options:
    - TCP 2049 (the nfs service)
    - UDP 53
    - TCP 22
    answer: 0
    explain: NFSv3 needs more (rpc-bind, mountd).
  - id: q-641c229fa2f7
    q: Which service runs on the NFS server?
    options:
    - nfs-server
    - nfs-client
    - nfsd.timer
    answer: 0
    explain: systemctl enable --now nfs-server.
  - id: q-a5f0587a1d06
    q: How does the client attach the share?
    options:
    - mount -t nfs server:/export /mountpoint
    - nfs attach server
    - exportfs server
    answer: 0
    explain: The mount point must exist.
  - id: q-21399503afc1
    q: Which command shows the active exports and their options on the server?
    options:
    - exportfs -v
    - showmount -a
    - mount
    answer: 0
    explain: exportfs -rav re-reads /etc/exports.
  - id: q-62ce3a50811c
    q: What does root_squash do?
    options:
    - Maps the client's root to an unprivileged user on the server
    - Gives root extra rights
    - Compresses data
    answer: 0
    explain: It is on by default.
