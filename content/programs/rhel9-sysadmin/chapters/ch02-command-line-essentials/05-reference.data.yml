recall:
  cards:
  - front: A producer fails but the final pipeline command succeeds. How do you make that failure affect
      the pipeline status?
    back: Enable pipefail and handle the resulting status. Pipeline status and stream routing are separate
      mechanisms.
  - front: A variable holds two words. How do you pass it as one operand?
    back: Double-quote its expansion. Double quotes preserve the expansion as one argument; single quotes
      prevent expansion.
  - front: Why is sort input.txt > input.txt unsafe?
    back: The shell truncates the file before sort reads it. Open and truncate occur during shell setup,
      before the program reads input.
