questions:
  questions:
  - q: A producer fails but the final pipeline command succeeds. How do you make that failure affect the
      pipeline status?
    options:
    - Append to a log file.
    - Enable pipefail and handle the resulting status.
    - Redirect stderr to stdout.
    answer: 1
    explain: Pipeline status and stream routing are separate mechanisms.
    id: q-7199d8dc27e4
  - q: A variable holds two words. How do you pass it as one operand?
    options:
    - Double-quote its expansion.
    - Use an unquoted expansion.
    - Put its name in single quotes.
    answer: 0
    explain: Double quotes preserve the expansion as one argument; single quotes prevent expansion.
    id: q-1f152d3787b5
  - q: Why is sort input.txt > input.txt unsafe?
    options:
    - sort cannot read regular files.
    - Redirection always appends.
    - The shell truncates the file before sort reads it.
    answer: 2
    explain: Open and truncate occur during shell setup, before the program reads input.
    id: q-59a061489704
