questions:
  questions:
  - q: A new group is visible in getent but an old session cannot use it. Why?
    options:
    - The process inherited its groups at login; start a new session.
    - The group must be renamed.
    - Every group change requires a reboot.
    answer: 0
    explain: Existing processes do not automatically gain new supplementary groups.
    id: q-a1167c1a962b
  - q: Why is passwd -l alone insufficient for offboarding?
    options:
    - It always deletes the home.
    - It changes all file owners.
    - Other credentials and existing sessions may still provide access.
    answer: 2
    explain: Password locking addresses one authentication path, not the complete lifecycle.
    id: q-1519307f8aad
  - q: A restricted drop-in exists, but the user can run every root command. What should you inspect?
    options:
    - Whether the account has a home directory.
    - Other sudo rules and wheel membership.
    - The text editor font.
    answer: 1
    explain: Sudo authorizations accumulate; a narrow rule does not subtract broad permissions.
    id: q-04244c4ee33e
