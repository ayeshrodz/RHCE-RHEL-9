recall:
  cards:
  - front: A new group is visible in getent but an old session cannot use it. Why?
    back: The process inherited its groups at login; start a new session. Existing processes do not automatically
      gain new supplementary groups.
  - front: Why is passwd -l alone insufficient for offboarding?
    back: Other credentials and existing sessions may still provide access. Password locking addresses
      one authentication path, not the complete lifecycle.
  - front: A restricted drop-in exists, but the user can run every root command. What should you inspect?
    back: Other sudo rules and wheel membership. Sudo authorizations accumulate; a narrow rule does not
      subtract broad permissions.
