practice:
  text:
    hint: Click here and type the commands. This terminal remembers nothing between commands, so it shows each command's result as it was on servera.
    inputLabel: Command to run in the practice terminal
    eventNotFound: 'bash: {value0}: event not found'
    notHere: This practice terminal only knows the examples in this lesson. Try anything else on servera.
    notFound: 'bash: {value0}: command not found'
    searchPrompt: '(reverse-i-search)`{value0}'':'
    noMatch: no match yet
    tasksTitle: Your tasks
    allDone: All done. Now try the same on servera.
    doneLabel: done
    reset: Start again
  data: {}
  props:
    title: 'Practice terminal: backups that keep metadata'
    prompt: '[root@servera arch]#'
    commands:
    - cmd: getfacl -cp project/docs/notes.md
      out: 'user::rw-

        user:student:r--

        group::r--

        mask::r--

        other::r--'
    - cmd: tar -czf plain.tar.gz project; mkdir -p out1; tar -xzf plain.tar.gz -C out1; getfacl -cp out1/project/docs/notes.md
      out: 'user::rw-

        group::r--

        other::r--'
    - cmd: tar -czf acl.tar.gz --acls --selinux --xattrs project
      out: ''
    - cmd: mkdir -p out3; tar -xzf acl.tar.gz -C out3 --acls --selinux --xattrs; getfacl -cp out3/project/docs/notes.md
      out: 'user::rw-

        user:student:r--

        group::r--

        mask::r--

        other::r--'
    - cmd: tar --listed-incremental=bk/state.snar -czf bk/full.tar.gz work; ls bk
      out: full.tar.gz  state.snar
    - cmd: tar --listed-incremental=bk/state.snar -czf bk/incr1.tar.gz work; tar -tzf bk/incr1.tar.gz
      out: 'work/

        work/docs/

        work/docs/a.txt

        work/docs/c.txt'
    - cmd: rsync -a --link-dest=/tmp/arch/bk/snap1 work/ bk/snap2/; ls -i bk/snap1/docs/a.txt bk/snap2/docs/a.txt
      out: 262001 bk/snap1/docs/a.txt  262001 bk/snap2/docs/a.txt
    tasks:
    - text: Create an archive that keeps ACLs, SELinux labels and extended attributes.
      commands:
      - tar -czf acl.tar.gz --acls --selinux --xattrs project
    - text: Extract it keeping them, and check the ACL.
      commands:
      - mkdir -p out3; tar -xzf acl.tar.gz -C out3 --acls --selinux --xattrs; getfacl -cp out3/project/docs/notes.md
    - text: Make a full backup with a state file.
      commands:
      - tar --listed-incremental=bk/state.snar -czf bk/full.tar.gz work; ls bk
    - text: Make an incremental backup and see that it holds only the changes.
      commands:
      - tar --listed-incremental=bk/state.snar -czf bk/incr1.tar.gz work; tar -tzf bk/incr1.tar.gz
quick:
  questions:
  - id: q-6e22a27d25df
    q: You restore a backup and the extra ACL entries are gone. What was missing?
    options:
    - --acls on both creating and extracting
    - -v
    - a bigger disk
    answer: 0
    explain: tar does not keep ACLs unless asked.
  - id: q-002c6ad174af
    q: Where must you run an incremental restore from?
    options:
    - Extract the full backup first, then each incremental in order
    - Only the last incremental
    - Any order
    answer: 0
    explain: Each incremental builds on the previous state.
  - id: q-2ff01903b300
    q: Which paths must you never include in a backup of a running system?
    options:
    - /proc, /sys, /dev and the backup file itself
    - /home
    - /etc
    answer: 0
    explain: They are virtual or change while the backup runs.
  - id: q-14c7ea480b2d
    q: What makes an rsync --link-dest snapshot small?
    options:
    - Unchanged files are hard links to the previous snapshot
    - It compresses the files
    - It skips big files
    answer: 0
    explain: 'Same inode: the data is stored once.'
  - id: q-36ee57f145c4
    q: Why test-restore a backup into a new empty directory?
    options:
    - To prove it works without touching the originals
    - It is faster
    - tar requires it
    answer: 0
    explain: Compare with diff -r.
  - id: q-0f412a55565f
    q: As an ordinary user, what limits restoring a backup?
    options:
    - You cannot give files to other owners
    - tar refuses
    - ACLs are not supported
    answer: 0
    explain: Ownership restoration needs root.
