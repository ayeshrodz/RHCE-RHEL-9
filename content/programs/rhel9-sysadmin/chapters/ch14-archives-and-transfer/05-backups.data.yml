metadata:
  title: What a backup must keep
  caption: Select an item; the flag tells tar to keep it.
  height: 260
  mode: select
  initial: acl
  info:
    perm:
      tone: green
      title: Permissions and owners
      text: Kept by default when tar runs as root (-p is the default for root). As an ordinary user, owners cannot be restored to other accounts.
    links:
      tone: green
      title: Symbolic and hard links
      text: Kept as links, not as copies of the target. Check restored links with ls -l.
    acl:
      tone: amber
      title: 'ACLs: --acls'
      text: NOT kept unless you add --acls when creating AND when extracting. Without it, the extra access entries silently disappear.
    sel:
      tone: amber
      title: 'SELinux labels: --selinux'
      text: Kept only with --selinux on both sides. Without it, restored files get the default label for where they land (and may need restorecon).
    xattr:
      tone: amber
      title: 'Extended attributes: --xattrs'
      text: Other metadata attached to files, for example capabilities. --xattrs keeps them.
    sparse:
      tone: gray
      title: Special cases
      text: Sparse files (-S) and device files need care. Do not archive /proc, /sys, /dev or the backup file itself.
  elements:
  - kind: node
    x: 10
    y: 26
    w: 200
    h: 46
    tone: green
    title: owners · permissions
    sub: default (as root)
    titleSize: 12.5
    select: perm
    active:
    - perm
  - kind: node
    x: 220
    y: 26
    w: 200
    h: 46
    tone: green
    title: symbolic · hard links
    sub: default
    titleSize: 12.5
    select: links
    active:
    - links
  - kind: node
    x: 10
    y: 80
    w: 200
    h: 46
    tone: amber
    title: ACLs
    sub: --acls
    mono: true
    titleSize: 13
    select: acl
    active:
    - acl
  - kind: node
    x: 220
    y: 80
    w: 200
    h: 46
    tone: amber
    title: SELinux labels
    sub: --selinux
    mono: true
    titleSize: 13
    select: sel
    active:
    - sel
  - kind: node
    x: 430
