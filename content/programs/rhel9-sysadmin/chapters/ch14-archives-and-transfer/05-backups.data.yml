incremental:
  title: Full and incremental backups
  caption: Step through backups with a state file (tar --listed-incremental).
  height: 250
  mode: steps
  steps:
  - title: Full backup
    text: tar --listed-incremental=state.snar -czf full.tar.gz work. The state file records what existed. All files are archived.
  - title: Things change
    text: a.txt is edited, c.txt is created, b.txt is deleted.
  - title: Incremental backup
    text: 'The same command with a new name (incr1.tar.gz) and the same state file archives only what changed since: a.txt and c.txt.'
  - title: Restore in order
    text: 'Extract full.tar.gz first, then each incremental, always with --listed-incremental=/dev/null. tar also applies the deletions: b.txt is removed again.'
  elements:
  - kind: node
    x: 10
    y: 20
    w: 140
    h: 56
    tone: green
    title: full.tar.gz
    sub: a b
    mono: true
    titleSize: 12.5
    active:
    - 0
    - 3
  - kind: node
    x: 10
    y: 86
    w: 140
    h: 50
    tone: gray
    title: state.snar
    sub: what exists
    mono: true
    titleSize: 12
    active:
    - 0
    - 2
  - kind: node
    x: 180
    y: 20
    w: 150
    h: 56
    tone: amber
    title: changes
    sub: a edited · c new · b gone
    titleSize: 11.5
    active:
    - 1
    visible:
    - 1
    - 2
    - 3
  - kind: node
    x: 360
