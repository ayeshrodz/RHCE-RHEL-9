questions:
  questions:
  - q: What does a matching checksum establish by itself?
    options:
    - The application restore will succeed.
    - The bytes match the referenced digest.
    - The archive publisher is necessarily trustworthy.
    answer: 1
    explain: A digest checks integrity against a reference; authenticity needs trusted provenance.
    id: q-37fe4480797d
  - q: Why preview rsync --delete separately?
    options:
    - It can remove destination data absent from the selected source.
    - It can only add files.
    - It always retains historical versions.
    answer: 0
    explain: Deletion propagates source state and can destroy retained copies.
    id: q-304bdb1c54c6
  - q: A normal-user restore preserves content. What is still unproven?
    options:
    - Whether any bytes were extracted.
    - Whether a directory can contain files.
    - Recovery of arbitrary ownership and privileged service behavior.
    answer: 2
    explain: Privilege and metadata requirements need separate verification.
    id: q-38b78744e25f
