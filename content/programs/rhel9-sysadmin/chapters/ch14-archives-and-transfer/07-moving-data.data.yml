methods:
  title: Moving data between hosts
  caption: Select a method.
  height: 250
  mode: select
  initial: rsync
  info:
    scp:
      tone: blue
      title: scp
      text: Simple one-off copy of files or a directory (-r). Always copies everything. Fine for small jobs.
    rsync:
      tone: green
      title: rsync -a
      text: Copies only what changed, can resume, keeps permissions and times, can mirror with --delete. The default choice for directory trees and repeated copies. Add -A -X for ACLs and extended attributes (-H for hard links).
    pipe:
      tone: purple
      title: tar over ssh
      text: 'tar -czf - dir | ssh host "tar -xzf - -C dest": streams an archive without creating a temporary file. Keeps whatever tar keeps, and works when rsync is missing.'
    check:
      tone: amber
      title: Verify afterwards
      text: sha256sum on both sides (or rsync -c --dry-run) proves the copy is identical. Trust, but verify.
  elements:
  - kind: node
    x: 10
    y: 30
    w: 150
    h: 64
    tone: blue
    title: scp
    sub: simple
    mono: true
    titleSize: 15
    select: scp
    active:
    - scp
  - kind: node
    x: 176
    y: 30
    w: 150
    h: 64
    tone: green
    title: rsync -a
    sub: only changes
    mono: true
    titleSize: 15
    select: rsync
    active:
    - rsync
  - kind: node
    x: 342
    y: 30
    w: 150
    h: 64
    tone: purple
    title: tar | ssh
    sub: a stream
    mono: true
    titleSize: 15
