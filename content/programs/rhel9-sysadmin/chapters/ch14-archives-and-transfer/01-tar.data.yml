practice:
  text:
    hint: Click here and type the commands. This terminal remembers nothing between commands, so it shows each command's result as it was on servera.
    inputLabel: Command to run in the practice terminal
    eventNotFound: 'bash: {value0}: event not found'
    notHere: This practice terminal only knows the examples in this lesson. Try anything else on servera.
    notFound: 'bash: {value0}: command not found'
    searchPrompt: '(reverse-i-search)`{value0}'':'
    noMatch: no match yet
    tasksTitle: Your tasks
    allDone: All done. Now try the same on servera.
    doneLabel: done
    reset: Start again
  data: {}
  props:
    title: 'Practice terminal: tar'
    prompt: '[root@servera arch]#'
    commands:
    - cmd: tar -cvf project.tar project
      out: 'project/

        project/docs/

        project/docs/notes.md

        project/run.sh

        project/link.md

        project/src/

        project/src/data2.txt

        project/src/data3.txt

        project/src/data1.txt'
    - cmd: tar -tvf project.tar | head -4
      out: 'drwxr-xr-x root/root         0 2026-10-03 17:36 project/

        drwxr-xr-x root/root         0 2026-10-03 17:36 project/docs/

        -rw-r--r-- root/root         8 2026-10-03 17:36 project/docs/notes.md

        -rwxr-x--- root/root        12 2026-10-03 17:36 project/run.sh'
    - cmd: tar -czf project.tar.gz project
      out: ''
    - cmd: ls -l project.tar project.tar.gz
      out: '-rw-r--r--. 1 root root 337920 Oct  3 17:36 project.tar

        -rw-r--r--. 1 root root 135323 Oct  3 17:36 project.tar.gz'
    - cmd: mkdir out; tar -xf project.tar.gz -C out; ls out/project
      out: docs  link.md  run.sh  src
    - cmd: tar -xzf project.tar.gz -C out project/run.sh; ls -l out/project/run.sh
      out: -rwxr-x---. 1 root root 12 Oct  3 17:36 out/project/run.sh
    - cmd: tar -cvf abs.tar /tmp/arch/project/docs
      out: 'tar: Removing leading `/'' from member names

        /tmp/arch/project/docs/

        /tmp/arch/project/docs/notes.md'
    - cmd: tar --exclude='*.txt' -czf notxt.tar.gz project; tar -tzf notxt.tar.gz
      out: 'project/

        project/docs/

        project/docs/notes.md

        project/run.sh

        project/link.md

        project/src/'
    - cmd: diff -r project out/project; echo "rc=$?"
      out: rc=0
    tasks:
    - text: Create a plain tar archive of the directory project, listing the files as it goes.
      commands:
      - tar -cvf project.tar project
    - text: List the archive with permissions and owners.
      commands:
      - tar -tvf project.tar | head -4
    - text: Make a gzip-compressed archive.
      commands:
      - tar -czf project.tar.gz project
    - text: Extract it into a new directory called out.
      commands:
      - mkdir out; tar -xf project.tar.gz -C out; ls out/project
    - text: Extract only one member.
      commands:
      - tar -xzf project.tar.gz -C out project/run.sh; ls -l out/project/run.sh
    - text: Compare the original and the restored directory.
      commands:
      - diff -r project out/project; echo "rc=$?"
quick:
  questions:
  - id: q-774fd21b28eb
    q: Which tar options create a gzip-compressed archive named a.tar.gz of the directory d?
    options:
    - tar -czf a.tar.gz d
    - tar -xzf a.tar.gz d
    - tar -tzf a.tar.gz d
    answer: 0
    explain: c creates, z compresses with gzip, f names the file.
  - id: q-c96f78f447df
    q: Which option lists the contents of an archive without extracting?
    options:
    - -t
    - -l
    - -x
    answer: 0
    explain: t = table of contents.
  - id: q-959d6895d652
    q: Why should f be the last letter in tar -czvf name?
    options:
    - It takes the next word as the archive name
    - It means fast
    - It is optional
    answer: 0
    explain: Writing -cfz name would make tar treat z as the file name.
  - id: q-7293bc73d4de
    q: tar prints "Removing leading / from member names". What does it protect against?
    options:
    - An archive that extracts to absolute paths and overwrites system files
    - A corrupt archive
    - A full disk
    answer: 0
    explain: Archive with relative names unless you explicitly choose otherwise.
  - id: q-7197301406f6
    q: Where does tar extract by default?
    options:
    - The current directory (use -C to choose another)
    - The original location
    - /tmp
    answer: 0
    explain: Relative names are created below the current directory.
  - id: q-6604db925cec
    q: How do you extract just one file from an archive?
    options:
    - tar -xzf a.tar.gz path/in/archive
    - tar -gzf
    - tar --one
    answer: 0
    explain: Give the member name exactly as tar -t shows it.
