tar-options:
  title: Reading a tar command
  caption: 'Select a part of: tar -czvf backup.tar.gz -C /srv data'
  height: 270
  mode: select
  initial: f
  info:
    tar:
      tone: gray
      title: tar
      text: 'Tape ARchiver: bundles many files and directories into one file (an archive, often called a tarball). Its options may be written with or without the leading dash.'
    c:
      tone: green
      title: 'c: create'
      text: Make a new archive. The three main actions are c (create), t (list the contents) and x (extract). Use exactly one.
    z:
      tone: blue
      title: 'z: gzip'
      text: Compress with gzip (.tar.gz). j is bzip2 (.tar.bz2), J is xz (.tar.xz). When extracting, modern tar detects the compression itself, so a plain -xf works.
    v:
      tone: gray
      title: 'v: verbose'
      text: Print each file name as it is processed. Leave it out for quiet operation.
    f:
      tone: amber
      title: 'f: file'
      text: The next word is the archive file name. Always put f last in the group of letters, directly before the name. Without it, tar tries to use a tape device.
    name:
      tone: amber
      title: backup.tar.gz
      text: The archive file. The suffix is only a hint to humans; the option (z, j or J) decides.
    cdir:
      tone: purple
      title: '-C /srv: change directory'
      text: tar changes to this directory first. The members are then stored with relative names (data/…), so extracting later works anywhere.
    data:
      tone: teal
      title: 'data: what to archive'
      text: One or more files or directories, relative to the -C directory.
