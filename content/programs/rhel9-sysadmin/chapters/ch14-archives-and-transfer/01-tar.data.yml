tar-workflow:
  title: Create, list, restore, compare
  caption: Step through the safe routine for any archive.
  height: 240
  mode: steps
  steps:
  - title: Create
    text: tar -czf data.tar.gz -C /srv data. Run it from where the relative names make sense.
  - title: List
    text: 'tar -tzf data.tar.gz (or -tvf for details). Look at the first names: are they relative (data/…) or absolute?'
  - title: Extract somewhere harmless
    text: tar -xzf data.tar.gz -C /tmp/restore. Extract into a new empty directory first, never over the original.
  - title: Compare
    text: diff -r /srv/data /tmp/restore/data prints nothing when identical. An archive you have not tested is not a backup.
  elements:
  - kind: node
    x: 10
    y: 20
    w: 150
    h: 56
    tone: green
    title: create
