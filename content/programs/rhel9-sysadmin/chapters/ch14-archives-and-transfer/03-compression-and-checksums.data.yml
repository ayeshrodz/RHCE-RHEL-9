checksum-flow:
  title: Prove that a copy is identical
  caption: Step through a checksum check.
  height: 240
  mode: steps
  steps:
  - title: Compute a checksum at the source
    text: sha256sum file > file.sha256 turns the entire content into a 64-character fingerprint. Change one bit of the file and the fingerprint is completely different.
  - title: Transfer the file and the fingerprint
    text: 'Copy both to the destination by any means: scp, rsync, a USB stick, a download.'
  - title: Check at the destination
    text: sha256sum -c file.sha256 recomputes the checksum and compares. OK means the content is identical. FAILED means it is not.
  - title: Trust the fingerprint
    text: The check is only as good as the fingerprint. For downloads, take the checksum from a different, trusted place than the file itself.
  elements:
  - kind: node
    x: 10
    y: 20
    w: 150
    h: 56
    tone: blue
    title: source file
    sub: checksum A
    titleSize: 13
    active:
