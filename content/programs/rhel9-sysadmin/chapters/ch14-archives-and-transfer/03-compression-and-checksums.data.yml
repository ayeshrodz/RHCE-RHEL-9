compression:
  title: Compression trade-offs
  caption: Select a tool. Sizes are for the 22.5 MB tar archive of /etc.
  height: 250
  mode: select
  initial: xz
  info:
    gzip:
      tone: green
      title: 'gzip: 4.9 MB, fast'
      text: 'Suffix .gz, tar option z. The common default: quick to compress and to expand, understood everywhere. Good for daily backups and logs.'
    bzip2:
      tone: blue
      title: 'bzip2: 4.1 MB, slower'
      text: Suffix .bz2, tar option j. Smaller than gzip, noticeably slower. It is a separate package (bzip2) that may need installing.
    xz:
      tone: purple
      title: 'xz: 3.0 MB, slowest to compress'
      text: Suffix .xz, tar option J. The smallest result, but it took about 8 seconds here against about 1 for gzip. Best for archives that are made once and downloaded often.
    zip:
      tone: amber
      title: 'zip: for sharing'
      text: Suffix .zip. Compresses each file separately and is understood on every operating system, but does not keep Linux permissions and owners well. Use it when the receiver is not Linux.
  elements:
