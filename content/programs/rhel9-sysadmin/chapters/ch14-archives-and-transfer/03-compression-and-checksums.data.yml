practice:
  text:
    hint: Click here and type the commands. This terminal remembers nothing between commands, so it shows each command's result as it was on servera.
    inputLabel: Command to run in the practice terminal
    eventNotFound: 'bash: {value0}: event not found'
    notHere: This practice terminal only knows the examples in this lesson. Try anything else on servera.
    notFound: 'bash: {value0}: command not found'
    searchPrompt: '(reverse-i-search)`{value0}'':'
    noMatch: no match yet
    tasksTitle: Your tasks
    allDone: All done. Now try the same on servera.
    doneLabel: done
    reset: Start again
  data: {}
  props:
    title: 'Practice terminal: compression and checksums'
    prompt: '[root@servera arch]#'
    commands:
    - cmd: ls -l etc.tar*
      out: '-rw-r--r--. 1 root root 22538240 Oct  3 17:37 etc.tar

        -rw-r--r--. 1 root root  4056807 Oct  3 17:37 etc.tar.bz2

        -rw-r--r--. 1 root root  4904479 Oct  3 17:37 etc.tar.gz

        -rw-r--r--. 1 root root  2993256 Oct  3 17:37 etc.tar.xz'
    - cmd: gzip -l t.tar.gz
      out: "         compressed        uncompressed  ratio uncompressed_name\n            4904485            22538240  78.2% t.tar"
    - cmd: zip -r proj.zip project | tail -2
      out: "  adding: project/src/data3.txt (deflated 59%)\n  adding: project/src/data1.txt (deflated 59%)"
    - cmd: unzip -l proj.zip | tail -3
      out: "---------                     -------\n   326710                     9 files"
    - cmd: sha256sum project/src/*.txt > SHA256SUMS
      out: ''
    - cmd: sha256sum -c SHA256SUMS
      out: 'project/src/data1.txt: OK

        project/src/data2.txt: OK

        project/src/data3.txt: OK'
    - cmd: echo tamper >> project/src/data2.txt
      out: ''
    - cmd: sha256sum -c SHA256SUMS
      out: 'project/src/data1.txt: OK

        project/src/data2.txt: FAILED

        project/src/data3.txt: OK

        sha256sum: WARNING: 1 computed checksum did NOT match'
    - cmd: diff -r project out/project
      out: 'diff -r project/src/data2.txt out/project/src/data2.txt

        20001d20000

        < tamper'
    tasks:
    - text: Compare the size of the same data in four formats.
      commands:
      - ls -l etc.tar*
    - text: Zip a directory and list the archive.
      commands:
      - zip -r proj.zip project | tail -2
      - unzip -l proj.zip | tail -3
    - text: Record the checksums of three files.
      commands:
      - sha256sum project/src/*.txt > SHA256SUMS
    - text: Verify them.
      commands:
      - sha256sum -c SHA256SUMS
    - text: Change a file, then verify again.
      commands:
      - echo tamper >> project/src/data2.txt
      - sha256sum -c SHA256SUMS
quick:
  questions:
  - id: q-19c4b8105696
    q: Which tool gives the smallest result but takes the longest to compress?
    options:
    - xz
    - gzip
    - zip
    answer: 0
    explain: Roughly, xz gives the smallest files, then bzip2, then gzip, and the order of speed is the reverse.
  - id: q-b7be6081fe7c
    q: A file ends in .tar.gz. How do you view its contents?
    options:
    - tar -tzf file.tar.gz
    - gunzip file.tar.gz only
    - zip -l
    answer: 0
    explain: Or plain tar -tf; modern tar detects gzip itself.
  - id: q-8bdcb68c89a0
    q: sha256sum -c lists.sha256 prints "FAILED" for one file. What does it mean?
    options:
    - The file content differs from when the checksum was made
    - The file is encrypted
    - The checksum file is empty
    answer: 0
    explain: The file was modified, corrupted or damaged in transfer.
  - id: q-49e19a3d6881
    q: Why take a download's checksum from a different place than the download?
    options:
    - An attacker who replaces the file could replace its checksum too
    - It is faster
    - It saves disk
    answer: 0
    explain: A checksum only proves identity with something you trust.
  - id: q-de42d27a4d62
    q: Which command leaves the original and creates file.xz next to it?
    options:
    - xz -k file
    - xz file
    - gzip -d file
    answer: 0
    explain: -k keeps the input; by default the original is removed.
  - id: q-d979ab8faef7
    q: Which statement about zip is true?
    options:
    - It is understood by Windows and macOS, but does not preserve Linux owners and ACLs well
    - It is the best backup format for Linux
    - It cannot compress
    answer: 0
    explain: Use tar for Linux-to-Linux backups; zip for sharing.
