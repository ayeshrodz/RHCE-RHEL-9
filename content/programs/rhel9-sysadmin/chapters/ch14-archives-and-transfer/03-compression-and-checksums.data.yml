    w: 150
    h: 56
    tone: amber
    title: copy
    sub: transfer
    titleSize: 13
    active:
    - 1
    visible:
    - 1
    - 2
    - 3
  - kind: node
    x: 370
    y: 20
    w: 150
    h: 56
    tone: teal
    title: checksum B
    sub: sha256sum -c
    mono: true
