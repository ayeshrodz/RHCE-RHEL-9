recall:
  cards:
  - front: A runtime-only allowance vanishes on reload. Why?
    back: Reload replaces runtime with saved permanent policy. Runtime and permanent configuration stores
      are distinct.
  - front: A local web request succeeds. Does that prove remote callers cross the firewall?
    back: No; test from the intended remote client and zone. Loopback and remote traffic can encounter
      different policy.
  - front: A source-restricted rich rule exists, but every client still reaches HTTP. What should you
      inspect?
    back: Other broad allowances and active-zone selection. The total applicable policy can grant access
      beyond the narrow rule.
