source-zone:
  title: Allow a service for one host only
  caption: Step through limiting a web server to serverb.
  height: 270
  mode: steps
  steps:
  - title: The goal
    text: Port 80 should answer only serverb (172.25.250.11). Opening http in public would let everyone in.
  - title: A zone for the trusted caller
    text: 'Create a zone with a name of your own: firewall-cmd --permanent --new-zone=lanonly. It starts empty.'
  - title: Assign the source and the service
    text: Add the address as a source of the zone and allow http there. Then --reload. Traffic from that address now uses the new zone.
  - title: Everyone else stays in public
    text: Other clients still match public and still get a rejection. The test from serverb works; the same test from another host does not.
  elements:
  - kind: node
    x: 10
    y: 30
    w: 160
    h: 60
    tone: blue
    title: serverb
    sub: 172.25.250.11
    mono: true
    titleSize: 14
    active:
    - 0
    - 2
    visible:
    - 0
    - 1
    - 2
    - 3
  - kind: node
    x: 10
    y: 140
    w: 160
    h: 60
    tone: gray
    title: other host
    sub: 172.25.250.12
    mono: true
    titleSize: 14
    active:
    - 3
    visible:
    - 3
  - kind: node
    x: 280
    y: 30
    w: 170
    h: 60
    tone: green
    title: zone lanonly
    sub: source + http
    mono: true
    titleSize: 13
    active:
    - 1
    - 2
    visible:
    - 1
    - 2
    - 3
  - kind: node
    x: 280
    y: 140
    w: 170
    h: 60
    tone: amber
    title: zone public
    sub: ssh only
    mono: true
    titleSize: 13
