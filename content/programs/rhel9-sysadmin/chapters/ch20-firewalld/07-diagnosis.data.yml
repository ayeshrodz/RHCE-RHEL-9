layers:
  title: Four layers, in order
  caption: Step through what to check when a client cannot connect.
  height: 270
  mode: steps
  steps:
  - title: The client sees a symptom
    text: No route to host, a timeout, or Connection refused. Each points to a different layer. Start from the symptom.
  - title: 1. Is the service running?
    text: 'On the server: systemctl status httpd. If it is not active, nothing can answer, whatever the firewall says.'
  - title: 2. Is it listening where you expect?
    text: ss -tlnp shows ports and programs. A service listening only on 127.0.0.1 is invisible from outside.
  - title: 3. Does the firewall allow it?
    text: firewall-cmd --list-all for the zone that judges the client. Compare with --get-active-zones and --get-zone-of-source.
  - title: 4. Does SELinux allow the port?
    text: A daemon on an unusual port needs the port label (chapter 16). The firewall can be fine and the service still fail to start.
