symptoms:
  title: What the client sees
  caption: Select a symptom.
  height: 270
  mode: select
  initial: route
  info:
    route:
      tone: coral
      title: No route to host
      text: The firewall rejected the connection, or the host is unreachable. If ping works, suspect a missing firewall rule (the zone's default reply is a rejection).
    timeout:
      tone: amber
      title: Connection timed out
      text: 'Packets vanish with no answer: a drop zone or drop rule, a lost route, or a firewall in between. It takes as long as the client''s timeout.'
    refused:
      tone: purple
      title: Connection refused
      text: The packet reached the machine and nothing listens on that port (service stopped, wrong port, wrong address), or a rule rejected it explicitly.
    ok:
      tone: green
      title: It connects
      text: The firewall and the service both work. If the content is wrong, look at the application.
  elements:
  - kind: node
    x: 6
    y: 34
    w: 160
    h: 56
    tone: coral
    title: No route to host
    sub: rejected
    titleSize: 13
    select: route
    active:
    - route
  - kind: node
