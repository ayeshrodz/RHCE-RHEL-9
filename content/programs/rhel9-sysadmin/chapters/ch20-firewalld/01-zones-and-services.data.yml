list-all:
  title: Reading firewall-cmd --list-all
  caption: Select a line of the output.
  height: 330
  mode: select
  initial: target
  info:
    zone:
      tone: blue
      title: public (active)
      text: The zone and whether it is in use. Active means at least one interface or source is assigned to it.
    target:
      tone: coral
      title: 'target: default'
      text: What happens to traffic that no rule allows. default means reject (with a "No route to host" reply). Zones such as drop silently discard, trusted accepts everything.
    ifaces:
      tone: purple
      title: 'interfaces: enp1s0'
      text: The network interfaces whose traffic this zone judges. One interface belongs to at most one zone.
    sources:
      tone: amber
      title: 'sources:'
      text: Sender addresses or networks that always use this zone, whatever interface they arrive on. Empty here.
    services:
      tone: green
      title: 'services: cockpit dhcpv6-client ssh'
      text: 'Named bundles of ports and protocols that are allowed in. A service is a definition, not a daemon: allowing http does not start a web server.'
    ports:
      tone: green
      title: 'ports:'
      text: Individual ports allowed in addition to the services, written 8080/tcp.
    rich:
      tone: gray
      title: forward-ports · rich rules · masquerade
      text: Port forwarding, rich rules and address translation. Empty unless you add them (the next lessons).
  elements:
  - kind: node
    x: 10
    y: 28
    w: 180
    h: 44
    tone: blue
    title: public (active)
    sub: ''
    mono: true
    titleSize: 13
    select: zone
    active:
    - zone
  - kind: node
    x: 10
    y: 80
    w: 180
    h: 44
    tone: coral
    title: 'target: default'
    sub: ''
    mono: true
    titleSize: 13
    select: target
    active:
    - target
  - kind: node
