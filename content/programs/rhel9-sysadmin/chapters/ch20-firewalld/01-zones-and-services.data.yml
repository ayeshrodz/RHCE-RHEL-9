practice:
  text:
    hint: Click here and type the commands. This terminal remembers nothing between commands, so it shows each command's result as it was on servera.
    inputLabel: Command to run in the practice terminal
    eventNotFound: 'bash: {value0}: event not found'
    notHere: This practice terminal only knows the examples in this lesson. Try anything else on servera.
    notFound: 'bash: {value0}: command not found'
    searchPrompt: '(reverse-i-search)`{value0}'':'
    noMatch: no match yet
    tasksTitle: Your tasks
    allDone: All done. Now try the same on servera.
    doneLabel: done
    reset: Start again
  data: {}
  props:
    title: 'Practice terminal: look at the firewall'
    prompt: '[root@servera ~]#'
    commands:
    - cmd: systemctl is-active firewalld
      out: active
    - cmd: firewall-cmd --state
      out: running
    - cmd: firewall-cmd --get-default-zone
      out: public
    - cmd: firewall-cmd --get-active-zones
      out: "public\n  interfaces: enp1s0"
    - cmd: firewall-cmd --list-all
      out: "public (active)\n  target: default\n  icmp-block-inversion: no\n  interfaces: enp1s0\n  sources: \n  services: cockpit dhcpv6-client ssh\n  ports: \n  protocols: \n  forward: yes\n  masquerade: no\n  forward-ports: \n  source-ports: \n  icmp-blocks: \n  rich rules: "
    - cmd: firewall-cmd --get-zones
      out: block dmz drop external home internal nm-shared public trusted work
    - cmd: firewall-cmd --get-services | wc -w
      out: '225'
    - cmd: firewall-cmd --info-service=http
      out: "http\n  ports: 80/tcp\n  protocols: \n  source-ports: \n  modules: \n  destination: \n  includes: \n  helpers: "
    - cmd: firewall-cmd --permanent --add-service=http
      out: success
    - cmd: firewall-cmd --reload
      out: success
    - cmd: firewall-cmd --list-services
      out: cockpit dhcpv6-client http ssh
    - cmd: firewall-cmd --query-service=http
      out: 'yes'
    tasks:
    - text: Check that firewalld is running and which zone is the default.
      commands:
      - firewall-cmd --state
      - firewall-cmd --get-default-zone
    - text: Show the active zones and everything the active zone allows.
      commands:
      - firewall-cmd --get-active-zones
      - firewall-cmd --list-all
    - text: Read what the service http stands for.
      commands:
      - firewall-cmd --info-service=http
    - text: Allow http permanently, load it, and ask whether it is allowed.
      commands:
      - firewall-cmd --permanent --add-service=http
      - firewall-cmd --reload
      - firewall-cmd --query-service=http
quick:
  questions:
  - id: q-72afc577fd88
    q: A packet comes from an address listed as the source of the zone work, on an interface in the zone public. Which zone judges it?
    options:
    - 'work: a matching source wins over the interface'
    - public, because the interface decides
    - The default zone
    answer: 0
    explain: 'Order: source, then interface, then the default zone.'
  - id: q-e57d731edcbc
    q: What is a firewalld service?
    options:
    - A named set of ports and protocols to allow
    - A systemd unit that serves the port
    - A user account
    answer: 0
    explain: Allowing http does not start httpd, and starting httpd does not open the port.
  - id: q-03e588e48430
    q: Which command shows everything the active zone allows?
    options:
    - firewall-cmd --list-all
    - firewall-cmd --state
    - systemctl status firewalld
    answer: 0
    explain: --state only says whether the daemon is running.
  - id: q-b17bab610220
    q: A client gets "No route to host" from a web server whose httpd is running. Most likely cause?
    options:
    - The firewall rejects the port
    - DNS is broken
    - The disk is full
    answer: 0
    explain: The default reply of a zone is a rejection, which looks like that message.
  - id: q-20407846a4e2
    q: What does the target "default" mean for traffic nothing allows?
    options:
    - It is rejected
    - It is accepted
    - It is logged only
    answer: 0
    explain: drop discards silently, trusted accepts.
  - id: q-76e78d9dbbd1
    q: Which command lists the zone names that exist?
    options:
    - firewall-cmd --get-zones
    - firewall-cmd --get-active-zones
    - firewall-cmd --zones
    answer: 0
    explain: --get-active-zones lists only those in use.
