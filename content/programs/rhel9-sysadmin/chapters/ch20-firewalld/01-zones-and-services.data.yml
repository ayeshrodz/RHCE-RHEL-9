zone-choice:
  title: Which zone decides?
  caption: Step through a packet arriving at servera.
  height: 270
  mode: steps
  steps:
  - title: A packet arrives
    text: serverb (172.25.250.11) sends a request to port 80 of servera. firewalld must choose one zone to judge it.
  - title: 1. Does a source match?
    text: If the sender's address is listed as a source of some zone, that zone wins. No zone has this address as a source here.
  - title: 2. Which interface?
    text: Otherwise the zone of the interface the packet came in on is used. enp1s0 belongs to the zone public.
  - title: 3. Or the default zone
    text: An interface with no zone, and traffic that matches nothing else, falls back to the default zone (also public on a fresh system).
  - title: The zone's rules decide
    text: 'public allows the services ssh, cockpit and dhcpv6-client. Port 80 is not among them, so the packet is rejected: the client sees "No route to host".'
