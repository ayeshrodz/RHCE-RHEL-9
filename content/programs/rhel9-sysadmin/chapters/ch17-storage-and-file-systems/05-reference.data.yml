recall:
  cards:
  - front: Which observation authorizes a practice mkfs target?
    back: A confirmed blank disposable secondary device with no mount or LVM use. Disk identity and usage
      must be established, not inferred from a copied name.
  - front: Can you shrink an XFS file system using resize2fs?
    back: No; XFS does not support shrinking and resize2fs targets other formats. Filesystem capabilities
      and tools are format-specific.
  - front: Why verify the actual mount before writing data?
    back: An absent mount can cause writes into the underlying root directory. Saved mount intent does
      not establish current mounted state.
