tools:
  title: Maintenance tools by file system
  caption: Select a file system.
  height: 250
  mode: select
  initial: x
  info:
    x:
      tone: green
      title: XFS
      text: 'Check or repair with xfs_repair (unmounted; -n only reports). xfs_info shows the geometry. Label: xfs_admin -L NAME (unmounted). Grow with xfs_growfs (mounted).'
    e:
      tone: blue
      title: ext4
      text: 'Check or repair with e2fsck -f (unmounted). tune2fs -l shows settings, including the inode count. Label: e2label DEVICE NAME. Grow with resize2fs.'
    s:
      tone: amber
      title: swap
      text: swapon --show lists active areas; swapoff DEV turns one off; free -h shows totals; mkswap -L sets a label.
    g:
      tone: gray
      title: Any
      text: lsblk -f, blkid, findmnt, df -hT and df -i work on every type. fuser -vm DIR or lsof DIR show what keeps a mount busy.
  elements:
  - kind: node
    x: 10
    y: 30
    w: 150
    h: 64
    tone: green
    title: XFS
    sub: xfs_repair · xfs_info
