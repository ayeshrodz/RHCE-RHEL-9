practice:
  text:
    hint: Click here and type the commands. This terminal remembers nothing between commands, so it shows each command's result as it was on servera.
    inputLabel: Command to run in the practice terminal
    eventNotFound: 'bash: {value0}: event not found'
    notHere: This practice terminal only knows the examples in this lesson. Try anything else on servera.
    notFound: 'bash: {value0}: command not found'
    searchPrompt: '(reverse-i-search)`{value0}'':'
    noMatch: no match yet
    tasksTitle: Your tasks
    allDone: All done. Now try the same on servera.
    doneLabel: done
    reset: Start again
  data: {}
  props:
    title: 'Practice terminal: finding the missing space'
    prompt: '[root@servera ~]#'
    commands:
    - cmd: df -h /srv/data
      out: 'Filesystem      Size  Used Avail Use% Mounted on

        /dev/sdb1       960M  939M   22M  98% /srv/data'
    - cmd: du -xh --max-depth=1 /srv/data | sort -rh | head -3
      out: "900M\t/srv/data\n800M\t/srv/data/big.log\n50M\t/srv/data/part1.tmp"
    - cmd: df -i /srv/archive
      out: 'Filesystem     Inodes IUsed  IFree IUse% Mounted on

        /dev/sdb2       65536 65536      0  100% /srv/archive'
    - cmd: touch /srv/archive/many/newfile
      out: 'touch: cannot touch ''/srv/archive/many/newfile'': No space left on device'
    - cmd: cd /srv/data; umount /srv/data
      out: 'umount: /srv/data: target is busy.'
    - cmd: fuser -vm /srv/data
      out: "                     USER        PID ACCESS COMMAND\n/srv/data:           root     kernel mount /srv/data\n                     root        713 ..c.. bash"
    - cmd: lsof +L1 | grep srv/data
      out: tail      1072 root    3r   REG   8,17 209715200     0  132 /srv/data/log.big (deleted)
    - cmd: umount /srv/data; xfs_repair -n /dev/sdb1 | tail -2
      out: 'Phase 7 - verify link counts...

        No modify flag set, skipping filesystem flush and exiting.'
    tasks:
    - text: Check how full the file system is.
      commands:
      - df -h /srv/data
    - text: Find the biggest directories on that file system.
      commands:
      - du -xh --max-depth=1 /srv/data | sort -rh | head -3
    - text: Check the inodes of the other file system.
      commands:
      - df -i /srv/archive
    - text: See what keeps a mount busy.
      commands:
      - fuser -vm /srv/data
    - text: List deleted files that are still open.
      commands:
      - lsof +L1 | grep srv/data
quick:
  questions:
  - id: q-49f14f6db822
    q: df -h shows 30% used but writes fail with "No space left on device". What do you check?
    options:
    - 'df -i: the inodes may be exhausted'
    - The cable
    - fstab
    answer: 0
    explain: Millions of small files use inodes.
  - id: q-ea4119f17d7b
    q: df says the file system is full but du cannot find the data. Likely cause?
    options:
    - A deleted file still held open by a process
    - A bad disk
    - SELinux
    answer: 0
    explain: lsof +L1 finds it; restart the process.
  - id: q-3bb26fad12f5
    q: umount fails with "target is busy". What helps?
    options:
    - fuser -vm /mountpoint or lsof to find the user, then stop it or leave the directory
    - umount -f always
    - Reboot
    answer: 0
    explain: Your own shell sitting in the directory is the most common cause.
  - id: q-0acc3f48efed
    q: Which command checks an unmounted XFS file system without changing it?
    options:
    - xfs_repair -n /dev/sdb1
    - e2fsck /dev/sdb1
    - mkfs.xfs
    answer: 0
    explain: Never run a repair tool on a mounted file system.
  - id: q-7ae877eba794
    q: Which option of du stays within one file system?
    options:
    - -x
    - -s
    - -a
    answer: 0
    explain: Handy on / to ignore /proc and other mounts.
  - id: q-798337be08ee
    q: How do you change the label of an ext4 file system?
    options:
    - e2label DEVICE NAME
    - xfs_admin -L
    - mkswap
    answer: 0
    explain: xfs_admin -L for XFS (unmounted).
