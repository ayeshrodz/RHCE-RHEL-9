no-space:
  title: '"No space left on device"'
  caption: Step through finding where the space went.
  height: 260
  mode: steps
  steps:
  - title: '1 · Blocks: df -h'
    text: df -h FILESYSTEM shows used and available space. 100% here is the obvious cause.
  - title: '2 · Inodes: df -i'
    text: Each file needs an inode, and ext4 has a fixed number of them. Millions of tiny files can use all inodes while df -h still shows free space.
  - title: '3 · Who uses it: du'
    text: du -xh --max-depth=1 DIR | sort -rh | head shows the biggest directories. -x stays on one file system. Descend into the largest.
  - title: 4 · Deleted but open
    text: 'If df says full but du finds little, a deleted file may still be held open by a running program: lsof +L1 lists them. Restarting the program releases the space.'
  - title: 5 · Fix and prevent
    text: 'Remove or move data, rotate logs (chapter 11), or grow the file system. Then monitor: df is the first check in most routines.'
