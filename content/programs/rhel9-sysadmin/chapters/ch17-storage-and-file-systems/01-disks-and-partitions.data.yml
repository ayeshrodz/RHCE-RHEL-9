layout:
  title: One disk, three partitions
  caption: Select a part of /dev/sdb.
  height: 260
  mode: select
  initial: table
  info:
    disk:
      tone: gray
      title: '/dev/sdb: the disk'
      text: 'The whole block device: 5 GiB here. sd… names are SCSI/SATA/virtual disks (sda, sdb…), vd… are virtio disks, nvme0n1 is NVMe. Files are never written to the disk itself, but to what lives on it.'
    table:
      tone: purple
      title: The partition table (GPT)
      text: A small map at the start (and a backup at the end) of the disk that says where each partition starts and ends. GPT is the modern format (up to 128 partitions, disks over 2 TiB); the older MBR allows 4 primary partitions and 2 TiB.
    p1:
      tone: blue
      title: /dev/sdb1
      text: 'The first partition: a numbered slice of the disk. It is another block device, and it holds a file system. Here 1 GiB for data.'
    p2:
      tone: green
      title: /dev/sdb2
      text: 'The second partition: 1 GiB for another file system.'
    p3:
      tone: amber
      title: /dev/sdb3
      text: 'The third partition: 512 MiB reserved for swap space (memory overflow), which has no file system and is never mounted.'
    free:
      tone: gray
      title: Free space
      text: 'Unpartitioned space remains for later: more partitions, or whole-disk use by LVM (next chapter).'
  elements:
