new-disk:
  title: A new disk, step by step
  caption: Every disk follows the same four steps.
  height: 250
  mode: steps
  steps:
  - title: 1 · Partition
    text: 'Write a partition table and create partitions: parted (or fdisk, gdisk). The kernel creates /dev/sdb1, /dev/sdb2… Check with lsblk.'
  - title: 2 · Create a file system
    text: mkfs.xfs /dev/sdb1 (or mkfs.ext4) puts the structures on the partition that hold directories and files. mkswap prepares swap space. Check with blkid or lsblk -f.
  - title: 3 · Mount it
    text: mount /dev/sdb1 /data attaches the file system to a directory. The directory must exist. Check with findmnt, df -h.
  - title: 4 · Make it permanent
    text: Add a line to /etc/fstab (by UUID), test it with findmnt --verify and mount -a. Without this step the mount disappears at reboot.
