practice:
  text:
    hint: Click here and type the commands. This terminal remembers nothing between commands, so it shows each command's result as it was on servera.
    inputLabel: Command to run in the practice terminal
    eventNotFound: 'bash: {value0}: event not found'
    notHere: This practice terminal only knows the examples in this lesson. Try anything else on servera.
    notFound: 'bash: {value0}: command not found'
    searchPrompt: '(reverse-i-search)`{value0}'':'
    noMatch: no match yet
    tasksTitle: Your tasks
    allDone: All done. Now try the same on servera.
    doneLabel: done
    reset: Start again
  data: {}
  props:
    title: 'Practice terminal: disks and partitions'
    prompt: '[root@servera ~]#'
    commands:
    - cmd: lsblk
      out: "NAME   MAJ:MIN RM  SIZE RO TYPE MOUNTPOINTS\nsda      8:0    0   20G  0 disk \n├─sda1   8:1    0  100M  0 part /boot/efi\n└─sda2   8:2    0 19.9G  0 part /\nsdb      8:16   0    5G  0 disk "
    - cmd: lsblk -f
      out: "NAME   FSTYPE FSVER LABEL  UUID                                 FSAVAIL FSUSE% MOUNTPOINTS\nsda                                                                            \n├─sda1 vfat   FAT32 UEFI   76E8-0192                              90.8M     8% /boot/efi\n└─sda2 ext4   1.0   rootfs 4bbdcf8d-863d-4050-957c-c815ca3838b8   17.5G     9% /\nsdb                                                                            "
    - cmd: parted -s /dev/sdb print
      out: 'Error: /dev/sdb: unrecognised disk label

        Model: QEMU QEMU HARDDISK (scsi)

        Disk /dev/sdb: 5369MB

        Sector size (logical/physical): 512B/512B

        Partition Table: unknown

        Disk Flags: '
    - cmd: parted -s /dev/sdb mklabel gpt
      out: ''
    - cmd: parted -s /dev/sdb mkpart data xfs 1MiB 1025MiB
      out: ''
    - cmd: parted -s /dev/sdb mkpart logs ext4 1025MiB 2049MiB
      out: ''
    - cmd: parted -s /dev/sdb mkpart swap linux-swap 2049MiB 2561MiB
      out: ''
    - cmd: parted -s /dev/sdb print
      out: "Model: QEMU QEMU HARDDISK (scsi)\nDisk /dev/sdb: 5369MB\nSector size (logical/physical): 512B/512B\nPartition Table: gpt\nDisk Flags: \n\nNumber  Start   End     Size    File system  Name  Flags\n 1      1049kB  1075MB  1074MB               data\n 2      1075MB  2149MB  1074MB               logs\n 3      2149MB  2685MB  537MB                swap  swap"
    - cmd: udevadm settle; lsblk /dev/sdb
      out: "NAME   MAJ:MIN RM  SIZE RO TYPE MOUNTPOINTS\nsdb      8:16   0    5G  0 disk \n├─sdb1   8:17   0    1G  0 part \n├─sdb2   8:18   0    1G  0 part \n└─sdb3   8:19   0  512M  0 part "
    tasks:
    - text: List the block devices.
      commands:
      - lsblk
    - text: Show the current partition table of /dev/sdb.
      commands:
      - parted -s /dev/sdb print
    - text: Create a GPT label.
      commands:
      - parted -s /dev/sdb mklabel gpt
    - text: 'Create the three partitions: data 1 GiB, logs 1 GiB, swap 512 MiB.'
      commands:
      - parted -s /dev/sdb mkpart data xfs 1MiB 1025MiB
      - parted -s /dev/sdb mkpart logs ext4 1025MiB 2049MiB
      - parted -s /dev/sdb mkpart swap linux-swap 2049MiB 2561MiB
    - text: Check the result.
      commands:
      - udevadm settle; lsblk /dev/sdb
quick:
  questions:
  - id: q-19d4ef7d61ed
    q: What is /dev/sdb2?
    options:
    - The second partition of the disk /dev/sdb
    - The second disk
    - A mount point
    answer: 0
    explain: Partitions are numbered slices; disks have letters.
  - id: q-d96347e52c5e
    q: Which partition table type supports disks larger than 2 TiB?
    options:
    - GPT
    - MBR
    - Both
    answer: 0
    explain: MBR is limited to 2 TiB and four primary partitions.
  - id: q-34e4709bfd8b
    q: After creating a partition, what is still missing before you can store files?
    options:
    - A file system, then a mount
    - A reboot
    - Nothing
    answer: 0
    explain: Partition, mkfs, mount, fstab.
  - id: q-c833195c41d6
    q: Which command shows disks, partitions and their file systems and mount points as a tree?
    options:
    - lsblk -f
    - ls /dev
    - df -h
    answer: 0
    explain: df lists only mounted file systems.
  - id: q-d913c32a5e18
    q: Why start the first partition at 1MiB?
    options:
    - Alignment with the disk's blocks, for performance
    - Because parted requires it
    - To leave room for the boot loader on every disk
    answer: 0
    explain: Misaligned partitions can be slow on modern disks.
  - id: q-035bff26fab1
    q: Which command writes a partition table without prompts, for scripts?
    options:
    - parted -s /dev/sdb mklabel gpt
    - fdisk
    - mkfs
    answer: 0
    explain: fdisk and gdisk are interactive; parted -s takes everything on the command line.
