practice:
  text:
    hint: Click here and type the commands. This terminal remembers nothing between commands, so it shows each command's result as it was on servera.
    inputLabel: Command to run in the practice terminal
    eventNotFound: 'bash: {value0}: event not found'
    notHere: This practice terminal only knows the examples in this lesson. Try anything else on servera.
    notFound: 'bash: {value0}: command not found'
    searchPrompt: '(reverse-i-search)`{value0}'':'
    noMatch: no match yet
    tasksTitle: Your tasks
    allDone: All done. Now try the same on servera.
    doneLabel: done
    reset: Start again
  data: {}
  props:
    title: 'Practice terminal: fstab and swap'
    prompt: '[root@servera ~]#'
    commands:
    - cmd: blkid -s UUID -o value /dev/sdb1
      out: c64946eb-fc27-4485-8020-db4119b686eb
    - cmd: cp /etc/fstab /root/fstab.bak
      out: ''
    - cmd: tail -4 /etc/fstab
      out: 'LABEL=UEFI    /boot/efi vfat  defaults  0 0

        UUID=c64946eb-fc27-4485-8020-db4119b686eb  /srv/data     xfs   defaults          0 0

        UUID=cd0b3883-1d6d-4271-a89e-2f48a2dac5b7  /srv/archive  ext4  defaults,noexec   0 0

        UUID=89858a47-2255-4fa3-a2a9-64711ac2d782  none          swap  defaults          0 0'
    - cmd: systemctl daemon-reload; findmnt --verify | tail -3
      out: "0 parse errors, 0 errors, 1 warning\n/\n   [W] recommended root FS passno is 1 (current is 0)"
    - cmd: mount -a; echo "rc=$?"
      out: rc=0
    - cmd: swapon -a; swapon --show
      out: 'NAME      TYPE      SIZE USED PRIO

        /dev/sdb3 partition 512M   0B   -2'
    - cmd: df -h /srv/data /srv/archive
      out: 'Filesystem      Size  Used Avail Use% Mounted on

        /dev/sdb1       960M   39M  922M   5% /srv/data

        /dev/sdb2       974M   24K  907M   1% /srv/archive'
    - cmd: free -h | tail -1
      out: 'Swap:          511Mi          0B       511Mi'
    tasks:
    - text: Read the UUID of sdb1.
      commands:
      - blkid -s UUID -o value /dev/sdb1
    - text: Back up fstab.
      commands:
      - cp /etc/fstab /root/fstab.bak
    - text: Reload systemd and verify fstab.
      commands:
      - systemctl daemon-reload; findmnt --verify | tail -3
    - text: Mount everything from fstab and check the status.
      commands:
      - mount -a; echo "rc=$?"
    - text: Activate the swap entries and check the memory view.
      commands:
      - swapon -a; swapon --show
      - free -h | tail -1
quick:
  questions:
  - id: q-6bc77af84b9d
    q: Why use UUID= instead of /dev/sdb1 in /etc/fstab?
    options:
    - Device names can change; the UUID of a file system does not
    - It is shorter
    - fstab does not accept device names
    answer: 0
    explain: LABEL= is also stable.
  - id: q-224eff50efcc
    q: Which command tests all fstab entries without rebooting?
    options:
    - mount -a
    - mount --test
    - fstab -t
    answer: 0
    explain: No output means success. Run findmnt --verify too.
  - id: q-942c965d62d0
    q: A typo in fstab can cause ...
    options:
    - A failed or emergency-mode boot
    - Nothing
    - A faster boot
    answer: 0
    explain: Always back up, verify, and test with mount -a.
  - id: q-8fa12d188773
    q: Which fstab option makes a missing disk not stop the boot?
    options:
    - nofail
    - noauto
    - defaults
    answer: 0
    explain: nofail is for non-essential file systems.
  - id: q-b01594df791a
    q: What is the mount point field for a swap entry?
    options:
    - none
    - /swap
    - swap
    answer: 0
    explain: The type is swap, the mount point none.
  - id: q-468029844fbe
    q: Which option prevents programs on the file system from being executed?
    options:
    - noexec
    - nodev
    - ro
    answer: 0
    explain: Useful for upload or archive areas.
