persist:
  title: Make a mount permanent, safely
  caption: Step through the routine that avoids a failed boot.
  height: 250
  mode: steps
  steps:
  - title: Read the UUID
    text: blkid /dev/sdb1 prints it. Copy it carefully (or use blkid -s UUID -o value).
  - title: Back up and edit
    text: cp /etc/fstab /root/fstab.bak, then add the line. A mistake here can stop the machine booting, so keep the copy.
  - title: Tell systemd, then check
    text: systemctl daemon-reload (it generates mount units from fstab), then findmnt --verify to check the syntax and the devices.
  - title: Test the mount
    text: mount -a mounts everything in fstab that is not yet mounted. If it prints nothing, the lines work. Use df -h and findmnt to see them.
  - title: Prove it with a reboot
    text: On a lab server, reboot and check again. A mount that survives a reboot is a mount that is configured.
  elements:
  - kind: node
    x: 8
    y: 20
    w: 128
    h: 56
