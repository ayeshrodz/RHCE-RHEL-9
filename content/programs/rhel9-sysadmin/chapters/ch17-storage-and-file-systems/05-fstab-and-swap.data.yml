fstab-line:
  title: A line of /etc/fstab
  caption: Select a field.
  height: 250
  mode: select
  initial: dev
  info:
    dev:
      tone: purple
      title: 'Device: UUID=…'
      text: What to mount. A UUID identifies the file system and never changes, while /dev/sdb1 can become /dev/sdc1 if disks are added or the order changes. LABEL=… also works. Read the UUID with blkid.
    mp:
      tone: blue
      title: 'Mount point: /srv/data'
      text: The directory to attach it to. It must exist. For swap it is the word none.
    type:
      tone: green
      title: 'Type: xfs'
      text: The file system type (xfs, ext4, swap, nfs, …).
    opts:
      tone: amber
      title: 'Options: defaults,noexec'
      text: 'defaults means rw, suid, dev, exec, auto, nouser, async. Add others separated by commas: noexec (no programs run from it), nodev, nosuid, ro, nofail (do not fail the boot if missing).'
    dump:
      tone: gray
      title: 'dump: 0'
      text: Historic backup flag. Always 0 today.
    pass:
      tone: gray
      title: 'fsck order: 0'
      text: Order of boot-time checks. 0 = none (the right value for XFS). The root file system traditionally 1, others 2.
  elements:
  - kind: node
    x: 6
    y: 28
    w: 250
    h: 56
    tone: purple
