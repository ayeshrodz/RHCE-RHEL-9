questions:
  questions:
  - q: Which observation authorizes a practice mkfs target?
    options:
    - Its alphabetic position after the root disk.
    - A confirmed blank disposable secondary device with no mount or LVM use.
    - The device name alone.
    answer: 1
    explain: Disk identity and usage must be established, not inferred from a copied name.
    id: q-b351b93015c7
  - q: Can you shrink an XFS file system using resize2fs?
    options:
    - No; XFS does not support shrinking and resize2fs targets other formats.
    - Yes, if run as root.
    - Yes, if the volume is renamed.
    answer: 0
    explain: Filesystem capabilities and tools are format-specific.
    id: q-15d5ceab056b
  - q: Why verify the actual mount before writing data?
    options:
    - Mountpoints never hide other files.
    - An fstab line guarantees a live mount.
    - An absent mount can cause writes into the underlying root directory.
    answer: 2
    explain: Saved mount intent does not establish current mounted state.
    id: q-f82bdb791295
