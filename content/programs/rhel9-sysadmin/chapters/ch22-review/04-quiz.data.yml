questions:
  questions:
  - q: HTTP returns 200 with wrong page content. Is the service contract met?
    options:
    - Yes; status alone is sufficient.
    - Only if the firewall is disabled.
    - No; transport success and content correctness are separate checks.
    answer: 2
    explain: Acceptance should check meaningful behavior, not just a successful protocol status.
    id: q-9594be0a687e
  - q: Which recovery record is strongest?
    options:
    - Only a screenshot of a directory.
    - A verified restore followed by the original client operation and lifecycle checks.
    - Only the backup command exit code.
    answer: 1
    explain: Recovery evidence connects retained data to functioning service behavior.
    id: q-2d75c08732eb
  - q: Why introduce only one fault during a troubleshooting rehearsal?
    options:
    - To preserve a causal explanation and verify a narrow correction.
    - Because logs cannot contain multiple events.
    - Because Linux permits only one error.
    answer: 0
    explain: One controlled change makes the result interpretable and reduces unrelated weakening.
    id: q-7ef1948809d6
