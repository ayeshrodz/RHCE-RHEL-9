handover:
  title: A handover note
  caption: Select a section.
  height: 330
  mode: select
  initial: what
  info:
    what:
      tone: blue
      title: Purpose and hosts
      text: What the service is for, which hosts, which software and versions (rpm -q), who asked for it.
    changes:
      tone: purple
      title: What you changed
      text: 'Files and settings that you created or edited, in a list: accounts, content, httpd configuration, mappings, zone and port, units. Note the commands that created them.'
    ops:
      tone: green
      title: How to operate it
      text: Start, stop, reload and check commands, where the logs are, and how to read them.
    recover:
      tone: amber
      title: Backup and recovery
      text: What is saved, when, where, and the tested restore procedure with the time it took.
    faults:
      tone: coral
      title: Known failures
      text: 'Symptoms you met and what each meant: 403 after restore means the ACL is missing; "will not start" with a bind error means the port label.'
    limits:
      tone: gray
      title: Limits
      text: What you did not test. A lab on a clone distribution does not prove vendor-specific behaviour such as subscriptions, or every minor release.
  elements:
