recovery:
  title: Backup, loss and restore
  caption: Step through a tested recovery.
  height: 280
  mode: steps
  steps:
  - title: A scheduled backup
    text: 'A timer runs a one-shot service: tar --acls --selinux -czf /srv/backups/portal.tar.gz -C /srv portal. --acls and --selinux keep the extras that the web server needs.'
  - title: Something goes wrong
    text: The page is overwritten with wrong content (or the file is deleted). The service is up; only the content is wrong.
  - title: Restore into a staging directory
    text: 'Unpack into an empty directory first and look: tar --acls --selinux -xzf … -C /root/stage. Compare content, owner, ACL and label with what you expect.'
  - title: Replace only what is needed
    text: cp -a --preserve=all copies the one good file over the bad one with its attributes. Then restorecon -v checks the label, and the failing request is repeated.
  - title: Prove it after a reboot
    text: Reboot, then repeat the useful requests from the partner and from a stranger. Persistence is only proven by the same test after a restart.
