recall:
  cards:
  - front: HTTP returns 200 with wrong page content. Is the service contract met?
    back: No; transport success and content correctness are separate checks. Acceptance should check meaningful
      behavior, not just a successful protocol status.
  - front: Which recovery record is strongest?
    back: A verified restore followed by the original client operation and lifecycle checks. Recovery
      evidence connects retained data to functioning service behavior.
  - front: Why introduce only one fault during a troubleshooting rehearsal?
    back: To preserve a causal explanation and verify a narrow correction. One controlled change makes
      the result interpretable and reduces unrelated weakening.
