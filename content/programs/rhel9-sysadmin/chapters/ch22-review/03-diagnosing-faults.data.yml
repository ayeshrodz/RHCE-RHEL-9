method:
  title: One method for every fault
  caption: Step through a diagnosis.
  height: 270
  mode: steps
  steps:
  - title: State the failure
    text: Which operation fails, for whom, from where, since when, and what did you expect? "serverb gets 403 for http://servera:8090/ since this morning."
  - title: Gather a narrow baseline
    text: Service state and journal, listener, a local request, a remote request, the zone rules, owner, mode, ACL and label. Look first; change nothing.
  - title: Rank the hypotheses
    text: 'Use the symptom: refused, no route, timeout, 403, wrong content, fails to start. Each points to one or two layers.'
  - title: Change one thing
    text: Fix the most likely cause only. If you change three things you will not know which one helped, or which one weakened security.
  - title: Repeat the failing operation
    text: Run exactly the request that failed, from the same place. Then check that the other requirements still hold, and write down what you found.
