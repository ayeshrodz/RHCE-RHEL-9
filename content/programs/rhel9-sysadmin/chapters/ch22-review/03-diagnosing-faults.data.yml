symptoms:
  title: Symptom to layer
  caption: Select what the client sees.
  height: 340
  mode: select
  initial: refused
  info:
    refused:
      tone: purple
      title: Connection refused
      text: 'The packet arrived and nothing listens: the service is stopped, failed, or listens on another port or address. Chapter 9 (systemctl status, journal) and ss -tlnp.'
    noroute:
      tone: coral
      title: No route to host
      text: 'The firewall rejected it. Chapter 20: which zone judges the client, and does it allow the port?'
    timeout:
      tone: amber
      title: Timeout
      text: 'Packets are dropped or lost: a drop zone or source, a wrong address or route. Chapters 20 and 12.'
    forbidden:
      tone: blue
      title: 403 Forbidden
      text: 'The server runs but may not read the content: mode and ACL (chapter 7), the SELinux label (chapter 16), or the directory path.'
    content:
      tone: green
      title: 200 but wrong page
      text: Everything works technically and the content is wrong or old. Compare with the backup (chapter 14), check the document root, and restore.
    start:
      tone: gray
      title: Service will not start
      text: 'Read the journal: a permission error on a port means the SELinux port label (chapter 16); a syntax error means the configuration; "address in use" means another program.'
  elements:
  - kind: node
    x: 6
    y: 30
    w: 210
    h: 56
