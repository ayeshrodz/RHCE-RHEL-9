practice:
  text:
    hint: Click here and type the commands. This terminal remembers nothing between commands, so it shows each command's result as it was on servera.
    inputLabel: Command to run in the practice terminal
    eventNotFound: 'bash: {value0}: event not found'
    notHere: This practice terminal only knows the examples in this lesson. Try anything else on servera.
    notFound: 'bash: {value0}: command not found'
    searchPrompt: '(reverse-i-search)`{value0}'':'
    noMatch: no match yet
    tasksTitle: Your tasks
    allDone: All done. Now try the same on servera.
    doneLabel: done
    reset: Start again
  data: {}
  props:
    title: 'Practice terminal: the baseline'
    prompt: '[root@servera ~]#'
    commands:
    - cmd: systemctl status httpd --no-pager | head -3 | cut -c1-80
      out: "● httpd.service - The Apache HTTP Server\n     Loaded: loaded (/usr/lib/systemd/system/httpd.service; enabled; preset: disabled)\n     Active: active (running) since Sat 2026-10-03 20:31:38 UTC; 3min ago"
    - cmd: ss -tlnp | grep 8090 | awk '{print $1,$4}'
      out: LISTEN *:8090
    - cmd: curl -s -o /dev/null -w "%{http_code}\n" localhost:8090
      out: '403'
    - cmd: ls -lZ /srv/portal/index.html
      out: -rw-r-----+ 1 portaladm portal system_u:object_r:var_t:s0 18 Oct  3 20:30 /srv/portal/index.html
    - cmd: getfacl -cp /srv/portal/index.html | grep apache
      out: user:apache:r--
    - cmd: restorecon -v /srv/portal/index.html
      out: Relabeled /srv/portal/index.html from system_u:object_r:var_t:s0 to system_u:object_r:httpd_sys_content_t:s0
    - cmd: curl -s -o /dev/null -w "%{http_code}\n" localhost:8090
      out: '200'
    - cmd: firewall-cmd --zone=portal --list-ports
      out: 8090/tcp
    tasks:
    - text: Check the service, then what listens on 8090.
      commands:
      - systemctl status httpd --no-pager | head -3 | cut -c1-80
      - ss -tlnp | grep 8090 | awk '{print $1,$4}'
    - text: Make the failing request locally and read the status code.
      commands:
      - curl -s -o /dev/null -w "%{http_code}\n" localhost:8090
    - text: Look at the owner, ACL and label of the page.
      commands:
      - ls -lZ /srv/portal/index.html
      - getfacl -cp /srv/portal/index.html | grep apache
    - text: Correct the label with the stored mapping and repeat the request.
      commands:
      - restorecon -v /srv/portal/index.html
      - curl -s -o /dev/null -w "%{http_code}\n" localhost:8090
quick:
  questions:
  - id: q-67718eb0dfd1
    q: A user reports that a service "does not work". What is the first step?
    options:
    - Define the failed operation, caller and expected result
    - Restart everything
    - Disable the firewall
    answer: 0
    explain: Without a clear failure you cannot tell when it is fixed.
  - id: q-d9a8f9b6486e
    q: Why change only one thing at a time?
    options:
    - So you know which change fixed it and what it weakened
    - It is faster
    - Rules forbid more
    answer: 0
    explain: Three changes at once hide the cause.
  - id: q-e4e3b4949ada
    q: curl gives 403, httpd is active, the firewall is fine. Which two places do you look?
    options:
    - The SELinux label and the mode/ACL of the content
    - DNS and NTP
    - The journal of sshd
    answer: 0
    explain: The server runs but may not read the file.
  - id: q-7565e91a62d8
    q: A page is served with code 200 but shows old text. What do you suspect?
    options:
    - 'Wrong or stale content: compare with the backup and the document root'
    - The firewall
    - The port label
    answer: 0
    explain: Transport success does not prove correct content.
  - id: q-7820810640b6
    q: httpd will not start after you added Listen 8090. What do you read first?
    options:
    - The journal for a bind or permission error
    - The router
    - The mail log
    answer: 0
    explain: A permission error on a port is the SELinux port label.
  - id: q-5290ffbc7eb2
    q: After the fix, what must you repeat?
    options:
    - The exact failing request, from the original caller
    - Nothing
    - A reboot only
    answer: 0
    explain: Then check the other requirements, and write it down.
