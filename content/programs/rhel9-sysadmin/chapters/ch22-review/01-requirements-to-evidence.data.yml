build-order:
  title: A good build order
  caption: Step through delivering the portal.
  height: 270
  mode: steps
  steps:
  - title: 1. Write the contract
    text: List every requirement and the proof you will accept for it. If you cannot name the proof, the requirement is not clear yet.
  - title: 2. Identity and software
    text: Create the group and account, install httpd. Nothing else depends on guesses about who owns what.
  - title: 3. Files, labels, service
    text: Create the content with the right owner, mode and ACL, then labels and the port label, then configure and start the service. Test locally first.
  - title: 4. Network
    text: Open exactly one port for exactly one caller, and test from that caller and from a stranger.
  - title: 5. Persistence and recovery
    text: Persistent journal, scheduled backup, a restore test, and a reboot. Only the same test after the reboot proves persistence.
