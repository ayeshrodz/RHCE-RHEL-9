practice:
  text:
    hint: Click here and type the commands. This terminal remembers nothing between commands, so it shows each command's result as it was on servera.
    inputLabel: Command to run in the practice terminal
    eventNotFound: 'bash: {value0}: event not found'
    notHere: This practice terminal only knows the examples in this lesson. Try anything else on servera.
    notFound: 'bash: {value0}: command not found'
    searchPrompt: '(reverse-i-search)`{value0}'':'
    noMatch: no match yet
    tasksTitle: Your tasks
    allDone: All done. Now try the same on servera.
    doneLabel: done
    reset: Start again
  data: {}
  props:
    title: 'Practice terminal: collect evidence'
    prompt: '[root@servera ~]#'
    commands:
    - cmd: id portaladm
      out: uid=3001(portaladm) gid=4800(portal) groups=4800(portal)
    - cmd: rpm -q httpd
      out: httpd-2.4.62-13.el9_8.6.x86_64
    - cmd: systemctl is-active httpd; systemctl is-enabled httpd
      out: 'active

        enabled'
    - cmd: ss -tlnp | grep 8090 | awk '{print $1,$4}'
      out: LISTEN *:8090
    - cmd: ls -dZ /srv/portal
      out: system_u:object_r:httpd_sys_content_t:s0 /srv/portal
    - cmd: getfacl -cp /srv/portal | head -3
      out: 'user::rwx

        user:apache:r-x

        group::r-x'
    - cmd: getenforce
      out: Enforcing
    - cmd: semanage port -l | grep ^http_port_t
      out: http_port_t                    tcp      8090, 80, 81, 443, 488, 8008, 8009, 8443, 9000
    - cmd: firewall-cmd --get-active-zones
      out: "portal\n  sources: 172.25.250.11\npublic\n  interfaces: enp1s0"
    - cmd: firewall-cmd --zone=portal --list-ports
      out: 8090/tcp
    - cmd: curl -s localhost:8090
      out: 'Portal status: OK'
    - cmd: systemctl is-enabled portal-backup.timer
      out: enabled
    - cmd: ls -d /var/log/journal
      out: /var/log/journal
    tasks:
    - text: Show who owns the content account and that httpd is installed.
      commands:
      - id portaladm
      - rpm -q httpd
    - text: Show that the service runs, starts at boot and listens on 8090.
      commands:
      - systemctl is-active httpd; systemctl is-enabled httpd
      - ss -tlnp | grep 8090 | awk '{print $1,$4}'
    - text: 'Show the SELinux evidence: mode, label of the content and port label.'
      commands:
      - getenforce
      - ls -dZ /srv/portal
      - semanage port -l | grep ^http_port_t
    - text: Show the network evidence and the useful request.
      commands:
      - firewall-cmd --get-active-zones
      - firewall-cmd --zone=portal --list-ports
      - curl -s localhost:8090
quick:
  questions:
  - id: q-0e0f61029f51
    q: An active httpd service proves that...
    options:
    - The daemon runs; not that the content is right or reachable
    - The page is correct
    - The firewall is open
    answer: 0
    explain: You need a request to prove useful behaviour.
  - id: q-6b45c64ea436
    q: Which proof shows that a rule survives a reboot?
    options:
    - The same test after an actual reboot
    - The permanent configuration file alone
    - A successful reload
    answer: 0
    explain: Configuration shows intent; only a restart shows retention.
  - id: q-daa7bf8069e3
    q: Why test from the partner and from a stranger?
    options:
    - To prove the right caller is let in and others are not
    - To warm the cache
    - To test DNS
    answer: 0
    explain: A rule that lets everyone in also passes the first test.
  - id: q-4f656bbb9b72
    q: Which comes first when building a service?
    options:
    - A written contract with the proof for each requirement
    - Opening the firewall
    - Disabling SELinux
    answer: 0
    explain: No clear proof means no clear requirement.
  - id: q-04a1232da962
    q: The web server cannot read the content, though the owner and group are right. Which two layers do you check?
    options:
    - SELinux label and ACL/mode for the apache user
    - The DNS and the NTP
    - The disk space only
    answer: 0
    explain: Access is decided by mode, ACL and label together.
  - id: q-09f37f8ccfa8
    q: A backup exists. What else must you do before calling the recovery ready?
    options:
    - Restore it into a clean place and check the result
    - Nothing
    - Delete the live copy
    answer: 0
    explain: An untested backup is a hope.
