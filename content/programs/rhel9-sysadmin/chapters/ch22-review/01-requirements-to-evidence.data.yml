layers:
  title: One requirement, one layer
  caption: Select a requirement of the portal.
  height: 330
  mode: select
  initial: identity
  info:
    identity:
      tone: purple
      title: Identity (chapters 6, 7)
      text: 'The content belongs to the account portaladm and the group portal. The web server reads it through an ACL for the user apache. Proof: id, ls -l, getfacl.'
    software:
      tone: blue
      title: Software (chapter 13)
      text: 'httpd comes from the approved repositories. Proof: rpm -q httpd, dnf repolist.'
    service:
      tone: green
      title: Service (chapter 9)
      text: 'httpd runs now and starts at boot. Proof: systemctl is-active and is-enabled, plus a real request.'
    selinux:
      tone: coral
      title: SELinux (chapter 16)
      text: 'The content has the label httpd_sys_content_t through a stored mapping, the port 8090 is labelled http_port_t, and the system stays enforcing. Proof: ls -Z, semanage fcontext -l -C, semanage port -l, getenforce.'
    network:
      tone: amber
      title: Network (chapters 12, 20)
      text: 'Only the partner serverb may reach port 8090. Proof: firewall-cmd --list-all for the zone, and a request from serverb that works and one from workstation that does not.'
    recovery:
      tone: gray
      title: Logs and recovery (chapters 11, 14, 15)
      text: 'The journal is persistent and a timer saves the content daily. Proof: ls -d /var/log/journal, systemctl list-timers, and a restore that you actually tested.'
