title: Review and practice
goal: Deliver a small service the way you would in real work, with proof for every requirement, find and repair faults with one method, and leave a tested recovery and a handover note.
objectives:
  - Turn requirements into evidence and build a service layer by layer.
  - Diagnose faults from the client's symptom with a fixed method.
  - Restore data with its ACLs and labels, and write a handover note that states its limits.
objectiveIds:
  - ch22.evidence
  - ch22.faults
  - ch22.handover
