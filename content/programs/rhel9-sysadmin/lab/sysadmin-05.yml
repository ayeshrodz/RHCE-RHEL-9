name: sysadmin-05
title: Working with text
page: ch05/lab
transport: ssh
version: 1
starter:
- requirements.txt
checkpoints:
  final:
    files:
    - requirements.txt
    checks:
    - kind: file
      'on': control
      paths:
      - settings.conf
      lines:
      - listen=127.0.0.1
      - port=8081
      lacks:
      - port=8080
      id: check-1
      message: Verify file requirement 1 for Working with text
    - kind: file
      'on': control
      paths:
      - ready.txt
      lines:
      - web1
      - web2
      lacks:
      - web3
      - db1
      id: check-2
      message: Verify file requirement 2 for Working with text
    - kind: file
      'on': control
      paths:
      - changes.diff
      nonEmpty: true
      id: check-3
      message: Verify file requirement 3 for Working with text
