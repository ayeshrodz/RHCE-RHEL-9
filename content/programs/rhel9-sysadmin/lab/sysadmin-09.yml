name: sysadmin-09
title: Services and the boot process
page: ch09/lab
transport: ssh
version: 1
starter:
- requirements.txt
checkpoints:
  final:
    files:
    - requirements.txt
    checks:
    - kind: service
      'on': servera.lab.example.com
      names:
      - kp-heartbeat
      active: true
      enabled: true
      id: check-1
      message: Verify service requirement 1 for Services and the boot process
      targets:
      - servera.lab.example.com
    - kind: file
      'on': servera.lab.example.com
      paths:
      - /etc/systemd/system/kp-heartbeat.service
      contains:
      - User=kpheartbeat
      - ExecStart=/usr/bin/sleep infinity
      id: check-2
      message: Verify file requirement 2 for Services and the boot process
      targets:
      - servera.lab.example.com
    - kind: file
      'on': control
      paths:
      - observations.txt
      nonEmpty: true
      id: check-3
      message: Verify file requirement 3 for Services and the boot process
