name: sysadmin-20
title: The firewall
page: ch20/lab
transport: ssh
version: 1
starter:
- requirements.txt
checkpoints:
  final:
    files:
    - requirements.txt
    checks:
    - kind: service
      'on': servera.lab.example.com
      names:
      - httpd
      active: true
      enabled: true
      id: check-1
      message: Verify service requirement 1 for The firewall
      targets:
      - servera.lab.example.com
    - kind: firewall
      'on': servera.lab.example.com
      service: http
      allowed: true
      runtime: true
      permanent: true
      id: check-2
      message: Verify firewall requirement 2 for The firewall
      targets:
      - servera.lab.example.com
    - kind: http
      'on': servera.lab.example.com
      url: http://127.0.0.1/
      containsAny:
      - firewall-ready
      id: check-3
      message: Verify http requirement 3 for The firewall
      targets:
      - servera.lab.example.com
    - kind: file
      'on': control
      paths:
      - observations.txt
      nonEmpty: true
      id: check-4
      message: Verify file requirement 4 for The firewall
