name: sysadmin-19
title: Network file systems and autofs
page: ch19/lab
transport: ssh
version: 1
starter:
- requirements.txt
checkpoints:
  final:
    files:
    - requirements.txt
    checks:
    - kind: service
      'on': servera.lab.example.com
      names:
      - autofs
      active: true
      enabled: true
      id: check-1
      message: Verify service requirement 1 for Network file systems and autofs
      targets:
      - servera.lab.example.com
    - kind: file
      'on': servera.lab.example.com
      paths:
      - /mnt/team/docs/readme.txt
      line: nfs-ready
      id: check-2
      message: Verify file requirement 2 for Network file systems and autofs
      targets:
      - servera.lab.example.com
    - kind: service
      'on': serverb.lab.example.com
      names:
      - nfs-server
      active: true
      enabled: true
      id: check-3
      message: Verify service requirement 3 for Network file systems and autofs
      targets:
      - serverb.lab.example.com
    - kind: file
      'on': control
      paths:
      - nfs-evidence.txt
      nonEmpty: true
      id: check-4
      message: Verify file requirement 4 for Network file systems and autofs
