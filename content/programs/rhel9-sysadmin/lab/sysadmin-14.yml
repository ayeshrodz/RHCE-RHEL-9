name: sysadmin-14
title: Archives and file transfer
page: ch14/lab
version: 1
starter:
- requirements.txt
checkpoints:
  final:
    files:
    - requirements.txt
    checks:
    - kind: file
      'on': control
      paths:
      - backup.tar.gz
      nonEmpty: true
      id: check-1
      message: Verify file requirement 1 for Archives and file transfer
    - kind: file
      'on': control
      paths:
      - restore/conf/status.txt
      line: retained-data
      mode: '0640'
      id: check-2
      message: Verify file requirement 2 for Archives and file transfer
    - kind: file
      'on': control
      paths:
      - restore-notes.txt
      nonEmpty: true
      id: check-3
      message: Verify file requirement 3 for Archives and file transfer
