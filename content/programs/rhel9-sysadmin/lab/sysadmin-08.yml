name: sysadmin-08
title: Processes
page: ch08/lab
transport: ssh
version: 1
starter:
- requirements.txt
checkpoints:
  final:
    files:
    - requirements.txt
    checks:
    - kind: file
      'on': control
      paths:
      - process.txt
      contains:
      - sleep
      id: check-1
      message: Verify file requirement 1 for Processes
    - kind: file
      'on': control
      paths:
      - baseline.txt
      nonEmpty: true
      id: check-2
      message: Verify file requirement 2 for Processes
    - kind: file
      'on': control
      paths:
      - observations.txt
      nonEmpty: true
      id: check-3
      message: Verify file requirement 3 for Processes
