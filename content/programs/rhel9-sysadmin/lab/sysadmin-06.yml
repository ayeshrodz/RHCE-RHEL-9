name: sysadmin-06
title: Users and groups
page: ch06/lab
version: 1
starter:
- requirements.txt
- inventory
checkpoints:
  final:
    files:
    - requirements.txt
    checks:
    - kind: user
      'on': servera.lab.example.com
      names:
      - trainee
      groups:
      - operators
      id: check-1
      message: Verify user requirement 1 for Users and groups
      targets:
      - servera.lab.example.com
    - kind: sudoers
      'on': servera.lab.example.com
      path: /etc/sudoers.d/operators
      mode: '0440'
      valid: true
      id: check-2
      message: Verify sudoers requirement 2 for Users and groups
      targets:
      - servera.lab.example.com
    - kind: file
      'on': control
      paths:
      - observations.txt
      nonEmpty: true
      id: check-3
      message: Verify file requirement 3 for Users and groups
