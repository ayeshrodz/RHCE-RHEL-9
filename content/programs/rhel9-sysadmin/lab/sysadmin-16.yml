name: sysadmin-16
title: SELinux
page: ch16/lab
version: 1
starter:
- requirements.txt
- inventory
checkpoints:
  final:
    files:
    - requirements.txt
    checks:
    - kind: selinux
      'on': servera.lab.example.com
      mode: enforcing
      persistent: true
      id: check-1
      message: Verify selinux requirement 1 for SELinux
      targets:
      - servera.lab.example.com
    - kind: file
      'on': servera.lab.example.com
      paths:
      - /srv/site/index.html
      line: policy-ready
      selinuxType: httpd_sys_content_t
      id: check-2
      message: Verify file requirement 2 for SELinux
      targets:
      - servera.lab.example.com
    - kind: http
      'on': servera.lab.example.com
      url: http://127.0.0.1/
      containsAny:
      - policy-ready
      id: check-3
      message: Verify http requirement 3 for SELinux
      targets:
      - servera.lab.example.com
    - kind: file
      'on': control
      paths:
      - observations.txt
      nonEmpty: true
      id: check-4
      message: Verify file requirement 4 for SELinux
