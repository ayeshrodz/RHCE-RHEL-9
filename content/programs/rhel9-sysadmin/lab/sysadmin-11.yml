name: sysadmin-11
title: Logs and time
page: ch11/lab
transport: ssh
version: 1
starter:
- requirements.txt
checkpoints:
  final:
    files:
    - requirements.txt
    checks:
    - kind: file
      'on': servera.lab.example.com
      paths:
      - /etc/systemd/journald.conf.d/10-persistent.conf
      line: Storage=persistent
      id: check-1
      message: Verify file requirement 1 for Logs and time
      targets:
      - servera.lab.example.com
    - kind: service
      'on': servera.lab.example.com
      names:
      - chronyd
      active: true
      enabled: true
      id: check-2
      message: Verify service requirement 2 for Logs and time
      targets:
      - servera.lab.example.com
    - kind: file
      'on': control
      paths:
      - previous-boot.txt
      contains:
      - persistent event before reboot
      id: check-3
      message: Verify file requirement 3 for Logs and time
    - kind: file
      'on': control
      paths:
      - time-evidence.txt
      nonEmpty: true
      id: check-4
      message: Verify file requirement 4 for Logs and time
