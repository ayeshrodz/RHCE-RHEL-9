annotated-yaml:
  text:
    ayamlHint: click a line
    widgetLabel: "Lines "
  data: {}
  props:
    title: newbie.yml
    code: |
      ---
      - name: Configure important user consistently
        hosts: servera.lab.example.com
        tasks:
          - name: Newbie exists with UID 4000
            ansible.builtin.user:
              name: newbie
              uid: 4000
              state: present
    notes:
      - lines:
          - 1
          - 1
        title: Start of the document
        text: Three dashes mark the start of a YAML document. A playbook may end with three dots (...), but that is usually left out.
      - lines:
          - 2
          - 9
        title: A play is one item in a list
        text: The dash and space at the start of line 2 begin the first (and here, only) item in the playbook’s list of plays. Everything indented under it belongs to that play.
      - lines:
          - 2
          - 2
        title: "name: labels the play"
        text: "An arbitrary string that describes the play. It is optional but strongly recommended: it is printed when the play runs, which makes long runs much easier to follow."
      - lines:
          - 3
          - 3
        title: "hosts: chooses the targets"
        text: "A host pattern: a host name, a group name like webservers, or all. The play’s tasks run against the matching hosts from the inventory. Note it lines up exactly with name above it."
      - lines:
          - 4
          - 4
        title: "tasks: the work to do"
        text: The value of tasks is a list of tasks, run in order. It is the same indentation as name and hosts, because all three are keys of the same play.
      - lines:
          - 5
          - 5
        title: A task, with its own name
        text: "Each task is a list item under tasks, so it starts with a dash. name is again optional but recommended: it documents the step and is shown in the output."
      - lines:
          - 6
          - 6
        title: The module to run
        text: ansible.builtin.user is the fully qualified collection name (FQCN) of the module this task runs. It sits at the same indentation as the task’s name, because both are keys of the same task.
      - lines:
          - 7
          - 9
        title: Module arguments
        text: "Indented one more level, these key-value pairs are passed to the module: the user newbie must exist (state: present) with UID 4000. The module decides whether any change is needed."
play-recap:
  text:
    widgetLabel: "PLAY RECAP: click a counter"
    span: "serverc.lab.example.com : "
    button: =
    recapExplain: ": "
  data:
    counters:
      - key: ok
        value: 4
        tone: term-ok
        text: Tasks that ran successfully, including those that changed something. Gathering Facts counts here too.
      - key: changed
        value: 3
        tone: term-changed
        text: Tasks that modified the host to reach the desired state. On an immediate second run this should drop to 0.
      - key: unreachable
        value: 0
        tone: ""
        text: "Ansible could not connect at all: wrong hostname, SSH down, bad key or wrong remote_user. The host is dropped from the rest of the play."
      - key: failed
        value: 0
        tone: ""
        text: A task ran but returned an error. By default the rest of the play is skipped for that host.
      - key: skipped
        value: 0
        tone: ""
        text: Tasks that did not run because a condition (when:) was false. You will meet conditionals in chapter 5.
      - key: rescued
        value: 0
        tone: ""
        text: Failures that were caught and handled by a rescue section of a block (chapter 5).
      - key: ignored
        value: 0
        tone: ""
        text: "Failures that were ignored because the task set ignore_errors: true (chapter 5)."
    initialSelection1: changed
verbosity:
  text:
    widgetLabel: Output verbosity
    label: Verbosity level
    termMuted: "$ ansible-navigator run -m stdout webserver.yml "
    widgetCaption: Illustrative, abridged output. Each level includes everything from the levels before it.
  data:
    levels:
      - flag: default
        text: Play and task names with ok / changed per host.
        lines:
          - TASK [Latest httpd version installed] ****
          - "changed: [servera.lab.example.com]"
      - flag: -v
        text: Adds each task’s result.
        lines:
          - 'changed: [servera.lab.example.com] => {"changed": true, "msg": "", "rc": 0,'
          - '    "results": ["Installed: httpd-2.4.53-7.el9.x86_64", …]}'
      - flag: -vv
        text: "Adds the task configuration: which file and line the task came from."
        lines:
          - "task path: /home/student/playdemo/webserver.yml:5"
          - 'changed: [servera.lab.example.com] => {"changed": true, …}'
      - flag: -vvv
        text: "Adds connection details: the SSH user, the commands used to reach the host."
        lines:
          - "<servera.lab.example.com> ESTABLISH SSH CONNECTION FOR USER: devops"
          - "<servera.lab.example.com> SSH: EXEC ssh -C -o ControlMaster=auto …"
      - flag: -vvvv
        text: "Adds connection plug-in debugging: users used to run scripts on the host and what was executed."
        lines:
          - "<servera.lab.example.com> SSH: EXEC ssh -vvv -C -o ControlMaster=auto …"
          - "debug1: Reading configuration data /etc/ssh/ssh_config …"
