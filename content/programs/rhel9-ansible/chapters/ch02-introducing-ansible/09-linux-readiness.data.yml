linux-foundations:
  questions:
    - id: q-9c9d12485bf2
      legacyIndex: 0
      q: A service is enabled but inactive. What does that tell you?
      options:
        - It is running now
        - It is configured to start at boot, but is not running now
        - It cannot start
      answer: 1
      explain: enabled controls startup; active describes the current state.
    - id: q-c842c1ac6ddc
      legacyIndex: 1
      q: What does chmod 0600 secrets.yml allow?
      options:
        - Everybody can read it
        - Only the owner can read and write it
        - The owner can execute it
      answer: 1
      explain: 6 grants owner read and write. Both other permission groups receive 0.
    - id: q-9e054599d164
      legacyIndex: 2
      q: SSH by address works but SSH by hostname fails. Where do you look first?
      options:
        - Name resolution
        - File permissions
        - The package manager
      answer: 0
      explain: Compare getent hosts with the known address before changing SSH configuration.
    - id: q-1eb5931907d1
      legacyIndex: 3
      q: Ansible connects as devops and a task needs root. Which concept do you need?
      options:
        - become
        - gather_facts
        - loop
      answer: 0
      explain: become requests privilege escalation after establishing the connection.
