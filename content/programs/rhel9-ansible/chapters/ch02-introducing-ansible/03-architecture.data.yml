  text:
    widgetLabel: servera right now
    li: httpd installed
    li2: index.html correct
    li3: httpd running
    label: Matches the playbook
    label2: Differs from the playbook
    btn: " Run the playbook"
    widgetLabel2: " Cause drift"
    btn2: " Fresh host"
    termMuted: "$ ansible-navigator run -m stdout site.yml # press “Run the playbook”"
    termDrift: "⚡ "
    termDrift2: " on servera"
    termMuted2: "$ ansible-navigator run -m stdout site.yml # run "
    p: PLAY [Web server is configured] ****
    termOk: "ok: [servera] Gathering Facts"
    p2: ": [servera] "
    p3: "PLAY RECAP servera : "
    termOk2: ok=
    span: changed=
    p4: failed=0
  data:
    tasks:
      - key: pkg
        name: Ensure httpd package is present
        drift: Someone removed httpd
      - key: page
        name: Ensure index.html is present
        drift: Someone edited index.html
      - key: svc
        name: Ensure httpd is started
        drift: Someone stopped httpd
check:
  questions:
    - id: q-ce081d4ff720
      legacyIndex: 0
      q: Which file defines the actions that Ansible performs on managed hosts?
      options:
        - The inventory
        - A manifest
        - A playbook
        - A shell script
      answer: 2
      explain: A playbook describes the plays and tasks to run. The inventory only says which hosts exist and how they are grouped.
    - id: q-bfb138b6b29d
      legacyIndex: 1
      q: A task fails on `serverb` but succeeds on `servera` and `serverc`. By default, what does Ansible do next?
      options:
        - Stops the whole playbook immediately for every host
        - Skips the rest of the playbook for `serverb` and continues with `servera` and `serverc`
        - Retries the task on `serverb` until it succeeds
      answer: 1
      explain: By default a failure removes that host from the rest of the run while the others continue.
    - id: q-67165513eb48
      legacyIndex: 2
      q: You run a correct playbook twice in a row. What should the second run report?
      options:
        - "`changed` for every task"
        - "`changed=0`, because everything is already in the desired state"
        - "`failed` for tasks that already ran"
      answer: 1
      explain: Idempotent tasks see the host is already correct and report `ok` without changing anything.
