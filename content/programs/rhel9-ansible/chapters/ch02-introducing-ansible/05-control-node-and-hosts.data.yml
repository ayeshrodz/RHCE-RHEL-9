check:
  questions:
    - id: q-b64af50d3717
      legacyIndex: 0
      q: Why do network modules usually run on the control node rather than on the device?
      options:
        - Network devices are too slow to run modules
        - Most network devices cannot run Python, so the module runs locally and talks to the device over SSH, XML or an API
        - SSH is not available on network devices
      answer: 1
      explain: Because routers and switches typically lack Python, Ansible runs their modules on the control node and uses special connection methods to reach the device.
    - id: q-fc8525167abf
      legacyIndex: 1
      q: Which of these must be installed on a RHEL managed host for most modules to work?
      options:
        - ansible-navigator
        - Python 3.8 or later
        - podman
      answer: 1
      explain: Managed hosts need Python (and SSH access). ansible-navigator and podman are only needed on the control node.
