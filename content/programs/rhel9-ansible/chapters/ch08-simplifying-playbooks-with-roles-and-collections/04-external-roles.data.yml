check:
  questions:
    - id: q-511474222e03
      legacyIndex: 0
      q: Which requirements entry installs a role from a Git repository?
      options:
        - "`- src: git@git.example.com:ops/bash_env` with `scm: git`"
        - "`- git: git@git.example.com:ops/bash_env`"
        - "`- name: bash_env` with `type: git`"
      answer: 0
      explain: "src says where it comes from, and scm: git says it is a Git repository."
    - id: q-c6114494446e
      legacyIndex: 1
      q: You install a role without `-p` and without `roles_path` in ansible.cfg. Where does it go?
      options:
        - Into the project’s roles directory
        - Into ~/.ansible/roles, outside the project
        - "Nowhere: -p is required"
      answer: 1
      explain: It goes to the first directory of the default roles_path, which navigator in an execution environment cannot see.
    - id: q-aabd9abf876f
      legacyIndex: 2
      q: What does `-p roles` do in `ansible-galaxy role install`?
      options:
        - Installs the role on the managed hosts
        - Installs into the `roles` directory of the project
        - Prints the role without installing
      answer: 1
      explain: Without -p the role goes to the first directory in roles_path, usually ~/.ansible/roles.
    - id: q-63912fbfaba8
      legacyIndex: 3
      q: Which key sets the name a role is installed under?
      options:
        - "`src`"
        - "`name`"
        - "`scm`"
      answer: 1
      explain: src says where it comes from; name is what your plays call it.
    - id: q-5218d4f3de08
      legacyIndex: 4
      q: Why pin `version` in a requirements file?
      options:
        - It is required syntax
        - So everyone installs the same, reviewed release
        - It makes the download faster
      answer: 1
      explain: Without a version you get whatever is newest on the day you install.
