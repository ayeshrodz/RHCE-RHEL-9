chapter:
  questions:
    - id: q-1a7e4c9b2f05
      q: You edited `site.yml` and ran `git add site.yml`. Where is that version of the file now?
      options:
        - "In the staging area: it will be in the next commit"
        - In the local repository, as a new commit
        - On the remote
      answer: 0
      explain: "`git add` stages the change. Only `git commit` records it in the repository, and only `git push` sends it to the remote."
    - id: q-5c2d8e0a6b13
      q: Which command copies a remote repository, with its whole history, into a new directory?
      options:
        - "`git clone`"
        - "`git pull`"
        - "`git init`"
      answer: 0
      explain: "`git clone` creates the local repository and checks out the files. `git pull` updates a clone you already have."
    - id: q-8f3b1d7e4a29
      q: What does `git status --short` mean by `??` in front of a file?
      options:
        - Git does not track the file
        - The file has a merge conflict
        - The file is staged
      answer: 0
      explain: Untracked files are listed with `??` until you add them or list them in `.gitignore`.
    - id: q-0d6a9c3e7b54
      q: After every run, `ansible-navigator.log` appears in `git status`. What is the right fix?
      options:
        - Add `ansible-navigator.log` to `.gitignore` and commit `.gitignore`
        - Commit the log so the working tree is clean
        - Delete the log before every commit
      answer: 0
      explain: Generated files do not belong in the history. A committed `.gitignore` keeps them out for everyone who clones the project.
    - id: q-4e9c2a5f8d31
      q: A teammate pushed while you were working, and `git push` is rejected with "fetch first". In which order do you run the commands?
      options:
        - "`git pull`, then `git push`"
        - "`git push --force`"
        - "`git clone`, then `git push`"
      answer: 0
      explain: Pulling combines their commit with yours; then your push succeeds. Forcing would throw their commit away.
    - id: q-b7e1f4a0c962
      q: Your password file was committed and pushed last week. Deleting it in a new commit makes it safe. True or false?
      options:
        - "False: earlier commits and every clone still contain it, so change the password"
        - "True: the newest commit no longer has it"
      answer: 0
      explain: Git keeps every version. Treat a pushed secret as exposed and replace it.
    - id: q-3a8d0e6b1c47
      q: What is the main purpose of a development container?
      options:
        - To give everyone who works on a project the same editing, linting and testing tools
        - To replace the managed hosts
        - To encrypt playbooks
      answer: 0
      explain: The image fixes the toolset. The playbook still runs against the real managed hosts.
    - id: q-6c0f2b9e5a18
      q: You run the development container with `podman run`. Which option lets it log in to the managed hosts with your key?
      options:
        - '`-v "$HOME/.ssh:/root/.ssh:ro"`'
        - "`-w /workdir`"
        - "`--rm`"
      answer: 0
      explain: The container needs your SSH key. Mounting `.ssh` read-only gives it the key without letting it change your files.
    - id: q-d2a5e8f1b034
      q: Which file makes `ansible-navigator run site.yml` use an execution environment for everyone who clones the project?
      options:
        - "`ansible-navigator.yml` in the project"
        - "`.devcontainer/devcontainer.json`"
        - "`~/.ansible-navigator.yml`"
      answer: 0
      explain: The project file is committed with the project, and navigator reads it before the home-directory file.
    - id: q-9b4c7a1d0e85
      q: '`ansible-lint` reports `yaml[octal-values]: Forbidden implicit octal value "0644"`. What is the fix?'
      options:
        - 'Quote the mode: `mode: "0644"`'
        - "Remove the leading zero: `mode: 644`"
        - Disable the rule
      answer: 0
      explain: "Without quotes, YAML may read the number differently. `mode: 644` would even set the wrong permissions (chapter 6)."
practice:
  questions:
    - id: git-review-stage
      objective: ch12.git
      title: Review before you commit
      prompt: You changed two files and staged only one of them. Which command shows exactly what your next commit will contain?
      options:
        - "`git diff --cached`"
        - "`git diff`"
        - "`git log -p`"
        - "`git status --short`"
      expected: "`git diff --cached`"
      explain: "`git diff --cached` compares the staging area with the last commit. `git diff` shows the changes you have not staged, and `git status` lists files without their content."
    - id: runtime-versions
      objective: ch12.development
      title: Which engine ran it?
      prompt: Workstation has ansible-core 2.14. The project's `ansible-navigator.yml` enables an execution environment with ansible-core 2.21. Which version runs `ansible-navigator run site.yml` from the project directory?
      options:
        - 2.21, from the execution environment
        - 2.14, from workstation
        - Both, one after the other
      expected: 2.21, from the execution environment
      explain: With the execution environment enabled, navigator runs the playbook inside the image. Check it with `ansible-navigator exec -- ansible --version`.
