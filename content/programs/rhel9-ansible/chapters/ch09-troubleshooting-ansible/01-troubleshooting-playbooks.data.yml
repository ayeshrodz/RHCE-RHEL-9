run-stages:
  text:
    title: Where a run can go wrong
    strong: "Signs: "
    template: "{value0} · {value1}"
  data:
    stages:
      - id: parse
        title: Read the playbook
        sub: YAML and task syntax
        tone: purple
        signs: "ERROR! before any PLAY line: a YAML problem, a misindented argument, a misspelt module name."
        tools:
          - ansible-navigator run --syntax-check
          - read the line and column in the message, and the line above it
      - id: hosts
        title: Pick the hosts
        sub: inventory and patterns
        tone: amber
        signs: "A warning that a pattern matched nothing, “skipping: no hosts matched”, or a play that runs on fewer hosts than you expected."
        tools:
          - --list-hosts
          - ansible-navigator inventory -m stdout --graph
          - ansible-navigator inventory -m stdout --host NAME
      - id: connect
        title: Connect
        sub: SSH as remote_user
        tone: blue
        signs: "UNREACHABLE! with an SSH message: the name does not resolve, no route to the address, or permission denied for the user."
        tools:
          - ansible HOST -m ansible.builtin.ping
          - ssh USER@HOST by hand
          - -vvv shows the exact ssh command
      - id: escalate
        title: Become root
        sub: sudo
        tone: teal
        signs: FAILED (not unreachable) with “Missing sudo password”, “Permission denied” or “Destination … not writable”.
        tools:
          - check become in ansible.cfg and the play
          - ansible HOST -m ansible.builtin.command -a id --become
      - id: module
        title: Run the task
        sub: module and arguments
        tone: green
        signs: FAILED with a message about an argument, an undefined variable, a template error, or a missing library on the host.
        tools:
          - ansible-navigator doc MODULE -m stdout
          - debug the variables involved
          - --start-at-task after a fix
      - id: result
        title: Check the result
        sub: does it really work?
        tone: red
        signs: Everything is ok or changed, yet the service is not what you wanted. Ansible did exactly what the playbook says.
        tools:
          - a test play with uri, stat or assert
          - curl, ssh and the service’s own logs
          - --check --diff before the next change
    initialSelection1: parse
error-decoder:
  text:
    widgetLabel: Error decoder
    label: Stage
    strong: "What it means: "
    strong2: "Fix: "
  data:
    errors:
      - stage: Read
        msg: "ERROR! We were unable to read either as JSON nor YAML … found unacceptable key (unhashable type: 'AnsibleMapping') … name: {{ web_package }}"
        cause: A value starts with {{ but is not quoted, so YAML reads it as a dictionary.
        fix: 'Quote the whole value: name: "{{ web_package }}".'
      - stage: Read
        msg: "ERROR! conflicting action statements: ansible.builtin.service, state"
        cause: A module argument is indented at the level of the module name, so Ansible sees two things that look like modules in one task.
        fix: Indent the arguments two spaces further than the module name.
      - stage: Read
        msg: ERROR! couldn't resolve module/action 'ansible.builtin.servise'. This often indicates a misspelling, missing collection, or incorrect module path.
        cause: The module name is misspelt, or its collection is not installed or not on collections_path.
        fix: Check the spelling against ansible-navigator doc; install the collection if it is missing.
      - stage: Hosts
        msg: "[WARNING]: Could not match supplied host pattern, ignoring: webserver"
        cause: The play’s hosts line names a group or host the inventory does not have. Often a plural or a typo.
        fix: Compare with ansible-navigator inventory --graph and correct the pattern.
      - stage: Connect
        msg: "UNREACHABLE! … ssh: Could not resolve hostname serverz.lab.example.com: Name or service not known"
        cause: The name cannot be found in DNS or /etc/hosts.
        fix: Fix the name in the inventory, or give the host an ansible_host address.
      - stage: Connect
        msg: "UNREACHABLE! … ssh: connect to host 172.25.250.211 port 22: No route to host"
        cause: Nothing answers at that address. Here an ansible_host variable pointed at the wrong IP.
        fix: ansible-navigator inventory --host NAME shows the variables in force; correct or remove ansible_host.
      - stage: Connect
        msg: "UNREACHABLE! … operator1@serverc.lab.example.com: Permission denied (publickey,gssapi-keyex,gssapi-with-mic,password)."
        cause: The host answered but refused this user. The user is wrong (remote_user or ansible_user) or has no key there.
        fix: Check which user Ansible used (-vvv shows it), then fix the setting or install the key.
      - stage: Escalate
        msg: 'FAILED! … "msg": "Missing sudo password"'
        cause: become is on, but the connecting user needs a password for sudo and none was given.
        fix: Connect as a user with passwordless sudo, or run with --ask-become-pass.
      - stage: Escalate
        msg: 'FAILED! … "msg": "Destination /etc not writable"'
        cause: "The task writes a root-owned file but runs as the ordinary remote user: become is off."
        fix: "Set become: true for the play, or become = true in ansible.cfg."
      - stage: Task
        msg: "FAILED! => {\"msg\": \"The task includes an option with an undefined variable. The error was: 'web_srv' is undefined …\"}"
        cause: A variable is used that is not defined, often a typo of one that is.
        fix: Compare the name with the vars section; debug the variable to see its value.
      - stage: Task
        msg: 'FAILED! => {"changed": false, "msg": "value of state must be one of: reloaded, restarted, started, stopped, got: start"}'
        cause: The module received an argument value it does not accept.
        fix: The message lists the accepted values; ansible-navigator doc shows them all.
      - stage: Task
        msg: "FAILED! => {\"msg\": \"AnsibleError: template error while templating string: unexpected '}'. …\"}"
        cause: The Jinja2 template has a syntax error, here a missing closing brace.
        fix: The message quotes the template text; look for an unbalanced {{ }} or {% %}.
      - stage: Task
        msg: ERROR! The requested handler 'restart web' was not found in either the main handlers list nor in the listening handlers list
        cause: A notify names a handler that does not exist. Handler names must match exactly.
        fix: Make the notify line and the handler’s name identical.
      - stage: Result
        msg: '"msg": "Status code was -1 and not [200]: Request failed: <urlopen error [Errno 113] No route to host>"'
        cause: The web server may be running, but the host’s firewall rejects the connection.
        fix: Open the service with ansible.posix.firewalld, permanent and immediate.
    stages:
      - All
      - Read
      - Hosts
      - Connect
      - Escalate
      - Task
      - Result
    initialSelection1: All
verbosity:
  text:
    widgetLabel: Output verbosity
    label: Verbosity level
    termMuted: "$ ansible-navigator run -m stdout webserver.yml "
    widgetCaption: Illustrative, abridged output. Each level includes everything from the levels before it.
  data:
    levels:
      - flag: default
        text: Play and task names with ok / changed per host.
        lines:
          - TASK [Latest httpd version installed] ****
          - "changed: [servera.lab.example.com]"
      - flag: -v
        text: Adds each task’s result.
        lines:
          - 'changed: [servera.lab.example.com] => {"changed": true, "msg": "", "rc": 0,'
          - '    "results": ["Installed: httpd-2.4.53-7.el9.x86_64", …]}'
      - flag: -vv
        text: "Adds the task configuration: which file and line the task came from."
        lines:
          - "task path: /home/student/playdemo/webserver.yml:5"
          - 'changed: [servera.lab.example.com] => {"changed": true, …}'
      - flag: -vvv
        text: "Adds connection details: the SSH user, the commands used to reach the host."
        lines:
          - "<servera.lab.example.com> ESTABLISH SSH CONNECTION FOR USER: devops"
          - "<servera.lab.example.com> SSH: EXEC ssh -C -o ControlMaster=auto …"
      - flag: -vvvv
        text: "Adds connection plug-in debugging: users used to run scripts on the host and what was executed."
        lines:
          - "<servera.lab.example.com> SSH: EXEC ssh -vvv -C -o ControlMaster=auto …"
          - "debug1: Reading configuration data /etc/ssh/ssh_config …"
check-mode-sim:
  text:
    template: "{value0} {value1}"
    label: TASK [Message of the day is in place]
    label2: "--- before: /etc/motd"
    label3: "+++ after: …/motd.j2"
    label4: "@@ -0,0 +1,2 @@"
    label5: +This is servera.lab.example.com.
    label6: "+Contact: ops@example.com"
    label7: "changed: [servera.lab.example.com]"
    label8: TASK [Report uptime]
    label9: "skipping: [servera.lab.example.com]"
    label10: "changed: [servera.lab.example.com]"
    label11: RUNNING HANDLER [restart chronyd]
    label12: "changed: [servera.lab.example.com]"
    template2: "servera.lab.example.com    : ok={value0}    changed={value1}    skipped={value2}"
    label13: Nothing on servera changed. Every changed line means “would change”.
    label14: "The command task was skipped: Ansible cannot know what a command would do, so check mode does not run it."
    label15: The handler is reported because the template would have notified it; it did not really restart anything.
    label16: Check mode cannot see every failure. A template task without privilege escalation still reports “changed” here, and only fails with “Destination /etc not writable” in a real run.
    label17: "This is a real run: the file was written, the command ran and the handler restarted the service."
    label18: --diff shows the lines each file task adds (+) or removes (−). It works with or without --check.
    widgetLabel: Preview a change
    code: --check
    code2: --diff
    template3: ansible-navigator run -m stdout motd.yml{value0}{value1}
  data: {}
check:
  questions:
    - id: q-ef0d23e20533
      legacyIndex: 0
      q: A run prints `ERROR!` and no `PLAY` line. What happened?
      options:
        - A host was unreachable
        - Ansible could not read the playbook, so nothing ran
        - A task failed on every host
      answer: 1
      explain: Errors before the first PLAY line come from reading the playbook.
    - id: q-265ddbb289ff
      legacyIndex: 1
      q: Which mistake does `--syntax-check` catch?
      options:
        - An undefined variable
        - An argument indented at the same level as the module name
        - A value a module does not accept
      answer: 1
      explain: Indentation and YAML problems are found while reading; the others only appear when the task runs.
    - id: q-dca5034edcb6
      legacyIndex: 2
      q: You want every run written to a file with timestamps. What do you set?
      options:
        - "`log_path` in ansible.cfg"
        - "`-vvvv`"
        - "`--step`"
      answer: 0
      explain: log_path makes Ansible append each run’s output to that file.
    - id: q-9ffee9966e37
      legacyIndex: 3
      q: In check mode, what happens to an `ansible.builtin.command` task?
      options:
        - It runs as usual
        - It is skipped
        - It fails
      answer: 1
      explain: Ansible cannot predict what a command would change, so it does not run it in check mode.
    - id: q-8adf4213343f
      legacyIndex: 4
      q: A playbook of 40 tasks failed on task 38. After fixing it, what saves time?
      options:
        - "`--syntax-check`"
        - "`--start-at-task` with the name of task 38"
        - "`--diff`"
      answer: 1
      explain: It skips the tasks before the named one. Mind any registered variables they would have set.
