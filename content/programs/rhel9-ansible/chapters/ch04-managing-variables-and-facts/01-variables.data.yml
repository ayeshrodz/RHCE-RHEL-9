variable-substitution:
  text:
    widgetLabel: "vars:"
    code: ":"
    template: Value of {value0}
    widgetLabel2: task you write
    vsubToggle: " quote the value"
    template2: |-
      - name: Create the user {{ user }}
        ansible.builtin.user:
          name: {value0}
          home: {value1}
    label: What Ansible runs
    label2: What Ansible says
    termMuted: "TASK [Create the user "
    termMuted2: "] ****"
    termChanged: "changed: [servera] => user “"
    termChanged2: "” with home "
    termFail: ERROR! Syntax Error while loading YAML.
    label3: |2+
      
        found unacceptable key (unhashable type: ‘AnsibleMapping’)

    label4: |2
          name: {{ user }}
                ^ here
    label5: |-
      We could be wrong, but this one looks like it might be an issue with
      missing quotes. Always quote template expression brackets when they
      start a value.
    label6: The task name can use {{ }} freely because the value starts with text. A value that starts with {{ must be quoted.
    label7: Without quotes, YAML reads the opening { as the start of a dictionary, before Ansible ever sees the variable.
  data: {}
