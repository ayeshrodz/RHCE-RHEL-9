register-flow:
  text:
    title: Capturing a task result with register
    caption: Every module returns a JSON result. register saves it as a variable, so later tasks can print it, test it or reuse it.
    label: Task 1
    title2: ansible.builtin.dnf
    sub: "name: httpd"
    title3: "register: install_result"
    label2: returns
    title4: install_result
    sub2: "changed: false"
    sub3: "rc: 0"
    sub4: 'msg: ""'
    sub5: "results: [ … ]"
    label3: Later tasks
    title5: debug
    sub6: "var: install_result"
    title6: "when:"
    sub7: install_result.changed
    title7: "msg:"
    sub8: "{{ install_result.rc }}"
    label4: "(when: is covered in chapter 5)"
  data: {}
check:
  questions:
    - id: q-f7726edba898
      legacyIndex: 0
      q: Which of these is a valid variable name?
      options:
        - "`web-server`"
        - "`2nd_disk`"
        - "`db_port_2`"
        - "`app.version`"
      answer: 2
      explain: Names must start with a letter and use only letters, numbers and underscores. Dashes and dots are not allowed, and a name cannot start with a digit.
    - id: q-343b4cdbcdb0
      legacyIndex: 1
      q: Why does this task fail to load?
      code: |-
        - name: Install the web package
          ansible.builtin.dnf:
            name: {{ web_pkg }}
      options:
        - "`web_pkg` is not defined"
        - The value starts with `{{` and is not quoted, so YAML reads it as a dictionary
        - Task names cannot be followed by a module
      answer: 1
      explain: 'Write `name: "{{ web_pkg }}"`. Quotes are needed whenever a variable reference starts the value.'
    - id: q-9520ce229011
      legacyIndex: 2
      q: "Where does `register: result` go?"
      options:
        - Indented under the module, with the module arguments
        - At the task level, aligned with the module name and `name:`
        - In the play’s `vars` block
      answer: 1
      explain: "`register` is a task keyword, like `name`. It saves the whole module result as the variable `result`."
