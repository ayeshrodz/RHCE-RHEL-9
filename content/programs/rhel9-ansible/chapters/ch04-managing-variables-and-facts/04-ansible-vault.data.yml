vault-flow:
  text:
    title: How Ansible Vault protects a secret
    caption: The secret is only ever stored encrypted. ansible-navigator decrypts it in memory while the playbook runs, using a password you supply.
    title2: secret.yml
    sub: plain text
    sub2: "web_pass: redhat"
    label: encrypt
    title3: secret.yml
    sub3: $ANSIBLE_VAULT;1.1;AES256
    sub4: 6231386563383461653…
    sub5: safe to commit to Git
    title4: Vault password
    sub6: prompt or password file
    label2: unlocks
    label3: read at run time
    label4: ansible-navigator run
    title5: web_pass = redhat
    sub7: decrypted in memory only
    label5: Never on disk in plain text,
    label6: never in Git history.
  data: {}
vault-commands:
  text:
    vcState: no file
    vcState2: " encrypted"
    vcState3: " plain text"
    label: ansible-vault subcommands
    termMuted: "[student@workstation ~]$ "
    template: |-
      
      {value0}: ********
  data:
    commands:
      - cmd: create
        run: ansible-vault create secret.yml
        before: null
        after: locked
        prompts:
          - New Vault password
          - Confirm New Vault password
        text: Makes a new encrypted file. It asks for a new password, then opens your editor (vi by default; set EDITOR=nano to change it). When you save and quit, the content is encrypted.
      - cmd: view
        run: ansible-vault view secret.yml
        before: locked
        after: locked
        prompts:
          - Vault password
        text: Prints the decrypted content to the terminal without changing the file. Use it whenever you only need to read.
      - cmd: edit
        run: ansible-vault edit secret.yml
        before: locked
        after: locked
        prompts:
          - Vault password
        text: Decrypts to a temporary file, opens your editor, then re-encrypts and removes the temporary copy. It always rewrites the file, which shows up as a change in Git even if you edited nothing, so prefer view for reading.
      - cmd: encrypt
        run: ansible-vault encrypt secret1.yml secret2.yml
        before: open
        after: locked
        prompts:
          - New Vault password
          - Confirm New Vault password
        text: Encrypts files that already exist, in place. Accepts several files at once. Add --output=NEW_FILE to write the result to a new name (one input file only).
      - cmd: decrypt
        run: ansible-vault decrypt secret1.yml --output=secret1-decrypted.yml
        before: locked
        after: open
        prompts:
          - Vault password
        text: Removes the encryption permanently. With a single file, --output writes the plain text to a different name and leaves the original encrypted.
      - cmd: rekey
        run: ansible-vault rekey secret.yml
        before: locked
        after: locked
        prompts:
          - Vault password
          - New Vault password
          - Confirm New Vault password
        text: Changes the password. It works on several files at once. With password files, use --new-vault-password-file for the new one.
project-tree:
  props:
    paths:
      - ansible.cfg
      - group_vars/webservers/vars
      - host_vars/demo.example.com/vars
      - host_vars/demo.example.com/vault
      - inventory
      - playbook.yml
    locked:
      - host_vars/demo.example.com/vault
    notes:
      group_vars/webservers/vars: used by every host in webservers
      host_vars/demo.example.com/vars: "plain text: ports, paths, names"
      host_vars/demo.example.com/vault: "encrypted: passwords, keys"
    caption: demo.example.com uses both of its files; only vault is encrypted.
check:
  questions:
    - id: q-752f20a29f62
      legacyIndex: 0
      q: You only need to read an encrypted file. Which command should you use?
      options:
        - "`ansible-vault edit`"
        - "`ansible-vault view`"
        - "`ansible-vault decrypt`"
      answer: 1
      explain: "`view` prints the content and leaves the file untouched. `edit` rewrites it, and `decrypt` removes the encryption."
    - id: q-0d8bf55e01da
      legacyIndex: 1
      q: "`ansible-navigator run -m stdout site.yml --vault-id @prompt` hangs without asking for a password. Why?"
      options:
        - The Vault ID is missing a label
        - Playbook artifacts are still enabled
        - The file was encrypted with rekey
      answer: 1
      explain: Navigator can only prompt when playbook artifacts are disabled, with `--playbook-artifact-enable false` or in ansible-navigator.yml.
    - id: q-f3739d6a5912
      legacyIndex: 2
      q: Which command changes the password of an encrypted file?
      options:
        - "`ansible-vault passwd`"
        - "`ansible-vault rekey`"
        - "`ansible-vault encrypt --new`"
      answer: 1
      explain: "`rekey` asks for the current password and then the new one. It can rekey several files at once."
    - id: q-b34368d61149
      legacyIndex: 3
      q: What is the safest way to keep one host’s passwords out of plain text while its other variables stay readable?
      options:
        - Encrypt the whole inventory file
        - Make `host_vars/HOST` a directory and encrypt just the file that holds the secrets
        - Pass the passwords with `-e` every time
      answer: 1
      explain: All files in a host_vars/HOST directory apply to that host, so you can encrypt only the sensitive one.
