readiness-checklist:
  text:
    widgetLabel: Readiness checklist
    readyScore: " of "
    readyScore2: " confident · "
    readyScore3: " rated"
    label: Chapters
    template: "Chapter {value0}: {value1}, {value2} of {value3} rated"
    readyCount: /
    link: "Chapter "
    link2: ": "
    label2: How sure are you?
    p: Rate each objective honestly. Anything marked not yet or shaky shows up here with where to go back to.
    p2: "Nothing marked weak. "
    label3: Rate the remaining objectives, then
    p3: " prove it: do the four review labs without opening the solutions."
    p4: "Go back to these before the review labs:"
    link3: "Chapter "
    link4: ": "
    readyWeak: " weak"
    span: then practise in
    readyReset: Clear my ratings
