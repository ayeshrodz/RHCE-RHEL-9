      lab_playbooks:
        path: /ch11/lab-review-playbooks
        label: 11.3 Creating playbooks
      lab_admin:
        path: /ch11/lab-review-admin
        label: 11.4 Managing hosts
      lab_roles:
        path: /ch11/lab-review-roles
