  info:
    site:
      title: site.yml
      text: "The entry point. It contains no tasks of its own: each line brings in a complete playbook, in order."
      tone: purple
      code: |-
        - name: Web tier
          ansible.builtin.import_playbook: web.yml

        - name: Database tier
          ansible.builtin.import_playbook: db.yml
    web:
      title: web.yml
      text: "An ordinary playbook you can also run by itself. Its play reuses two task files: one imported, one included in a loop."
      tone: blue
      code: |-
        - name: Web servers are configured
          hosts: web
          tasks:
            - name: Packages
              ansible.builtin.import_tasks: tasks/install.yml
              vars:
                packages: [httpd, firewalld]

            - name: Firewall
              ansible.builtin.include_tasks: tasks/firewall.yml
              loop: [http, https]
    db:
      title: db.yml
      text: A second playbook for another group of hosts. It reuses the same install.yml with a different package list.
      tone: blue
      code: |-
        - name: Database servers are configured
          hosts: db
          tasks:
            - name: Packages
              ansible.builtin.import_tasks: tasks/install.yml
              vars:
                packages: [mariadb-server]
    install:
      title: tasks/install.yml
      text: "A task file: a plain list of tasks, with no hosts line and no tasks keyword. It says nothing about which packages; the caller passes them in."
      tone: teal
      code: |-
        - name: Packages are installed
          ansible.builtin.dnf:
            name: "{{ packages }}"
            state: present
    firewall:
      title: tasks/firewall.yml
      text: Another task file, written for one firewalld service at a time. Included in a loop, it runs once for each service, which it receives as item.
      tone: teal
      code: |-
        - name: "{{ item }} is allowed"
          ansible.posix.firewalld:
            service: "{{ item }}"
            permanent: true
            immediate: true
            state: enabled
reuse-simulator:
  text:
    template: TASK [{value0}] {value1}
    t: ERROR! You cannot use loops on 'import_tasks' statements. You should use 'include_tasks' instead.
    label: An import is resolved while the playbook is being read, before any loop could run. The playbook is rejected without running anything.
    t2: "skipping: [servera]"
    t3: "ok: [servera]"
    label2: The two tasks were copied into the play when the playbook was parsed. The import line itself never appears in the output.
    label3: ansible-navigator run --list-tasks can show them, and --start-at-task can start at one of them.
    label4: The when was copied onto each imported task, so each task tests the condition for itself.
    label5: Web tasks
    t4: "skipping: [servera]"
    t5: "included: /home/student/project/tasks/web.yml for servera{value0}"
    t6: "ok: [servera]"
    label6: Web tasks
    label7: The include is a real task. The file is only read when the play reaches that task, host by host.
    label8: The condition is tested once, on the include itself. It was false, so the file was never even opened.
    label9: The file ran once per item. Each pass sees the current item, passed here as the variable pkg.
    label10: --list-tasks shows only the include, because the tasks inside are not known until it runs.
    template2: |-
      - name: Web tasks
        ansible.builtin.{value0}: tasks/web.yml{value1}{value2}
    widgetLabel: import_tasks or include_tasks?
    label11: Keyword
    label12: Condition
    label13: no when
    label14: "when: true"
    label15: "when: false"
    label16: Loop
    button: no loop
    button2: loop
    reuseCap: The task in your play
    reuseCap2: --list-tasks shows
    template3: "  {value0}"
    label17: "  (nothing: the playbook does not load)"
    reuseCap3: When the play runs
  data:
    tasks:
      - Web package is present
      - Web service is started
    initialSelection1: import_tasks
    initialSelection2: none
check:
  questions:
    - id: q-f70bb30c717f
      legacyIndex: 0
      q: Where can `import_playbook` appear?
      options:
        - Inside the tasks of a play
        - At the top level of a playbook, where a play would go
        - In ansible.cfg
      answer: 1
      explain: It imports whole plays, so it sits alongside plays, never inside one.
    - id: q-cafe4c3dc3ea
      legacyIndex: 1
      q: What does a task file contain?
      options:
        - One or more plays
        - A YAML list of tasks, with no hosts or tasks keyword
        - Variables only
      answer: 1
      explain: A task file is just the list that would otherwise sit under tasks:.
    - id: q-455afe6df3df
      legacyIndex: 2
      q: You need to run a task file once for each item in a list. Which keyword?
      options:
        - "`import_tasks` with `loop`"
        - "`include_tasks` with `loop`"
        - "`import_playbook` with `loop`"
      answer: 1
      explain: Imports are resolved before loops exist; Ansible rejects a loop on import_tasks.
    - id: q-7a005083d533
      legacyIndex: 3
      q: "A play has `import_tasks: tasks/web.yml` with `when: deploy_web`, and `deploy_web` is false. What appears in the output?"
      options:
        - "One skipped task: the import"
        - Every task from the file, each one skipped
        - Nothing at all
      answer: 1
      explain: The when is copied onto each imported task, so each is listed and skipped.
    - id: q-aa049ecc1c41
      legacyIndex: 4
      q: Which keyword lets `ansible-navigator run --list-tasks` show the tasks inside the file?
      options:
        - "`import_tasks`"
        - "`include_tasks`"
        - Both
      answer: 0
      explain: Only static imports are known when the playbook is parsed.
