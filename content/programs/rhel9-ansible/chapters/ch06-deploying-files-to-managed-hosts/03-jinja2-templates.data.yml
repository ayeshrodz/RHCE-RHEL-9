  steps:
    - title: One template
      text: templates/motd.j2 lives in the project on the control node. It is plain text with {{ }} placeholders.
    - title: Per-host data
      text: For each host in the play, Ansible has that host’s own variables and gathered facts.
    - title: Render on the control node
      text: The template module fills in the placeholders once per host. The managed hosts never see Jinja2 syntax, and do not need Jinja2 installed.
    - title: Copy the result
      text: Each host receives its own finished file, with the owner, group and mode the task asked for.
    - title: "Run again: nothing to do"
      text: The rendered text is compared with the file already on the host. Identical content means ok, not changed, so handlers are not notified.
template-playground:
  text:
    ansiblemanaged: Ansible managed
    widgetLabel: Template playground
    label: Example template
    widgetSub: "Edit the template on the left. The right side is the file the "
    code: template
    widgetSub2: " module would write on the chosen host. Available here: "
    code2: ansible_facts
    widgetSub3: ", "
    code3: hostvars
    widgetSub4: ", "
    code4: groups
    widgetSub5: ", "
    code5: inventory_hostname
    widgetSub6: ","
    code6: system_owner
    widgetSub7: " and "
    code7: users
    widgetSub8: .
    tplFile: templates/example.j2
    btn: " Reset"
    label2: Jinja2 template
    tplFile2: rendered on
    label3: Managed host
    template: |-
      fatal: [{value0}]: FAILED!
      AnsibleError: {value1}
    tplFoot: "Facts shown are for "
    label4: the home lab (Rocky Linux)
    label5: a RHEL classroom
    tplFoot2: . A variable that is not defined stops the task, as it does in Ansible.
  data:
    hosts:
      servera.lab.example.com:
        hostname: servera
        ip: 172.25.250.10
        mem: 960
        cpus: 1
      serverb.lab.example.com:
        hostname: serverb
        ip: 172.25.250.11
        mem: 1960
        cpus: 2
      workstation.lab.example.com:
        hostname: workstation
        ip: 172.25.250.9
        mem: 3900
        cpus: 2
    presets:
      - id: motd
        label: Variables and facts
        template: |
          {# /etc/motd: this comment never reaches the file #}
          This is the system {{ ansible_facts['fqdn'] }}.
          This is a {{ ansible_facts['distribution'] }} version {{ ansible_facts['distribution_version'] }} system.
          Only use this system with permission.
          Please report issues to: {{ system_owner }}.
      - id: for
        label: for loop
        template: |
          # {{ ansible_managed }}
          {% for host in groups['all'] %}
          {{ hostvars[host]['ansible_facts']['default_ipv4']['address'] }} {{ hostvars[host]['ansible_facts']['fqdn'] }} {{ hostvars[host]['ansible_facts']['hostname'] }}
          {% endfor %}
      - id: forif
        label: for with a condition
        template: |
          {# every user except root #}
          {% for myuser in users if not myuser == "root" %}
          User number {{ loop.index }} - {{ myuser }}
          {% endfor %}
      - id: if
        label: if / else
        template: |
          {% if ansible_facts['memtotal_mb'] >= 1024 %}
          MaxClients 200
          {% else %}
          MaxClients 50   # small host: {{ ansible_facts['memtotal_mb'] }} MiB
          {% endif %}
          {% if inventory_hostname in groups['webservers'] %}
          Role: web server
          {% endif %}
      - id: filters
        label: Filters
        template: |
          Owner: {{ system_owner | upper }}
          Users: {{ users | join(', ') }} ({{ users | length }} in total)
          Backup host: {{ backup_host | default('none configured') }}

          as JSON: {{ users | to_json }}
          as YAML:
          {{ users | to_nice_yaml }}
    initialSelection1: motd
    initialSelection2: servera.lab.example.com
check:
  questions:
    - id: q-2749ef28936e
      legacyIndex: 0
      q: Which delimiter holds a `for` loop?
      options:
        - "`{{ }}`"
        - "`{% %}`"
        - "`{# #}`"
      answer: 1
      explain: "{% %} is for statements: for, if, and their end tags."
    - id: q-68bb6cffabc1
      legacyIndex: 1
      q: Where is a template rendered?
      options:
        - On the managed host
        - On the control node, once for each host
        - In the execution environment image at build time
      answer: 1
      explain: The control node renders it with that host’s variables and facts, then copies the finished file.
    - id: q-1dcef18899fd
      legacyIndex: 2
      q: "What does `validate: /usr/sbin/visudo -cf %s` do in a template task?"
      options:
        - Checks the deployed file after every run
        - Checks the rendered file before it replaces the real one, and aborts on failure
        - Checks the template syntax
      answer: 1
      explain: "%s is the temporary rendered file. A failed check leaves the existing file untouched."
    - id: q-d53a95b62ecd
      legacyIndex: 3
      q: In `{% for u in users if u != "root" %}`, the list has four users including root. What is `loop.index` on the last pass?
      options:
        - "4"
        - "3"
        - "2"
      answer: 1
      explain: The condition filters the list first, so the loop sees three items and counts 1, 2, 3.
    - id: q-e4d6d95f5540
      legacyIndex: 4
      q: Can you use `{% if %}` to skip a task in a playbook?
      options:
        - Yes
        - No, use `when`
      answer: 1
      explain: Jinja2 control structures are for template files. Tasks use when and loop.
