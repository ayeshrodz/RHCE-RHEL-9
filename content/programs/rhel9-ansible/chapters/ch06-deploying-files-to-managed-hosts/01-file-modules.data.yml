fetch-layout:
  text:
    template: |-
      secure-backups/
      └── secure          ← {value0} hosts wrote this one file
    template2: |-
      secure-backups/
      {value0}
    widgetLabel: Where fetched files land
    label: flat option
    button: "flat: false"
    button2: "flat: true"
    template3: |-
      - name: Fetch the secure log
        ansible.builtin.fetch:
          src: /var/log/secure
          dest: secure-backups{value0}
          flat: {value1}
    span: "With "
    code: "flat: true"
    span2: " every host's file is saved under the same name, so each one overwrites the last. Put the host name in "
    code2: dest
    span3: " yourself, for example "
    label2: 'dest: "secure-backups/{{ inventory_hostname }}-secure"'
    span4: .
    span5: "The default adds the host name and the file's full path under "
    code3: dest
    span6: ", so files from different hosts never collide."
  data:
    hosts:
      - servera.lab.example.com
      - serverb.lab.example.com
  dependencies:
