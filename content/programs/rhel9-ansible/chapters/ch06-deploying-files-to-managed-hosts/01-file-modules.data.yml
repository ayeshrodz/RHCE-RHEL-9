    widgetLabel: Permission calculator
    label: Common modes
    th: read
    th2: write
    th3: execute
    th4: digit
    template: "{value0} {value1}"
    template2: |-
      mode: '{value0}'        # octal, quoted
      mode: {value1}   # symbolic
    modeHint: "Both lines mean the same. Symbolic modes can also be relative, for example "
    code: u+rw,g-wx,o-rwx
    modeHint2: .
    p: "Write "
    code2: "mode: "
    p2: " without the leading zero and quotes, and YAML reads the "
    strong: decimal
    p3: " number"
    p4: ", which is octal "
    p5: ": the file ends up as "
    p6: ". Always quote the mode:"
    code3: "'"
    code4: "'"
    p7: .
  data:
    who:
      - - u
        - user (owner)
      - - g
        - group
      - - o
        - others
    presets:
      - "0644"
      - "0600"
      - "0640"
      - "0755"
      - "0750"
      - "0440"
