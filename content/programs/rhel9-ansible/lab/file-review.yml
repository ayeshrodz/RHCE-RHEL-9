name: file-review
title: "Chapter lab: Deploying files to managed hosts"
page: ch06/chapter-lab
version: 2
starter: ["ansible.cfg", "inventory", "files/issue"]
checkpoints:
  final:
    files: ["inventory", "motd.yml", "serverb_facts.yml", "templates/motd.j2"]
    checks:
      - {"id": "motd", "kind": "file", "on": "all", "message": "Rendered message includes host identity and contains no Jinja placeholders", "targets": ["serverb.lab.example.com"], "paths": ["/etc/motd"], "nonEmpty": true, "contains": ["{hostShort}"], "lacks": ["{{"]}
      - {"id": "mode", "kind": "file", "on": "all", "message": "Message of the day is root-owned with mode 0644", "targets": ["serverb.lab.example.com"], "paths": ["/etc/motd"], "mode": "0644", "owner": "root", "group": "root"}
      - {"id": "banner", "kind": "file", "on": "all", "message": "Network banner links to the local issue file", "targets": ["serverb.lab.example.com"], "paths": ["/etc/issue.net"], "symlinkTo": "/etc/issue"}
