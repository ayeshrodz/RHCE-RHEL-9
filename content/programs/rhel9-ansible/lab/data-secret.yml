name: data-secret
title: "Managing secrets"
page: ch04/lab-vault
version: 2
starter: ["ansible.cfg", "inventory"]
setup:
  - {"action": "password-hash-var", "path": "secret.yml", "variable": "pwhash", "password": "redhat", "commented": true, "before": ["#username: ansibleuser1"]}
  - {"action": "vault-encrypt", "path": "secret.yml", "password": "redhat"}
checkpoints:
  final:
    files: ["create_users.yml", "inventory"]
    checks:
      - {"id": "account", "kind": "user", "on": "devservers", "message": "Vault-defined account exists with a password hash", "targets": ["servera.lab.example.com"], "names": ["ansibleuser1"], "passwordSet": true}
      - {"id": "ciphertext", "kind": "file", "on": "control", "message": "secret.yml is encrypted with Ansible Vault", "paths": ["secret.yml"], "nonEmpty": true, "contains": ["$ANSIBLE_VAULT;"]}
      - {"id": "vault-permissions", "kind": "file", "on": "control", "message": "The Vault password file is private to you", "paths": ["vault-pass"], "nonEmpty": true, "mode": "0600"}
