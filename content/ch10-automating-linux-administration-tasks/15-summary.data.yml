flashcards:
  cards:
    - front: Update every package on a host?
      back: '`ansible.builtin.dnf` with `name: "*"` and `state: latest`.'
    - front: Install a package group?
      back: '`name: "@Group Name"`, quoted.'
    - front: Which module writes a .repo file?
      back: "`ansible.builtin.yum_repository`"
    - front: Where are installed packages after package_facts?
      back: "`ansible_facts['packages']['NAME']`, a list of versions."
    - front: Keep a user in their other groups?
      back: "`append: true` with `groups:`."
    - front: Make a password task idempotent?
      back: "`update_password: on_create`, or a fixed salt in `password_hash`."
    - front: Safe way to add a sudo rule?
      back: "A file in `/etc/sudoers.d/` with `validate: /usr/sbin/visudo -cf %s`."
    - front: How does the cron module recognise its job?
      back: "By `name`, stored as `#Ansible: NAME` in the crontab."
    - front: Set the default boot target?
      back: Link `/etc/systemd/system/default.target` to the target unit.
    - front: Grow a logical volume and its file system?
      back: "`community.general.lvol` with a bigger `size` and `resizefs: true`."
    - front: "mount `state: mounted` vs `present`?"
      back: "mounted: now and in fstab. present: only in fstab."
    - front: Where to practise network changes?
      back: On an extra (for example dummy) interface, not the one Ansible uses.
    - front: unarchive an archive that is already on the managed host?
      back: "Add `remote_src: true`; otherwise `src` is read from the control node."
    - front: What does a trailing slash on archive `path` change?
      back: Only the directory's contents are packed, so they extract straight into `dest`.
