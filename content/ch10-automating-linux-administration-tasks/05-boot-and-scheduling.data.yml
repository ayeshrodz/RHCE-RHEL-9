cron-builder:
  text:
    template: every {value0} minutes
    label: every minute
    template2: at {value0}:{value1}
    template3: at minute {value0} of every hour
    template4: at minute {value0}, hour {value1}
    template5: on day {value0} of the month
    template6: in month {value0}
    label2: Monday to Friday
    template7: on {value0}
    template8: on weekdays {value0}
    label3: every day
    initial: tar czf /tmp/app.tgz -C /srv app
    label4: "- name: Archive app data"
    label5: "  ansible.builtin.cron:"
    label6: "    name: Archive app data"
    label7: "    user: appadmin"
    template9: '    {value0}: "{value1}"'
    template10: "    job: {value0}"
    label8: "    state: present"
    widgetLabel: Cron schedule builder
    span: job
    cronSay: "Runs "
    cronSay2: .
    cronCap: The task
    cronCap2: What lands in appadmin's crontab
    template11: |-
      #Ansible: Archive app data
      {value0} {value1}
    cronNote: "Fields you leave out default to "
    code: "*"
    cronNote2: ". The "
    code2: "#Ansible:"
    cronNote3: " comment is how the module finds its own entry again, so the "
    code3: name
    cronNote4: " must stay the same."
  data:
    fields:
      - key: minute
        label: minute
        hint: 0–59
      - key: hour
        label: hour
        hint: 0–23
      - key: day
        label: day
        hint: 1–31
      - key: month
        label: month
        hint: 1–12
      - key: weekday
        label: weekday
        hint: 0–6, Sun = 0
    presets:
      - label: every 5 minutes
        v:
          minute: "*/5"
          hour: "*"
          day: "*"
          month: "*"
          weekday: "*"
      - label: 02:30 every night
        v:
          minute: "30"
          hour: "2"
          day: "*"
          month: "*"
          weekday: "*"
      - label: weekdays at 09:00
        v:
          minute: "0"
          hour: "9"
          day: "*"
          month: "*"
          weekday: 1-5
      - label: first of the month
        v:
          minute: "0"
          hour: "0"
          day: "1"
          month: "*"
          weekday: "*"
      - label: Sundays 23:15
        v:
          minute: "15"
          hour: "23"
          day: "*"
          month: "*"
          weekday: "0"
    days:
      - Sunday
      - Monday
      - Tuesday
      - Wednesday
      - Thursday
      - Friday
      - Saturday
check:
  questions:
    - id: q-35d91b308bed
      legacyIndex: 0
      q: How does `ansible.builtin.cron` find its own entry on a later run?
      options:
        - By the job command
        - By the `name`, written as a comment in the crontab
        - By the schedule
      answer: 1
      explain: Keep the name stable; changing it creates a new entry.
    - id: q-9f5eb8001434
      legacyIndex: 1
      q: Which state should a normal service task use to make sure httpd is running?
      options:
        - "`restarted`"
        - "`started`"
        - "`reloaded`"
      answer: 1
      explain: started is idempotent. restarted restarts on every run, so it belongs in a handler.
    - id: q-88c3ef36faf2
      legacyIndex: 2
      q: What does `ansible.builtin.reboot` do after rebooting?
      options:
        - Ends the play
        - Waits until the host answers again, then continues
        - "Nothing: it only schedules a reboot"
      answer: 1
      explain: The rest of the play runs against the freshly booted host.
    - id: q-3369f89f8c94
      legacyIndex: 3
      q: "Why use `unique: true` with ansible.posix.at?"
      options:
        - To run the job as a unique user
        - So repeated runs do not queue the same job again
        - It is required
      answer: 1
      explain: Without it every run of the playbook adds another copy of the job.
