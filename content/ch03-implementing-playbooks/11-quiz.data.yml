chapter:
  questions:
    - id: q-70242dabb6d6
      legacyIndex: 0
      q: Which inventory line matches `server01.example.com` through `server20.example.com`, but not `server7.example.com`?
      options:
        - "`server[1:20].example.com`"
        - "`server[01:20].example.com`"
        - "`server[01-20].example.com`"
      answer: 1
      explain: Ranges use a colon and are inclusive. The leading zero is part of the pattern, so it matches server07 but not server7.
    - id: q-a1bff0e94e56
      legacyIndex: 1
      q: Which inventory section makes the group `prod` contain the groups `web` and `db`?
      options:
        - "`[prod:hosts]`"
        - "`[prod:children]`"
        - "`[prod:groups]`"
        - "`[prod:vars]`"
      answer: 1
      explain: The `:children` suffix lists child groups. `:vars` sets group variables.
    - id: q-602807f829d7
      legacyIndex: 2
      q: Which two groups exist in every inventory without being defined?
      options:
        - "`all` and `ungrouped`"
        - "`all` and `localhost`"
        - "`default` and `ungrouped`"
      answer: 0
      explain: "`all` contains every host; `ungrouped` contains hosts that are in no other group."
    - id: q-44ef14e3c050
      legacyIndex: 3
      q: Which command shows the hosts in group `us`, including those inherited from child groups, as a tree?
      options:
        - "`ansible-navigator inventory -m stdout --list us`"
        - "`ansible-navigator inventory -m stdout --graph us`"
        - "`ansible-navigator inventory -m stdout --host us`"
      answer: 1
      explain: "`--graph` prints a tree; `--list` prints JSON for the whole inventory; `--host` shows variables for one host."
    - id: q-a3f0b6da3a1a
      legacyIndex: 4
      q: You run ansible-navigator from `/home/student/project`, which contains `ansible.cfg`. `ANSIBLE_CONFIG` is unset. Which file is used?
      options:
        - "`/etc/ansible/ansible.cfg`"
        - "`~/.ansible.cfg`"
        - "`/home/student/project/ansible.cfg`"
      answer: 2
      explain: After the ANSIBLE_CONFIG variable, the current directory comes first. Only that one file is read.
    - id: q-1c96368d8778
      legacyIndex: 5
      q: In `ansible.cfg`, which section holds `become`, `become_method` and `become_user`?
      options:
        - "`[defaults]`"
        - "`[privilege_escalation]`"
        - "`[ssh_connection]`"
      answer: 1
      explain: Connection defaults such as inventory and remote_user go in `[defaults]`; sudo settings go in `[privilege_escalation]`.
    - id: q-6780847b3652
      legacyIndex: 6
      q: Which `ansible-navigator.yml` setting must be disabled so navigator can prompt you for a password?
      options:
        - "`execution-environment.pull`"
        - "`playbook-artifact.enable`"
        - "`mode`"
      answer: 1
      explain: "Set `playbook-artifact: enable: false`, and run with `-m stdout`."
    - id: q-d397f9692f89
      legacyIndex: 7
      q: Why is this task a syntax error?
      code: |-
        - name:Install httpd
          ansible.builtin.dnf:
            name: httpd
      options:
        - Task names cannot contain spaces
        - There is no space after `name:`
        - "`dnf` needs a `state` argument"
      answer: 1
      explain: YAML needs a space after the colon in a key-value pair. `state` is optional (it defaults to present).
    - id: q-3872b08b2232
      legacyIndex: 8
      q: What does `ansible-navigator run -m stdout site.yml --check` do?
      options:
        - Checks the YAML syntax only
        - Runs the playbook and reports what would change, without changing anything
        - Runs the playbook twice to check idempotency
      answer: 1
      explain: That is check mode, a dry run. `--syntax-check` only parses the file.
    - id: q-511ba85e82ab
      legacyIndex: 9
      q: The second run of a playbook shows `changed=1` on every run for the same task. What is the most likely cause?
      options:
        - The host is unreachable
        - The task uses `ansible.builtin.command` or `shell` without `creates`/`removes`
        - Gathering Facts failed
      answer: 1
      explain: Command-style modules report changed every time. Use a purpose-built module, or add creates/removes.
    - id: q-5155f2b86c8d
      legacyIndex: 10
      q: "A playbook has two plays. Play 1 has `become: true`; play 2 has `become: false`. `ansible.cfg` has `become = true`. How does play 2 run?"
      options:
        - As root, because ansible.cfg wins
        - Without privilege escalation
        - It fails with a conflict error
      answer: 1
      explain: Play keywords override ansible.cfg for that play.
    - id: q-a053b25f02cd
      legacyIndex: 11
      q: Which option gives the most detailed output, including connection plug-in debugging?
      options:
        - "`-v`"
        - "`-vv`"
        - "`-vvv`"
        - "`-vvvv`"
      answer: 3
      explain: Each extra v adds more. -vvv adds connection details; -vvvv adds connection plug-in verbosity.
practice:
  questions:
    - id: inventory-selection
      objective: ch03.inventory
      title: Select the web hosts
      prompt: Which host pattern selects exactly web1 and web2 from this inventory?
      code: |-
        [web]
        web1
        web2
        [db]
        db1
      options:
        - "`web`"
        - "`all`"
        - "`web,db`"
        - "`ungrouped`"
      expected: "`web`"
      explain: A group name is a host pattern, so `web` selects both of its hosts without naming them. `all` and `web,db` add db1, and `ungrouped` is empty here.
    - id: repair-play
      objective: ch03.playbooks
      title: Repair a playbook
      prompt: This should be a play for web with one task that installs httpd. What is the fix?
      code: |-
        - hosts: web
          ansible.builtin.dnf:
            name: httpd
            state: present
      options:
        - Put the module call in a list item under a `tasks:` key
        - "Indent `hosts: web` under the module arguments"
        - Replace `ansible.builtin.dnf` with `ansible.builtin.command`
        - "Add `become: true` to the play"
      expected: Put the module call in a list item under a `tasks:` key
      explain: "`hosts` belongs to the play, and a module call belongs to a task. A play lists its tasks under `tasks:`."
