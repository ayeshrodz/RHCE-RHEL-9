flashcards:
  cards:
    - front: Where do a role’s tasks normally start?
      back: "`tasks/main.yml`. No individual file is mandatory for every kind of role."
    - front: Where do user-changeable role settings go?
      back: "`defaults/main.yml`: lowest precedence, so anything overrides them."
    - front: What is special about `vars/main.yml` in a role?
      back: "High precedence: inventory and play variables do **not** override it."
    - front: In what order does a play run its sections?
      back: "`pre_tasks` → roles → `tasks` → `post_tasks`, with handlers flushed between stages."
    - front: How do you create a role skeleton?
      back: "`ansible-galaxy role init roles/NAME`"
    - front: How do you run a role from the task list, conditionally?
      back: "`ansible.builtin.include_role` with `name:` and a `when`."
    - front: What does `dependencies` in `meta/main.yml` do?
      back: Runs the listed roles **before** this role, automatically.
    - front: Full name of the timesync system role?
      back: "`redhat.rhel_system_roles.timesync`"
    - front: Where are system role docs and examples?
      back: "`/usr/share/doc/rhel-system-roles/ROLE/`"
    - front: Install all roles a project needs?
      back: "`ansible-galaxy role install -r roles/requirements.yml -p roles`"
    - front: The three parts of an FQCN?
      back: "`namespace.collection.name`, for example `ansible.posix.firewalld`."
    - front: '"couldn’t resolve module/action": where is the problem?'
      back: "On the **control node**: collection missing, misspelt, or not on `collections_path`."
